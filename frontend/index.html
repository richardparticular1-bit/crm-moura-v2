<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM · Moura Odontologia</title>
<meta name="theme-color" content="#134e4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --teal-950:#042f2e;--teal-900:#134e4a;--teal-800:#115e59;--teal-700:#0f766e;--teal-300:#5eead4;--teal-100:#ccfbf1;
  --ink:#0f172a;--mut:#64748b;--soft:#94a3b8;--bg:#f1f5f4;--card:#fff;--line:#e2e8f0;
  --amber:#d97706;--amber-bg:#fffbeb;--green:#059669;--green-bg:#ecfdf5;--rose:#e11d48;--rose-bg:#fff1f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-700);outline-offset:-1px}
.app{display:flex;flex-direction:column;min-height:100dvh}
@media(min-width:768px){.app{flex-direction:row}}
.side{background:var(--teal-900);color:var(--teal-100);display:flex;flex-direction:row;position:fixed;bottom:0;left:0;right:0;z-index:30;overflow-x:auto;padding:6px;gap:2px;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
@media(min-width:768px){.side{position:static;flex-direction:column;width:230px;min-height:100dvh;padding:0;box-shadow:none;overflow:visible}}
.brand{display:none;align-items:center;gap:10px;padding:22px 18px;border-bottom:1px solid var(--teal-800)}
@media(min-width:768px){.brand{display:flex}}
.brand b{display:block;line-height:1.1}
.brand small{color:var(--teal-300);font-size:11px}
nav.menu{display:flex;flex-direction:row;flex:1;gap:2px}
@media(min-width:768px){nav.menu{flex-direction:column;padding:10px;gap:3px}}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border-radius:10px;color:var(--teal-300);font-size:10px;flex:1;position:relative;white-space:nowrap}
@media(min-width:768px){.nav-btn{flex-direction:row;gap:11px;font-size:14px;padding:10px 12px;flex:none}}
.nav-btn.on{background:var(--teal-700);color:#fff}
.nav-btn svg{width:19px;height:19px;flex-shrink:0}
.badge{position:absolute;top:2px;right:6px;background:#fbbf24;color:var(--teal-950);font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:17px;text-align:center}
@media(min-width:768px){.badge{position:static;margin-left:auto}}
main{flex:1;padding:18px 16px 90px;max-width:920px;margin:0 auto;width:100%}
@media(min-width:768px){main{padding:32px 32px 40px}}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.hd h1{font-size:21px;letter-spacing:-.3px}
.hd p{color:var(--mut);font-size:13px;margin-top:3px;max-width:520px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.stat.warn b{color:var(--amber)}.stat.good b{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:14px;color:#334155;margin-bottom:11px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--soft);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--teal-700);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:#334155;border:1px solid var(--line)}
.btn.whats{background:var(--green)}
.btn.danger{background:var(--rose)}
.btn.danger-link{background:none;color:var(--rose);padding:6px}
.btn.sm{padding:7px 12px;font-size:13px}
.icon-btn{padding:7px;color:var(--soft);border-radius:8px}
.icon-btn:hover{color:var(--teal-700);background:#f8fafc}
.icon-btn.del:hover{color:var(--rose)}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid}
.p-agendado{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.p-confirmado{background:var(--teal-100);color:var(--teal-800);border-color:#99f6e4}
.p-concluido{background:var(--green-bg);color:var(--green);border-color:#a7f3d0}
.p-faltou{background:var(--rose-bg);color:var(--rose);border-color:#fecdd3}
.p-cancelado{background:#f1f5f9;color:var(--soft);border-color:var(--line)}
.p-pendente{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.p-em_andamento{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe}
.p-concluida{background:var(--green-bg);color:var(--green);border-color:#a7f3d0}
.avatar{width:38px;height:38px;border-radius:99px;background:var(--teal-100);color:var(--teal-800);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.meta{font-size:12px;color:var(--mut)}
.flag{font-size:12px;color:var(--teal-700);margin-top:2px}
.grow{flex:1;min-width:150px}
.searchbar{position:relative;margin-bottom:14px}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.searchbar input{padding-left:36px}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center;padding:18px}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px;max-height:88dvh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-hd h2{font-size:16px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daynav input{max-width:170px}
.score-grid{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.score-grid button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.score-grid button:hover{background:var(--teal-100);border-color:var(--teal-300)}
.note{font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px}
.note.hi{background:var(--green-bg);color:var(--green)}.note.mid{background:var(--amber-bg);color:var(--amber)}.note.lo{background:var(--rose-bg);color:var(--rose)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
@media(min-width:768px){.toast{bottom:24px}}
.toast.show{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
a.link{color:var(--teal-700)}
.actions-list li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;list-style:none}
.actions-list b{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--amber)}
.actions-list b.zero{color:#cbd5e1}
.actions-list .go{margin-left:auto;color:var(--teal-700);font-size:12px;font-weight:600}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.kanban-col h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:10px}
.kanban-col.col-em_andamento h3{color:var(--purple)}
.kanban-col.col-concluida h3{color:var(--green)}
.task-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:default}
.task-card:last-child{margin-bottom:0}
.task-title{font-size:13px;font-weight:600;margin-bottom:4px}
.task-meta{font-size:11px;color:var(--mut)}
.prio-alta{border-left:3px solid var(--rose)}
.prio-normal{border-left:3px solid var(--amber)}
.prio-baixa{border-left:3px solid var(--soft)}
/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 200px);max-height:600px}
@media(min-width:768px){.chat-wrap{height:calc(100dvh - 180px)}}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:14px 14px 0 0}
.chat-msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.chat-msg.mine{align-self:flex-end;background:var(--teal-700);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg .who{font-size:11px;font-weight:700;margin-bottom:3px}
.chat-msg.mine .who{color:#99f6e4}
.chat-msg.other .who{color:var(--teal-700)}
.chat-msg .ts{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.chat-input{display:flex;gap:8px;padding:10px;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px}
.chat-input input{border-radius:8px}
.chat-input button{flex-shrink:0;background:var(--teal-700);color:#fff;padding:9px 14px;border-radius:8px;display:flex;align-items:center}
/* cor dot profissional */
.prof-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;margin-right:4px}
/* aniversário banner */
.bday-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.bday-banner .emoji{font-size:28px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 4c-4 0-9 1.5-9 7 0 4 1.5 6 2.4 9.5.9 3.6 1.3 7.5 3.4 7.5 2 0 1.4-5 3.2-5s1.2 5 3.2 5c2.1 0 2.5-3.9 3.4-7.5C23.5 17 25 15 25 11c0-5.5-5-7-9-7z" fill="#5EEAD4"/></svg>
      <div><b>Moura</b><small>Odontologia e Associados</small></div>

    <nav class="menu" id="nav"></nav>

  <main id="main"><div style="padding:40px;text-align:center;color:var(--mut)"><span class="spinner" style="border-color:var(--teal-700);border-top-color:transparent"></span> Carregando…</div></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const API = window.location.origin + "/api";

/* ── ícones ── */
const IC = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  smile:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
  upload:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>',
  task:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  prof:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><line x1="2" y1="21" x2="22" y2="21"/><path d="M7 8v2"/><path d="M12 8v2"/><path d="M17 8v2"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>',
};

/* ── estado global ── */
let DB = { patients:[], appointments:[], surveys:[], settings:{}, profissionais:[], tarefas:[], chat:[], aniversariantes:[] };
let TAB = "dash";
let AGENDA_DAY = todayISO();
let SEARCH_Q = "";
let CHAT_CANAL = "geral";
let CHAT_PROF_ID = null; // profissional logado no chat
let CHAT_POLL = null;

/* ── API helpers ── */
async function api(method, path, body) {
  try {
    const opts = { method, headers:{"Content-Type":"application/json"} };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(API + path, opts);
    if (!r.ok) throw new Error(await r.text());
    if (r.status === 204) return null;
    return r.json();
  } catch(e) {
    toast("Erro de conexão com o servidor.");
    throw e;
  }
}

async function reloadAll() {
  const [patients, appointments, surveys, settings, profissionais, tarefas, aniversariantes] = await Promise.all([
    api("GET", "/patients"),
    api("GET", "/appointments"),
    api("GET", "/surveys"),
    api("GET", "/settings"),
    api("GET", "/profissionais"),
    api("GET", "/tarefas"),
    api("GET", "/aniversariantes"),
  ]);
  DB = { patients, appointments, surveys, settings, profissionais, tarefas, aniversariantes, chat: DB.chat||[] };
  render();
}

async function reloadChat() {
  DB.chat = await api("GET", `/chat?canal=${encodeURIComponent(CHAT_CANAL)}&limit=100`);
  renderChatMsgs();
}

/* ── utilidades ── */
const PROCEDURES = ["Avaliação","Limpeza","Restauração","Canal","Extração","Clareamento","Ortodontia","Implante","Prótese","Outro"];
const STATUS = { agendado:"Agendado", confirmado:"Confirmado", concluido:"Concluído", faltou:"Faltou", cancelado:"Cancelado" };
const STATUS_TAREFA = { pendente:"Pendente", em_andamento:"Em andamento", concluida:"Concluída" };
const PRIO = { baixa:"Baixa", normal:"Normal", alta:"Alta" };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);
function todayISO() { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const fmtDate = iso => iso ? iso.split("-").reverse().join("/") : "—";
function fmtTime(iso){ if(!iso) return ""; const d=new Date(iso); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }
const digits = s => (s||"").replace(/\D/g,"");
function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthsAgo(n){ const d=new Date(); d.setMonth(d.getMonth()-n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function wa(phone,msg){ let p=digits(phone); if(p.length<=11) p="55"+p; return "https://wa.me/"+p+"?text="+encodeURIComponent(msg); }
function fill(t,vars){ let o=t; for(const k in vars) o=o.split("{"+k+"}").join(vars[k]??""); return o; }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const pById = id => DB.patients.find(p=>p.id===id);
const pName = id => pById(id)?.name || "Paciente removido";
const profById = id => DB.profissionais.find(p=>p.id===id);
const profNome = id => profById(id)?.nome || "—";
const initials = n => (n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2500); }

/* ── cálculos ── */
function calc(){
  const t = todayISO();
  const pendingConfirm = DB.appointments.filter(a=>a.status==="agendado" && a.date>=t && a.date<=addDays(t,2));
  const futureByPatient = new Set(DB.appointments.filter(a=>a.date>=t && (a.status==="agendado"||a.status==="confirmado")).map(a=>a.patientId));
  const cutoff = monthsAgo(parseInt(DB.settings.inactivityMonths)||6);
  const inactive = DB.patients.filter(p=>(!p.lastVisit || p.lastVisit<cutoff) && !futureByPatient.has(p.id));
  const surveyedIds = new Set(DB.surveys.map(s=>s.appointmentId));
  const pendingSurvey = DB.appointments.filter(a=>a.status==="concluido" && !surveyedIds.has(a.id));
  const pendingReview = DB.surveys.filter(s=>s.score>=9 && !s.reviewSent);
  const scores = DB.surveys.filter(s=>s.score!==null && s.score!==undefined).map(s=>s.score);
  const nps = scores.length ? Math.round((scores.filter(s=>s>=9).length - scores.filter(s=>s<=6).length)/scores.length*100) : null;
  const tarefasPendentes = DB.tarefas.filter(t=>t.status!=="concluida").length;
  const aniversarios = DB.aniversariantes.length;
  return { t, pendingConfirm, inactive, pendingSurvey, pendingReview, nps,
    badges:{ confirm:pendingConfirm.length, reactivate:inactive.length, survey:pendingSurvey.length, review:pendingReview.length, tarefas:tarefasPendentes, aniversarios } };
}

function go(tab){
  TAB=tab;
  if(CHAT_POLL){ clearInterval(CHAT_POLL); CHAT_POLL=null; }
  if(tab==="chat"){
    reloadChat();
    CHAT_POLL = setInterval(reloadChat, 5000);
  }
  render();
  window.scrollTo(0,0);
}

/* ── render principal ── */
function render(){
  const C = calc();
  document.getElementById("nav").innerHTML = NAV.map(n=>{
    const b = n.badge && C.badges[n.badge]>0 ? `<span class="badge">${C.badges[n.badge]}</span>` : "";
    return `<button class="nav-btn ${TAB===n.id?"on":""}" onclick="go('${n.id}')">${n.ic}<span>${n.label}</span>${b}</button>`;
  }).join("");
  const views = { dash:vDash, patients:vPatients, agenda:vAgenda, confirm:vConfirm, reactivate:vReactivate,
    survey:vSurvey, review:vReview, tarefas:vTarefas, chat:vChat, profissionais:vProfissionais, settings:vSettings };
  document.getElementById("main").innerHTML = views[TAB](C);
  if(TAB==="chat") setupChatUI();
}

      <div class="grow">

function renderKeepFocus(el){ const pos=el.selectionStart; render(); const n=document.querySelector(".searchbar input"); if(n){n.focus();n.setSelectionRange(pos,pos);} }
async function delPatient(id){
  if(!confirm("Excluir este paciente e suas consultas?")) return;
  await api("DELETE", `/patients/${id}`);
  await reloadAll(); toast("Paciente excluído.");
}
async function sendBirthday(id){
  const p = pById(id); if(!p) return;
  const msg = fill(DB.settings.msgAniversario||"Olá {nome}! 🎂 Feliz aniversário da equipe da Moura Odontologia!",{nome:p.name.split(" ")[0]});

async function savePatient(id){
  const g=i=>document.getElementById(i).value.trim();
  const f={name:g("f-name"),phone:g("f-phone"),email:g("f-email"),birth:g("f-birth")||null,lastVisit:g("f-last")||null,notes:g("f-notes")};

  if(id){ await api("PUT",`/patients/${id}`,{...f,id}); } else { await api("POST","/patients",f); }

}

async function setApptStatus(id,status){
  const a = DB.appointments.find(x=>x.id===id);
  await api("PUT",`/appointments/${id}`,{...a,status});
  if(status==="concluido"){
    const pac = pById(a.patientId);
    if(pac && (!pac.lastVisit || a.date>pac.lastVisit))
      await api("PUT",`/patients/${pac.id}`,{...pac,lastVisit:a.date});
  }
  await reloadAll();
}
async function delAppt(id){
  if(!confirm("Excluir esta consulta?")) return;
  await api("DELETE",`/appointments/${id}`);
  await reloadAll(); toast("Consulta excluída.");
}

async function saveAppt(){
  const g=i=>document.getElementById(i).value;
  if(!g("a-date")||!g("a-time")){ toast("Informe data e horário."); return; }
  await api("POST","/appointments",{
    patientId:g("a-pat"), profissionalId:g("a-prof")||null,
    date:g("a-date"), time:g("a-time"), duracaoMinutos:parseInt(g("a-dur"))||60,
    procedure:g("a-proc"), numProntuario:g("a-pron"), numOrcamento:g("a-orc"),
    status:"agendado", confirmSent:false
  });
  AGENDA_DAY=g("a-date"); closeModal(); await reloadAll(); toast("Consulta agendada.");

  await api("PUT",`/appointments/${id}`,{...a,confirmSent:true});

/* ════════════════════════════════════════════
   SATISFAÇÃO
════════════════════════════════════════════ */
function vSurvey(C){
  const surveyed=new Map(DB.surveys.map(s=>[s.appointmentId,s]));
  const done=DB.appointments.filter(a=>a.status==="concluido").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const scores=DB.surveys.filter(s=>s.score!==null&&s.score!==undefined).map(s=>s.score);
  const prom=scores.filter(s=>s>=9).length, det=scores.filter(s=>s<=6).length;
  return header("Pesquisa de satisfação","Envie o NPS após consultas concluídas e registre as notas.")+`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="stat ${C.nps!==null&&C.nps>=50?"good":""}"><b>${C.nps===null?"—":C.nps}</b><span>NPS</span></div>
    <div class="stat"><b>${prom}</b><span>Promotores (9–10)</span></div>
    <div class="stat"><b>${det}</b><span>Detratores (0–6)</span></div>
  </div>`+
  (done.length===0?empty("Nenhuma consulta concluída ainda."):
  done.map(a=>{const p=pById(a.patientId), s=surveyed.get(a.id);
    let actions;
    if(!s) actions=p?`<button class="btn whats sm" onclick="sendSurvey('${a.id}')">${IC.send} Enviar pesquisa</button>`:"";
    else if(s.score===null||s.score===undefined)
      actions=`<div class="score-grid"><span class="meta" style="margin-right:4px">Nota:</span>`+
        Array.from({length:11},(_,i)=>`<button onclick="setScore('${s.id}',${i})">${i}</button>`).join("")+`</div>`;
    else { const cls=s.score>=9?"hi":s.score>=7?"mid":"lo"; actions=`<span class="note ${cls}">Nota ${s.score}</span>`; }
    return queueCard(p?p.name:"Paciente removido",a.procedure+" em "+fmtDate(a.date),
      s&&(s.score===null||s.score===undefined)?"Enviada em "+fmtDate(s.sentAt)+" — aguardando nota":null,actions);
  }).join(""));
}
async function sendSurvey(apptId){
  const a=DB.appointments.find(x=>x.id===apptId), p=pById(a.patientId); if(!p)return;
  const msg=fill(DB.settings.msgSurvey||"",{nome:p.name.split(" ")[0]});
  window.open(wa(p.phone,msg),"_blank");
  await api("POST","/surveys",{appointmentId:apptId,patientId:a.patientId,sentAt:todayISO(),score:null,reviewSent:false});
  await reloadAll();
}
async function setScore(id,score){
  const s=DB.surveys.find(x=>x.id===id);
  await api("PUT",`/surveys/${id}`,{...s,score});
  await reloadAll(); toast("Nota registrada.");
}

/* ════════════════════════════════════════════
   AVALIAÇÃO GOOGLE
════════════════════════════════════════════ */
function vReview(){
  const list=DB.surveys.filter(s=>s.score>=9).sort((a,b)=>(a.reviewSent===b.reviewSent)?0:(a.reviewSent?1:-1));
  return header("Avaliação Google","Promotores (nota 9 ou 10) recebem convite para avaliar no Google.")+
  (list.length===0?empty("Ainda não há promotores."):
  list.map(s=>{const p=pById(s.patientId);
    return queueCard(p?p.name:"Paciente removido","Nota "+s.score+" na pesquisa",
      s.reviewSent?"Convite enviado em "+fmtDate(s.reviewSentAt):null,
      p?`<button class="btn whats sm" onclick="sendReview('${s.id}')">⭐ ${s.reviewSent?"Reenviar":"Pedir avaliação"}</button>`:"");
  }).join(""));
}
async function sendReview(id){
  const s=DB.surveys.find(x=>x.id===id), p=pById(s.patientId); if(!p)return;
  const msg=fill(DB.settings.msgReview||"",{nome:p.name.split(" ")[0],link:DB.settings.googleReviewLink||""});
  window.open(wa(p.phone,msg),"_blank");
  await api("PUT",`/surveys/${id}`,{...s,reviewSent:true,reviewSentAt:todayISO()});
  await reloadAll();
}

/* ════════════════════════════════════════════
   TAREFAS (kanban)
════════════════════════════════════════════ */
function vTarefas(){
  const cols = ["pendente","em_andamento","concluida"];
  const colLabel = {pendente:"Pendente",em_andamento:"Em andamento",concluida:"Concluída"};
  const prioOrder = {alta:0,normal:1,baixa:2};
  return `${header("Tarefas","Kanban da equipe.",`<button class="btn" onclick="openTarefaForm()">${IC.plus} Nova tarefa</button>`)}
  <div class="kanban">
    ${cols.map(col=>{
      const items = DB.tarefas.filter(t=>t.status===col).sort((a,b)=>prioOrder[a.prioridade]-prioOrder[b.prioridade]);
      return `<div class="kanban-col col-${col}">
        <h3>${colLabel[col]} <span style="font-weight:400;opacity:.7">${items.length}</span></h3>
        ${items.map(t=>`
          <div class="task-card prio-${t.prioridade}">
            <div class="task-title">${esc(t.titulo)}</div>
            ${t.descricao?`<div class="task-meta" style="margin-bottom:4px">${esc(t.descricao)}</div>`:""}
            <div class="task-meta">
              ${t.responsavelNome?`👤 ${esc(t.responsavelNome)}`:""}
              ${t.patientName?` · 🦷 ${esc(t.patientName)}`:""}
              ${t.dataVencimento?` · 📅 ${fmtDate(t.dataVencimento)}`:""}
            </div>
            <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
              ${cols.filter(c=>c!==col).map(c=>`<button class="btn ghost sm" style="font-size:11px;padding:4px 8px" onclick="moverTarefa(${t.id},'${c}')">${colLabel[c]}</button>`).join("")}
              <button class="icon-btn del" onclick="delTarefa(${t.id})" style="margin-left:auto">${IC.trash}</button>
            </div>
          </div>`).join("")}
      </div>`;
    }).join("")}
  </div>`;
}
async function moverTarefa(id, novoStatus){
  const t = DB.tarefas.find(x=>x.id===id);
  await api("PUT",`/tarefas/${id}`,{...t,status:novoStatus});
  await reloadAll(); toast("Tarefa atualizada.");
}
async function delTarefa(id){
  if(!confirm("Excluir esta tarefa?")) return;
  await api("DELETE",`/tarefas/${id}`);
  await reloadAll(); toast("Tarefa excluída.");
}
function openTarefaForm(){
  const profs = DB.profissionais.filter(p=>p.ativo);
  const pacs = DB.patients.slice().sort((a,b)=>a.name.localeCompare(b.name));
  modal("Nova tarefa",`
    <label class="f"><span>Título *</span><input id="t-titulo" placeholder="Ex: Ligar para confirmar retorno"></label>
    <label class="f"><span>Descrição</span><textarea id="t-desc" rows="2"></textarea></label>
    <div class="grid g2">
      <label class="f"><span>Prioridade</span><select id="t-prio">
        <option value="normal">Normal</option><option value="alta">Alta</option><option value="baixa">Baixa</option>
      </select></label>
      <label class="f"><span>Vencimento</span><input type="date" id="t-venc"></label>
    </div>
    <label class="f"><span>Responsável</span><select id="t-resp"><option value="">— Nenhum —</option>${profs.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</select></label>
    <label class="f"><span>Paciente relacionado</span><select id="t-pac"><option value="">— Nenhum —</option>${pacs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveTarefa()">Criar tarefa</button></div>`);
}
async function saveTarefa(){
  const g=i=>document.getElementById(i).value;
  if(!g("t-titulo").trim()){ toast("Informe o título."); return; }
  await api("POST","/tarefas",{
    titulo:g("t-titulo").trim(), descricao:g("t-desc"),
    prioridade:g("t-prio"), dataVencimento:g("t-venc")||null,
    responsavelId:g("t-resp")||null, patientId:g("t-pac")||null, status:"pendente"
  });
  closeModal(); await reloadAll(); toast("Tarefa criada.");
}

/* ════════════════════════════════════════════
   CHAT DA EQUIPE
════════════════════════════════════════════ */
function vChat(){
  const profs = DB.profissionais.filter(p=>p.ativo);
  if(profs.length===0) return header("Chat da equipe","")+"<div class='empty'>Cadastre profissionais primeiro para usar o chat.</div>";
  if(!CHAT_PROF_ID || !profs.find(p=>p.id===CHAT_PROF_ID)) CHAT_PROF_ID = profs[0].id;
  return `${header("Chat da equipe","Comunicação interna da clínica.")}
  <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <label class="f" style="margin:0;flex:1;min-width:160px"><span style="font-size:11px">Você é:</span>
      <select id="chat-prof-sel" onchange="CHAT_PROF_ID=parseInt(this.value)" style="font-size:13px;padding:7px 10px">
        ${profs.map(p=>`<option value="${p.id}" ${CHAT_PROF_ID===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}
      </select>
    </label>
    <label class="f" style="margin:0;flex:1;min-width:130px"><span style="font-size:11px">Canal:</span>
      <input id="chat-canal-inp" value="${esc(CHAT_CANAL)}" style="font-size:13px;padding:7px 10px" placeholder="geral" onchange="CHAT_CANAL=this.value.trim()||'geral';reloadChat()">
    </label>
  </div>
  <div class="chat-wrap">
    <div class="chat-msgs" id="chat-msgs">${renderChatMsgsHTML()}</div>
    <div class="chat-input">
      <input id="chat-inp" placeholder="Digite uma mensagem…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}">
      <button onclick="sendChat()">${IC.send}</button>
    </div>
  </div>`;
}
function renderChatMsgsHTML(){
  if(!DB.chat || DB.chat.length===0) return `<div style="color:var(--soft);text-align:center;padding:20px;font-size:14px">Nenhuma mensagem ainda. Diga olá! 👋</div>`;
  return DB.chat.map(m=>{
    const mine = m.profissionalId === CHAT_PROF_ID;
    const hora = m.created_at ? m.created_at.slice(11,16) : "";
    return `<div class="chat-msg ${mine?"mine":"other"}">
      <div class="who" style="${mine?"":"color:"+m.profissionalCor}">${esc(m.profissionalNome)}</div>
      <div>${esc(m.conteudo)}</div>
      <div class="ts">${hora}</div>
    </div>`;
  }).join("");
}
function renderChatMsgs(){
  const el = document.getElementById("chat-msgs");
  if(!el) return;
  el.innerHTML = renderChatMsgsHTML();
  el.scrollTop = el.scrollHeight;
}
function setupChatUI(){
  const el = document.getElementById("chat-msgs");
  if(el) el.scrollTop = el.scrollHeight;
}
async function sendChat(){
  const inp = document.getElementById("chat-inp");
  const msg = inp?.value.trim(); if(!msg || !CHAT_PROF_ID) return;
  inp.value = "";
  await api("POST","/chat",{profissionalId:CHAT_PROF_ID, canal:CHAT_CANAL, conteudo:msg});
  await reloadChat();
}

/* ════════════════════════════════════════════
   PROFISSIONAIS
════════════════════════════════════════════ */
function vProfissionais(){
  const list = DB.profissionais.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  return `${header("Profissionais",list.length+" cadastrados",`<button class="btn" onclick="openProfForm()">${IC.plus} Novo</button>`)}
  ${list.length===0?empty("Nenhum profissional cadastrado ainda."):
  `<div class="card" style="padding:4px 16px">`+list.map(p=>`
    <div class="row">
      <div class="avatar" style="background:${p.cor}22;color:${p.cor}">${initials(p.nome)}</div>
      <div class="grow">
        <div style="font-weight:500;font-size:14px">${esc(p.nome)} ${!p.ativo?'<span class="pill" style="background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0">Inativo</span>':""}</div>
        <div class="meta">${esc(p.especialidade)||"Sem especialidade"}${p.cro?" · CRO "+esc(p.cro):""}${p.email?" · "+esc(p.email):""}</div>
      </div>
      <div class="prof-dot" style="background:${p.cor};width:14px;height:14px;border-radius:50%"></div>
      <button class="icon-btn" onclick="openProfForm(${p.id})">${IC.pencil}</button>
      <button class="icon-btn del" onclick="delProf(${p.id})">${IC.trash}</button>
    </div>`).join("")+`</div>`}`;
}
function openProfForm(id){
  const p = id ? profById(id) : {nome:"",cro:"",especialidade:"",telefone:"",email:"",cor:"#0ea5e9",ativo:true};
  modal(id?"Editar profissional":"Novo profissional",`
    <label class="f"><span>Nome completo *</span><input id="p-nome" value="${esc(p.nome)}"></label>
    <div class="grid g2">
      <label class="f"><span>Especialidade</span><input id="p-esp" value="${esc(p.especialidade)}" placeholder="Ex: Ortodontia"></label>
      <label class="f"><span>CRO</span><input id="p-cro" value="${esc(p.cro)}" placeholder="000000"></label>
    </div>
    <div class="grid g2">
      <label class="f"><span>Telefone</span><input id="p-tel" value="${esc(p.telefone)}"></label>
      <label class="f"><span>E-mail</span><input id="p-email" value="${esc(p.email)}"></label>
    </div>
    <div class="grid g2">
      <label class="f"><span>Cor na agenda</span><input type="color" id="p-cor" value="${p.cor||"#0ea5e9"}" style="height:40px;padding:4px"></label>
      <label class="f"><span>Status</span><select id="p-ativo"><option value="true" ${p.ativo?"selected":""}>Ativo</option><option value="false" ${!p.ativo?"selected":""}>Inativo</option></select></label>
    </div>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveProf(${id||0})">Salvar</button></div>`);
}
async function saveProf(id){
  const g=i=>document.getElementById(i).value.trim();
  if(!g("p-nome")){ toast("Informe o nome."); return; }
  const data={nome:g("p-nome"),cro:g("p-cro"),especialidade:g("p-esp"),telefone:g("p-tel"),email:g("p-email"),cor:g("p-cor"),ativo:document.getElementById("p-ativo").value==="true"};
  if(id){ await api("PUT",`/profissionais/${id}`,data); } else { await api("POST","/profissionais",data); }
  closeModal(); await reloadAll(); toast("Profissional salvo.");
}
async function delProf(id){
  if(!confirm("Excluir este profissional?")) return;
  await api("DELETE",`/profissionais/${id}`);
  await reloadAll(); toast("Profissional excluído.");
}

/* ════════════════════════════════════════════
   AJUSTES
════════════════════════════════════════════ */
function vSettings(){
  const s=DB.settings;
  return header("Ajustes","Configurações gerais e modelos de mensagem.")+`
  <div class="card" style="margin-bottom:12px"><h2>Geral</h2>
    <label class="f"><span>Link de avaliação no Google</span><input id="s-link" value="${esc(s.googleReviewLink||"")}"></label>
    <label class="f"><span>Meses sem visita para paciente inativo</span><input type="number" min="1" id="s-months" value="${s.inactivityMonths||6}" style="max-width:110px"></label>
  </div>
  <div class="card" style="margin-bottom:12px"><h2>Modelos de mensagem (WhatsApp)</h2>
    <label class="f"><span>Confirmação — {nome} {procedimento} {data} {hora}</span><textarea id="s-confirm" rows="4">${esc(s.msgConfirm||"")}</textarea></label>
    <label class="f"><span>Reativação — {nome} {ultimaVisita}</span><textarea id="s-react" rows="4">${esc(s.msgReactivate||"")}</textarea></label>
    <label class="f"><span>Pesquisa — {nome}</span><textarea id="s-survey" rows="4">${esc(s.msgSurvey||"")}</textarea></label>
    <label class="f"><span>Avaliação Google — {nome} {link}</span><textarea id="s-review" rows="4">${esc(s.msgReview||"")}</textarea></label>
    <label class="f"><span>Aniversário — {nome}</span><textarea id="s-bday" rows="3">${esc(s.msgAniversario||"")}</textarea></label>
  </div>
  <div class="card" style="margin-bottom:12px"><h2>Migração de dados</h2>
    <p style="font-size:13px;color:var(--mut);margin-bottom:12px">Importe dados do CRM antigo (backup .json).</p>
    <button class="btn ghost sm" onclick="document.getElementById('importFile').click()">${IC.upload} Importar backup (.json)</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)">
  </div>
  <button class="btn" onclick="saveSettings()">Salvar ajustes</button>`;
}
async function saveSettings(){
  const g=i=>document.getElementById(i).value;
  await api("PUT","/settings",{
    googleReviewLink:g("s-link").trim(), inactivityMonths:g("s-months"),
    msgConfirm:g("s-confirm"), msgReactivate:g("s-react"), msgSurvey:g("s-survey"),
    msgReview:g("s-review"), msgAniversario:g("s-bday")
  });
  await reloadAll(); toast("Ajustes salvos.");
}
async function importBackup(input){
  const f=input.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d.patients||!d.appointments) throw 0;
      await api("POST","/import",d);
      await reloadAll(); toast("Backup importado com sucesso!");
    }catch(e){ toast("Arquivo inválido."); }
  };
  reader.readAsText(f); input.value="";
}

/* ════════════════════════════════════════════
   COMPONENTES COMPARTILHADOS
════════════════════════════════════════════ */
function header(title,sub,action){ return `<div class="hd"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${action||""}</div>`; }
function empty(t){ return `<div class="empty">${t}</div>`; }
function pill(s){ return `<span class="pill p-${s}">${STATUS[s]||s}</span>`; }
function queueCard(name,meta,flag,actions){
  return `<div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="grow"><div style="font-weight:500;font-size:14px">${esc(name)}</div><div class="meta">${esc(meta)}</div>
    ${flag?`<div class="flag">${esc(flag)}</div>`:""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${actions}</div></div>`;
}
function modal(title,body){
  closeModal();
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="modalBg";
  bg.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hd"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${IC.x}</button></div>${body}</div>`;
  bg.onclick=closeModal; document.body.appendChild(bg);
}
function closeModal(){ document.getElementById("modalBg")?.remove(); }

if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

/* ── inicialização ── */
reloadAll();
</script>
</body>
</html>
