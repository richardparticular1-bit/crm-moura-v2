<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM · Moura Odontologia</title>
<meta name="theme-color" content="#134e4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --teal-950:#042f2e;--teal-900:#134e4a;--teal-800:#115e59;--teal-700:#0f766e;--teal-300:#5eead4;--teal-100:#ccfbf1;
  --ink:#0f172a;--mut:#64748b;--soft:#94a3b8;--bg:#f1f5f4;--card:#fff;--line:#e2e8f0;
  --amber:#d97706;--amber-bg:#fffbeb;--green:#059669;--green-bg:#ecfdf5;--rose:#e11d48;--rose-bg:#fff1f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-700);outline-offset:-1px}
.app{display:flex;flex-direction:column;min-height:100dvh}
@media(min-width:768px){.app{flex-direction:row}}
.side{background:var(--teal-900);color:var(--teal-100);display:flex;flex-direction:row;position:fixed;bottom:0;left:0;right:0;z-index:30;overflow-x:auto;padding:6px;gap:2px;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
@media(min-width:768px){.side{position:static;flex-direction:column;width:230px;min-height:100dvh;padding:0;box-shadow:none;overflow:visible}}
.brand{display:none;align-items:center;gap:10px;padding:22px 18px;border-bottom:1px solid var(--teal-800)}
@media(min-width:768px){.brand{display:flex}}
.brand b{display:block;line-height:1.1}
.brand small{color:var(--teal-300);font-size:11px}
nav.menu{display:flex;flex-direction:row;flex:1;gap:2px}
@media(min-width:768px){nav.menu{flex-direction:column;padding:10px;gap:3px}}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border-radius:10px;color:var(--teal-300);font-size:10px;flex:1;position:relative;white-space:nowrap}
@media(min-width:768px){.nav-btn{flex-direction:row;gap:11px;font-size:14px;padding:10px 12px;flex:none}}
.nav-btn.on{background:var(--teal-700);color:#fff}
.nav-btn svg{width:19px;height:19px;flex-shrink:0}
.badge{position:absolute;top:2px;right:6px;background:#fbbf24;color:var(--teal-950);font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:17px;text-align:center}
@media(min-width:768px){.badge{position:static;margin-left:auto}}
main{flex:1;padding:18px 16px 90px;max-width:920px;margin:0 auto;width:100%}
@media(min-width:768px){main{padding:32px 32px 40px}}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.hd h1{font-size:21px;letter-spacing:-.3px}
.hd p{color:var(--mut);font-size:13px;margin-top:3px;max-width:520px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.stat.warn b{color:var(--amber)}.stat.good b{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:14px;color:#334155;margin-bottom:11px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--soft);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--teal-700);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:#334155;border:1px solid var(--line)}
.btn.whats{background:var(--green)}
.btn.danger{background:var(--rose)}
.btn.danger-link{background:none;color:var(--rose);padding:6px}
.btn.sm{padding:7px 12px;font-size:13px}
.icon-btn{padding:7px;color:var(--soft);border-radius:8px}
.icon-btn:hover{color:var(--teal-700);background:#f8fafc}
.icon-btn.del:hover{color:var(--rose)}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid}
.p-agendado{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.p-confirmado{background:var(--teal-100);color:var(--teal-800);border-color:#99f6e4}
.p-concluido{background:var(--green-bg);color:var(--green);border-color:#a7f3d0}
.p-faltou{background:var(--rose-bg);color:var(--rose);border-color:#fecdd3}
.p-cancelado{background:#f1f5f9;color:var(--soft);border-color:var(--line)}
.p-pendente{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.p-em_andamento{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe}
.p-concluida{background:var(--green-bg);color:var(--green);border-color:#a7f3d0}
.avatar{width:38px;height:38px;border-radius:99px;background:var(--teal-100);color:var(--teal-800);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.meta{font-size:12px;color:var(--mut)}
.flag{font-size:12px;color:var(--teal-700);margin-top:2px}
.grow{flex:1;min-width:150px}
.searchbar{position:relative;margin-bottom:14px}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.searchbar input{padding-left:36px}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center;padding:18px}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px;max-height:88dvh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-hd h2{font-size:16px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daynav input{max-width:170px}
.score-grid{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.score-grid button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.score-grid button:hover{background:var(--teal-100);border-color:var(--teal-300)}
.note{font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px}
.note.hi{background:var(--green-bg);color:var(--green)}.note.mid{background:var(--amber-bg);color:var(--amber)}.note.lo{background:var(--rose-bg);color:var(--rose)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
@media(min-width:768px){.toast{bottom:24px}}
.toast.show{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
a.link{color:var(--teal-700)}
.actions-list li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;list-style:none}
.actions-list b{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--amber)}
.actions-list b.zero{color:#cbd5e1}
.actions-list .go{margin-left:auto;color:var(--teal-700);font-size:12px;font-weight:600}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.kanban-col h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:10px}
.kanban-col.col-em_andamento h3{color:var(--purple)}
.kanban-col.col-concluida h3{color:var(--green)}
.task-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:default}
.task-card:last-child{margin-bottom:0}
.task-title{font-size:13px;font-weight:600;margin-bottom:4px}
.task-meta{font-size:11px;color:var(--mut)}
.prio-alta{border-left:3px solid var(--rose)}
.prio-normal{border-left:3px solid var(--amber)}
.prio-baixa{border-left:3px solid var(--soft)}
/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 200px);max-height:600px}
@media(min-width:768px){.chat-wrap{height:calc(100dvh - 180px)}}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:14px 14px 0 0}
.chat-msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.chat-msg.mine{align-self:flex-end;background:var(--teal-700);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg .who{font-size:11px;font-weight:700;margin-bottom:3px}
.chat-msg.mine .who{color:#99f6e4}
.chat-msg.other .who{color:var(--teal-700)}
.chat-msg .ts{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.chat-input{display:flex;gap:8px;padding:10px;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px}
.chat-input input{border-radius:8px}
.chat-input button{flex-shrink:0;background:var(--teal-700);color:#fff;padding:9px 14px;border-radius:8px;display:flex;align-items:center}
/* cor dot profissional */
.prof-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;margin-right:4px}
/* aniversário banner */
.bday-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.bday-banner .emoji{font-size:28px}
</style>
</head>

</div>

/* ── estado global ── */

/* ── API helpers ── */
/* Evita cliques duplos criando registros repetidos: chamadas de escrita
   (POST/PUT/DELETE) idênticas e simultâneas são ignoradas — a segunda
   tentativa não chega a sair pela rede. */
const _WRITE_METHODS = new Set(["POST","PUT","DELETE"]);
const _inFlight = new Set();
function _modalBusy(busy){
  const modalEl = document.querySelector("#modalBg .modal");
  if(!modalEl) return;
  let overlay = modalEl.querySelector(".busy-overlay");
  if(busy){
    modalEl.style.position = "relative";
    if(!overlay){
      overlay = document.createElement("div");
      overlay.className = "busy-overlay";
      overlay.style.cssText = "position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;border-radius:18px;z-index:5";
      overlay.innerHTML = `<span class="spinner" style="border-color:var(--teal-700);border-top-color:transparent;width:22px;height:22px"></span>`;
      modalEl.appendChild(overlay);
    }
  } else if(overlay) overlay.remove();
}

async function api(method, path, body) {
  const key = method + ":" + path + ":" + (body ? JSON.stringify(body) : "");
  const isWrite = _WRITE_METHODS.has(method);
  if (isWrite && _inFlight.has(key)) {
    // Clique duplicado: ignora silenciosamente, sem segunda requisição nem toast de erro.
    return new Promise(()=>{}); // nunca resolve/rejeita — a chamada original é a que vale
  }
  if (isWrite) { _inFlight.add(key); _modalBusy(true); }
  const opts = { method, headers:{"Content-Type":"application/json"} };
  if (AUTH_TOKEN) opts.headers["Authorization"] = "Bearer " + AUTH_TOKEN;
  if (body) opts.body = JSON.stringify(body);
  let r;
  try {
    r = await fetch(API + path, opts);
  } catch(e) {
    if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
    toast("Erro de conexão com o servidor.");
    throw e;
  }
  if (r.status === 401 && !path.startsWith("/auth/")) {
    if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
    AUTH_TOKEN = ""; AUTH_NOME = "";
    localStorage.removeItem("crm_token"); localStorage.removeItem("crm_nome");
    showLogin();
    throw new Error("401");
  }
  if (!r.ok) {
    if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
    let msg = "Erro no servidor (" + r.status + ").";
    try {
      const j = await r.json();
      if (j && j.detail) msg = typeof j.detail === "string" ? j.detail : msg;
    } catch(_) {}
    toast(msg);
    throw new Error(msg);
  }
  if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
  if (r.status === 204) return null;
  return r.json();
}

async function apiUpload(path, formData) {
  const key = "UPLOAD:" + path;
  if (_inFlight.has(key)) return new Promise(()=>{}); // clique duplicado: ignora
  _inFlight.add(key); _modalBusy(true);
  const opts = { method:"POST", body: formData, headers:{} };
  if (AUTH_TOKEN) opts.headers["Authorization"] = "Bearer " + AUTH_TOKEN;
  let r;
  try { r = await fetch(API + path, opts); }
  catch(e){ _inFlight.delete(key); _modalBusy(false); toast("Erro de conexão com o servidor."); throw e; }
  if (r.status === 401) {
    _inFlight.delete(key); _modalBusy(false);
    AUTH_TOKEN=""; AUTH_NOME="";
    localStorage.removeItem("crm_token"); localStorage.removeItem("crm_nome");
    showLogin(); throw new Error("401");
  }
  if (!r.ok) {
    _inFlight.delete(key); _modalBusy(false);
    let msg = "Erro no servidor (" + r.status + ").";
    try { const j = await r.json(); if (j && j.detail) msg = typeof j.detail==="string"? j.detail : msg; } catch(_){}
    toast(msg); throw new Error(msg);
  }
  _inFlight.delete(key); _modalBusy(false);
  return r.json();
}

function fmtTime(iso){ if(!iso) return ""; const d=new Date(iso); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }
const digits = s => (s||"").replace(/\D/g,"");
function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function wa(phone,msg){ let p=digits(phone); if(p.length<=11) p="55"+p; return "https://wa.me/"+p+"?text="+encodeURIComponent(msg); }
function fill(t,vars){ let o=t; for(const k in vars) o=o.split("{"+k+"}").join(vars[k]??""); return o; }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function parseMoney(s){ // "1.250,50" | "1250,50" | "1250.50" | "1250" -> centavos
  const clean = (s||"").replace(/[^\d,\.]/g,"");
  if(!clean) return 0;
  let normalized = clean;
  if(clean.includes(",")) normalized = clean.replace(/\./g,"").replace(",",".");
  const v = parseFloat(normalized);
  return isNaN(v) ? 0 : Math.round(v*100);
}

/* ── cálculos ── */
function calc(){
  const t = todayISO();
  const pendingConfirm = DB.appointments.filter(a=>a.status==="agendado" && a.date>=t && a.date<=addDays(t,2));
  const futureByPatient = new Set(DB.appointments.filter(a=>a.date>=t && (a.status==="agendado"||a.status==="confirmado")).map(a=>a.patientId));
  const cutoff = monthsAgo(parseInt(DB.settings.inactivityMonths)||6);
  const inactive = DB.patients.filter(p=>(!p.lastVisit || p.lastVisit<cutoff) && !futureByPatient.has(p.id));
  const surveyedIds = new Set(DB.surveys.map(s=>s.appointmentId));
  const pendingSurvey = DB.appointments.filter(a=>a.status==="concluido" && !surveyedIds.has(a.id));
  const pendingReview = DB.surveys.filter(s=>s.score>=9 && !s.reviewSent);
  const scores = DB.surveys.filter(s=>s.score!==null && s.score!==undefined).map(s=>s.score);
  const nps = scores.length ? Math.round((scores.filter(s=>s>=9).length - scores.filter(s=>s<=6).length)/scores.length*100) : null;
  const tarefasPendentes = DB.tarefas.filter(t=>t.status!=="concluida").length;
  const aniversarios = DB.aniversariantes.length;
  const finVencidos = (DB.lancamentos||[]).filter(l=>!l.pagoEm && l.vencimento < t).length;
  const orcApresentados = (DB.orcamentos||[]).filter(o=>o.status==="apresentado").length;
  const retornosDue = (DB.retornos||[]).length;
  return { t, pendingConfirm, inactive, pendingSurvey, pendingReview, nps,
    badges:{ confirm:pendingConfirm.length, reactivate:inactive.length, survey:pendingSurvey.length, review:pendingReview.length, tarefas:tarefasPendentes, aniversarios, financeiro:finVencidos, orcamentos:orcApresentados, retornos:retornosDue } };
}

function go(tab){
  TAB=tab;
  if(CHAT_POLL){ clearInterval(CHAT_POLL); CHAT_POLL=null; }
  if(tab==="chat"){
    reloadChat();
    CHAT_POLL = setInterval(reloadChat, 5000);
  }
  render();
  window.scrollTo(0,0);
}

async function savePatient(id){
  const g=i=>document.getElementById(i).value.trim();
  const f={
    name:g("f-name"),phone:g("f-phone"),email:g("f-email"),birth:g("f-birth")||null,lastVisit:g("f-last")||null,notes:g("f-notes"),numProntuario:g("f-pron"),
    rg:g("f-rg"),orgaoExpedidor:g("f-orgao"),cpf:g("f-cpf"),naturalidade:g("f-natur"),nacionalidade:g("f-nac"),estadoCivil:g("f-civil"),
    profissao:g("f-prof"),localTrabalho:g("f-trab"),enderecoResidencial:g("f-end"),indicadoPor:g("f-indic"),
    respNome:g("f-r-nome"),respRg:g("f-r-rg"),respCpf:g("f-r-cpf"),respTelefone:g("f-r-tel"),respEmail:g("f-r-email"),
    alergias:g("f-alerg"),medicacoes:g("f-medic"),condicoesSistemicas:g("f-cond"),
  };
  if(!f.name || digits(f.phone).length<10){ toast("Preencha nome e telefone válido."); return; }
  if(id){ await api("PUT",`/patients/${id}`,{...f,id}); } else { await api("POST","/patients",f); }
  closeModal(); await reloadAll(); toast("Paciente salvo.");
}

function vAgenda(){
  const viewBtns = ["dia","semana","mes","ano"].map(v=>
    `<button class="btn ${AGENDA_VIEW===v?"":"ghost"} sm" onclick="AGENDA_VIEW='${v}';render()" style="text-transform:capitalize">${v}</button>`
  ).join("");
  const buscando = AGENDA_SEARCH.trim().length >= 2;
  const body = buscando ? vAgendaBusca() :
               AGENDA_VIEW==="dia" ? vAgendaDia() :
               AGENDA_VIEW==="semana" ? vAgendaSemana() :
               AGENDA_VIEW==="mes" ? vAgendaMes() : vAgendaAno();
  return `${header("Agenda","",`<button class="btn" onclick="openApptForm()" ${DB.patients.length===0?"disabled":""}>${IC.plus} Nova consulta</button>`)}
  <div class="searchbar">${IC.search}<input id="agenda-search" value="${esc(AGENDA_SEARCH)}" oninput="AGENDA_SEARCH=this.value;renderKeepFocusAgenda(this)" placeholder="Buscar paciente na agenda…"></div>

  if(matches.length===0) return empty(`Nenhum agendamento encontrado para "${esc(AGENDA_SEARCH.trim())}".`);
  const rowHTML = a=>{
    const prof = a.profissionalId ? profById(a.profissionalId) : null;

      </div>
      <div class="grow">
        <div style="font-weight:500;font-size:14px">${esc(pName(a.patientId))}</div>
        <div class="meta">${esc(a.procedure)}${prof?` · <span style="color:${prof.cor}">● ${esc(prof.nome)}</span>`:""}</div>
      </div>

      <button class="icon-btn" onclick="openApptForm('${a.id}')" aria-label="Editar">${IC.pencil}</button>
      <button class="icon-btn del" onclick="delAppt('${a.id}')" aria-label="Excluir">${IC.trash}</button>
    </div>`;
  };

  ${futuras.length?`<div class="card" style="padding:4px 16px;margin-bottom:12px"><h2 style="padding-top:12px">Próximas (${futuras.length})</h2>${futuras.slice().reverse().map(rowHTML).join("")}</div>`:""}

function startOfWeek(iso){
  const d = new Date(iso+"T00:00:00");
  const dow = d.getDay(); // 0=domingo
  d.setDate(d.getDate()-dow);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

        </div>
        ${dayAppts.length===0?`<div style="text-align:center;font-size:11px;color:#cbd5e1;padding:6px 0">livre</div>`:

function vAgendaMes(){
  const [y,m] = AGENDA_DAY.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const t = todayISO();
  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let day=1;day<=daysInMonth;day++) cells.push(day);
  function shiftMonth(delta){
    const d = new Date(y, m-1+delta, 1);
    AGENDA_DAY = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
    render();
  }
  window._shiftMonth = shiftMonth;
  return `<div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_shiftMonth(-1)">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${monthNames[m-1]} ${y}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_shiftMonth(1)">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="AGENDA_DAY=todayISO();render()">Hoje</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">
    ${["D","S","T","Q","Q","S","S"].map(d=>`<div style="text-align:center;font-size:11px;font-weight:700;color:var(--mut)">${d}</div>`).join("")}
  </div>
  <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:4px">
    ${cells.map(day=>{
      if(!day) return `<div></div>`;
      const iso = `${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const count = DB.appointments.filter(a=>a.date===iso && a.status!=="cancelado").length;
      const isToday = iso===t;
      return `<button onclick="AGENDA_DAY='${iso}';AGENDA_VIEW='dia';render()" class="card" style="padding:8px 4px;min-height:54px;text-align:center;cursor:pointer;${isToday?"border-color:var(--teal-700);border-width:2px":""}">
        <div style="font-size:12px;font-weight:${isToday?"700":"500"};color:${isToday?"var(--teal-700)":"var(--ink)"}">${day}</div>
        ${count>0?`<div style="margin-top:3px;font-size:10px;background:var(--teal-100);color:var(--teal-800);border-radius:99px;padding:1px 6px;display:inline-block">${count}</div>`:""}
      </button>`;
    }).join("")}
  </div>`;
}

function vAgendaAno(){
  const y = parseInt(AGENDA_DAY.split("-")[0]);
  const monthNames = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const counts = Array.from({length:12},()=>0);
  DB.appointments.forEach(a=>{
    if(a.status==="cancelado") return;
    const [ay,am] = a.date.split("-").map(Number);
    if(ay===y) counts[am-1]++;
  });
  const max = Math.max(1,...counts);
  function heat(n){
    if(n===0) return "#f1f5f9";
    const pct = n/max;
    if(pct>.75) return "var(--teal-700)";
    if(pct>.5) return "#2dd4bf";
    if(pct>.25) return "#99f6e4";
    return "var(--teal-100)";
  }
  return `<div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="AGENDA_DAY='${y-1}-01-01';render()">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${y}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="AGENDA_DAY='${y+1}-01-01';render()">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="AGENDA_DAY=todayISO();render()">Hoje</button>
  </div>
  <div class="grid g3" style="gap:10px">
    ${monthNames.map((mn,i)=>{
      const c = counts[i];
      return `<button class="card" onclick="AGENDA_DAY='${y}-${String(i+1).padStart(2,"0")}-01';AGENDA_VIEW='mes';render()" style="text-align:left;background:${heat(c)};${c>max*0.5?"color:#fff":""}">
        <div style="font-weight:700;font-size:14px">${mn}</div>
        <div style="font-size:12px;opacity:.85">${c} consulta${c===1?"":"s"}</div>
      </button>`;
    }).join("")}
  </div>`;
}

async function setApptStatus(id,status){
  const a = DB.appointments.find(x=>x.id===id);
  await api("PUT",`/appointments/${id}`,{...a,status});
  if(status==="concluido"){
    const pac = pById(a.patientId);
    if(pac && (!pac.lastVisit || a.date>pac.lastVisit))
      await api("PUT",`/patients/${pac.id}`,{...pac,lastVisit:a.date});
  }
  await reloadAll();
}
async function delAppt(id){
  if(!confirm("Excluir esta consulta?")) return;
  await api("DELETE",`/appointments/${id}`);
  await reloadAll(); toast("Consulta excluída.");
}

    <div class="acts" style="justify-content:space-between">
    ${a?`<button class="btn ghost" onclick="closeModal();openLancForm(null,'${a.id}')" style="color:var(--green);border-color:#a7f3d0">💰 Gerar cobrança</button>`:"<span></span>"}
    <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveAppt('${id||""}')">${a?"Salvar alterações":"Agendar"}</button></div></div>`);

async function saveAppt(id){
  const g=i=>document.getElementById(i).value;
  if(!g("a-date")||!g("a-time")){ toast("Informe data e horário."); return; }
  const payload = {
    patientId:g("a-pat"), profissionalId:g("a-prof")?parseInt(g("a-prof")):null,
    date:g("a-date"), time:g("a-time"), duracaoMinutos:parseInt(g("a-dur"))||60,
    procedure:g("a-proc"), numProntuario:g("a-pron"), numOrcamento:g("a-orc")
  };
  if(id){
    const a = DB.appointments.find(x=>x.id===id);
    const status = document.getElementById("a-status")?.value || a.status;
    await api("PUT",`/appointments/${id}`,{...payload, status, confirmSent:a.confirmSent});
    closeModal(); await reloadAll(); toast("Consulta atualizada.");
  } else {
    await api("POST","/appointments",{...payload, status:"agendado", confirmSent:false});
    AGENDA_DAY=g("a-date"); closeModal(); await reloadAll(); toast("Consulta agendada.");
  }
}

function _finShiftMes(delta){
  let [y,m] = FIN_MES.split("-").map(Number);
  m += delta;
  if(m===0){ m=12; y--; } else if(m===13){ m=1; y++; }
  FIN_MES = `${y}-${String(m).padStart(2,"0")}`;
  render();
}
function vFinanceiro(C){
  const t = C.t;
  const L = DB.lancamentos || [];
  const mesLabel = (()=>{ const [y,m]=FIN_MES.split("-").map(Number);
    return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m-1]+" "+y; })();
  // Resumo do mês selecionado
  const recebidoMes = L.filter(l=>l.pagoEm && l.pagoEm.slice(0,7)===FIN_MES).reduce((s,l)=>s+l.valor,0);
  const aReceberMes = L.filter(l=>!l.pagoEm && l.vencimento.slice(0,7)===FIN_MES).reduce((s,l)=>s+l.valor,0);
  const vencidos = L.filter(l=>!l.pagoEm && l.vencimento < t);
  const vencidoTotal = vencidos.reduce((s,l)=>s+l.valor,0);
  // Lista filtrada
  const q = FIN_SEARCH.trim().toLowerCase();

function renderKeepFocusFin(el){ const pos=el.selectionStart; render(); const n=document.getElementById("fin-search"); if(n){n.focus();n.setSelectionRange(pos,pos);} }

function exportCsvFin(){
  const t = todayISO();
  const q = FIN_SEARCH.trim().toLowerCase();
  let list = (DB.lancamentos||[]).filter(l=>!q || (l.patientName||"").toLowerCase().includes(q) || (l.descricao||"").toLowerCase().includes(q));
  if(FIN_FILTRO==="abertos") list = list.filter(l=>!l.pagoEm);
  else if(FIN_FILTRO==="vencidos") list = list.filter(l=>!l.pagoEm && l.vencimento < t);
  else if(FIN_FILTRO==="pagos") list = list.filter(l=>l.pagoEm);
  if(list.length===0){ toast("Nada para exportar neste filtro."); return; }
  const cel = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const linhas = [
    ["Vencimento","Pago em","Paciente","Descrição","Dentista","Valor (R$)","Forma de pagamento","Status","Nº Orçamento","Observações"].join(";"),
    ...list.map(l=>[
      cel(fmtDate(l.vencimento)), cel(l.pagoEm?fmtDate(l.pagoEm):""),
      cel(l.patientName), cel(l.descricao), cel(l.profissionalNome||""),
      cel((l.valor/100).toFixed(2).replace(".",",")),
      cel(l.pagoEm?(FORMAS_PGTO[l.formaPagamento]||l.formaPagamento):""),
      cel(l.pagoEm?"Pago":(l.vencimento<t?"Vencido":"Em aberto")),
      cel(l.numOrcamento||""), cel(l.observacoes||""),
    ].join(";"))
  ];
  const blob = new Blob(["\ufeff"+linhas.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `financeiro-${FIN_FILTRO}-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`${list.length} lançamentos exportados.`);
}

async function saveLanc(id, apptId){
  const g=i=>document.getElementById(i)?.value;
  const valor = parseMoney(g("l-valor"));
  if(!g("l-desc").trim()){ toast("Informe a descrição."); return; }
  if(valor<=0){ toast("Informe um valor válido."); return; }
  if(!g("l-venc")){ toast("Informe o vencimento."); return; }
  const payload = {
    patientId:g("l-pat"), profissionalId:g("l-prof")?parseInt(g("l-prof")):null,
    appointmentId: apptId||null,
    descricao:g("l-desc").trim(), valor, vencimento:g("l-venc"),
    numOrcamento:g("l-orc")||"", observacoes:g("l-obs")||"",
  };
  if(id){
    const l = DB.lancamentos.find(x=>x.id===id);
    await api("PUT",`/financeiro/${id}`,{...payload, appointmentId:l.appointmentId, pagoEm:l.pagoEm, formaPagamento:l.formaPagamento});
    closeModal(); await reloadAll(); toast("Lançamento atualizado.");
  } else {
    const parcelas = parseInt(g("l-parc"))||1;
    await api("POST","/financeiro",{...payload, pagoEm:null, formaPagamento:"", parcelas});
    closeModal(); if(TAB!=="financeiro") go("financeiro"); else await reloadAll();
    toast(parcelas>1?`${parcelas} parcelas criadas.`:"Lançamento criado.");
  }
}

async function receberLanc(id){
  const l = DB.lancamentos.find(x=>x.id===id);
  const g=i=>document.getElementById(i).value;
  const payload = { formaPagamento:g("r-forma"), pagoEm:g("r-data")||null };
  const parcial = document.getElementById("r-parcial").checked;
  if(parcial){
    const valorRecebido = parseMoney(g("r-valor"));
    if(valorRecebido<=0 || valorRecebido>=l.valor){ toast("Informe um valor parcial menor que o total da parcela."); return; }
    if(!g("r-restante-venc")){ toast("Informe o vencimento do valor restante."); return; }
    payload.valorRecebido = valorRecebido;
    payload.restanteVencimento = g("r-restante-venc");
  }
  await api("PUT",`/financeiro/${id}/receber`,payload);
  closeModal(); await reloadAll();
  toast(parcial ? "Pagamento parcial registrado — restante em aberto. 💰" : "Recebimento registrado. 💰");
}
async function estornarLanc(id){
  if(!confirm("Estornar este recebimento? O lançamento voltará para 'em aberto'.")) return;
  await api("PUT",`/financeiro/${id}/estornar`);
  await reloadAll(); toast("Recebimento estornado.");
}
async function delLanc(id){
  if(!confirm("Excluir este lançamento?")) return;
  await api("DELETE",`/financeiro/${id}`);
  await reloadAll(); toast("Lançamento excluído.");
}

async function saveOrc(id){
  const g=i=>document.getElementById(i)?.value;
  const itens = [];
  document.querySelectorAll("#orc-itens .orc-item").forEach(r=>{
    const proc = r.querySelector(".oi-proc").value.trim();
    const valor = parseMoney(r.querySelector(".oi-valor").value);
    if(!proc && !valor) return; // linha vazia, ignora
    itens.push({
      procedimento: proc,
      denteRegiao: r.querySelector(".oi-dente").value.trim(),
      quantidade: parseInt(r.querySelector(".oi-qtd").value)||1,
      valor,
    });
  });
  if(itens.length===0){ toast("Adicione pelo menos um item."); return; }
  if(itens.some(i=>!i.procedimento)){ toast("Todo item precisa de procedimento."); return; }
  if(itens.some(i=>i.valor<=0)){ toast("Todo item precisa de valor."); return; }
  const payload = {
    patientId:g("o-pat"), profissionalId:g("o-prof")?parseInt(g("o-prof")):null,
    data:g("o-data"), observacoes:g("o-obs")||"", itens,
  };
  if(id){ await api("PUT",`/orcamentos/${id}`,payload); }
  else { await api("POST","/orcamentos",payload); }
  closeModal();
  if(TAB!=="orcamentos" && TAB!=="ficha") go("orcamentos"); else await reloadAll();
  if(TAB==="ficha") render();
  toast(id?"Orçamento atualizado.":"Orçamento criado (rascunho).");
}

const CATEGORIAS_DESPESA = { aluguel:"Aluguel", material:"Material", laboratorio:"Laboratório", salario:"Salário", marketing:"Marketing", equipamento:"Equipamento", outro:"Outro" };
function _despShiftMes(delta){
  let [y,m] = DESP_MES.split("-").map(Number);
  m += delta;
  if(m===0){ m=12; y--; } else if(m===13){ m=1; y++; }
  DESP_MES = `${y}-${String(m).padStart(2,"0")}`;
  render();
}
function vGastos(){
  const mesLabel = (()=>{ const [y,m]=DESP_MES.split("-").map(Number);
    return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m-1]+" "+y; })();
  const doMes = (DB.despesas||[]).filter(d=>d.data.slice(0,7)===DESP_MES).sort((a,b)=>b.data.localeCompare(a.data));
  const total = doMes.reduce((s,d)=>s+d.valor,0);
  const porCat = {};
  doMes.forEach(d=>{ porCat[d.categoria]=(porCat[d.categoria]||0)+d.valor; });
  const catsHTML = Object.entries(porCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    `<span class="pill" style="background:#f1f5f9;color:#334155;border-color:var(--line);margin-right:6px;margin-bottom:6px;display:inline-block">${CATEGORIAS_DESPESA[k]||k}: ${fmtMoney(v)}</span>`).join("");
  return `${header("Gastos do consultório","Despesas fixas e variáveis, com comprovante opcional.",`<button class="btn" onclick="openDespesaForm()">${IC.plus} Novo gasto</button>`)}
  <div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_despShiftMes(-1)">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${mesLabel}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_despShiftMes(1)">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="DESP_MES=todayISO().slice(0,7);render()">Mês atual</button>
  </div>
  <div class="stat" style="margin-bottom:12px;max-width:220px"><b style="color:var(--rose)">${fmtMoney(total)}</b><span>Total no mês</span></div>
  ${catsHTML?`<div style="margin-bottom:14px">${catsHTML}</div>`:""}
  ${doMes.length===0?empty("Nenhum gasto registrado neste mês."):
  `<div class="card" style="padding:4px 16px">`+doMes.map(d=>`
    <div class="row">
      <div style="text-align:center;min-width:74px"><b style="font-size:13px;color:var(--rose)">${fmtMoney(d.valor)}</b><span class="meta" style="display:block">${fmtDate(d.data)}</span></div>
      <div class="grow"><div style="font-weight:500;font-size:14px">${esc(d.descricao)||CATEGORIAS_DESPESA[d.categoria]}</div>
        <div class="meta">${CATEGORIAS_DESPESA[d.categoria]||d.categoria}</div></div>
      ${d.comprovantePath?`<button class="btn ghost sm" onclick="verComprovanteDespesa('${d.id}')">${IC.receipt} Comprovante</button>`:""}
      <button class="icon-btn del" onclick="delDespesa('${d.id}')" aria-label="Excluir">${IC.trash}</button>
    </div>`).join("")+`</div>`}`;
}
function openDespesaForm(){
  modal("Novo gasto",`
    <label class="f"><span>Categoria</span><select id="d-cat">${Object.entries(CATEGORIAS_DESPESA).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
    <label class="f"><span>Descrição</span><input id="d-desc" placeholder="Ex: Aluguel de julho"></label>
    <div class="grid g2">
      <label class="f"><span>Valor (R$) *</span><input id="d-valor" inputmode="decimal" placeholder="0,00"></label>
      <label class="f"><span>Data *</span><input type="date" id="d-data" value="${todayISO()}"></label>
    </div>
    <label class="f"><span>Comprovante (opcional)</span><input type="file" id="d-comp" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf"></label>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveDespesa()">Salvar</button></div>`);

async function saveDespesa(){
  const g=i=>document.getElementById(i);
  const valor = parseMoney(g("d-valor").value);
  if(valor<=0){ toast("Informe um valor válido."); return; }
  if(!g("d-data").value){ toast("Informe a data."); return; }
  const fd = new FormData();
  fd.append("categoria", g("d-cat").value);
  fd.append("descricao", g("d-desc").value||"");
  fd.append("valor", String(valor));
  fd.append("data", g("d-data").value);
  const file = g("d-comp").files[0];
  if(file) fd.append("comprovante", file);
  await apiUpload("/despesas", fd);
  closeModal(); await reloadAll(); toast("Gasto registrado.");
}
async function verComprovanteDespesa(id){
  const r = await api("GET", `/despesas/${id}/comprovante-url`);
  window.open(r.url, "_blank");
}
async function delDespesa(id){
  if(!confirm("Excluir este gasto?")) return;
  await api("DELETE", `/despesas/${id}`);
  await reloadAll(); toast("Gasto excluído.");
}

/* ════════════════════════════════════════════
   ODONTOGRAMA (SVG interativo, por face)
════════════════════════════════════════════ */
const ODONTO_BLOCOS = [
  {arch:"upper", mesial:"right", dentes:[18,17,16,15,14,13,12,11]},
  {arch:"upper", mesial:"left",  dentes:[21,22,23,24,25,26,27,28]},
  {arch:"lower", mesial:"right", dentes:[48,47,46,45,44,43,42,41]},
  {arch:"lower", mesial:"left",  dentes:[31,32,33,34,35,36,37,38]},
];
const ODONTO_BLOCOS_DECID = [
  {arch:"upper", mesial:"right", dentes:[55,54,53,52,51]},
  {arch:"upper", mesial:"left",  dentes:[61,62,63,64,65]},
  {arch:"lower", mesial:"right", dentes:[85,84,83,82,81]},
  {arch:"lower", mesial:"left",  dentes:[71,72,73,74,75]},
];
const FACE_COR = { cariado:"#e11d48", restaurado:"#2563eb", fraturado:"#d97706" };
const FACE_LABEL = { oclusal:"Oclusal/Incisal", vestibular:"Vestibular", lingual:"Lingual/Palatina", mesial:"Mesial", distal:"Distal" };
const STATUS_FACE_LABEL = { higido:"Saudável (limpar marcação)", cariado:"Cárie", restaurado:"Restauração", fraturado:"Fratura" };
const DENTE_BADGE = {
  ausente:   {label:"✕", cor:"#64748b", nome:"Ausente/Extraído"},
  a_extrair: {label:"!", cor:"#e11d48", nome:"A extrair"},
  implante:  {label:"IM", cor:"#059669", nome:"Implante"},
  coroa:     {label:"C", cor:"#d97706", nome:"Coroa"},
  canal:     {label:"TC", cor:"#7c3aed", nome:"Tratamento de canal"},
  protese:   {label:"PR", cor:"#0ea5e9", nome:"Prótese"},
};
const STATUS_DENTE_LABEL = { nenhum:"Nenhum (limpar)", ausente:"Ausente/Extraído", a_extrair:"A extrair", implante:"Implante", coroa:"Coroa", canal:"Tratamento de canal", protese:"Prótese" };

function _odontoToothSVG(numero, estadoDente, bloco, interactive){
  const T = 40, cell = T/3;
  const faces = (estadoDente && estadoDente.faces) || {};
  const denteStatus = estadoDente && estadoDente.dente;
  const topFace = bloco.arch === "upper" ? "vestibular" : "lingual";
  const bottomFace = bloco.arch === "upper" ? "lingual" : "vestibular";
  const leftFace = bloco.mesial === "right" ? "distal" : "mesial";
  const rightFace = bloco.mesial === "right" ? "mesial" : "distal";
  const cellRect = (face, x, y) => {
    const cor = faces[face] ? FACE_COR[faces[face]] : "#fff";
    const click = interactive ? `onclick="onOdontoFaceClick('${numero}','${face}')" style="cursor:pointer"` : "";
    return `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${cor}" stroke="#94a3b8" stroke-width="0.7" ${click}><title>${numero} - ${FACE_LABEL[face]}${faces[face]?" - "+STATUS_FACE_LABEL[faces[face]]:""}</title></rect>`;
  };
  let svg = `<svg width="${T}" height="${T+14}" viewBox="0 0 ${T} ${T+14}" style="overflow:visible">`;
  svg += cellRect(topFace, cell, 0);
  svg += cellRect(leftFace, 0, cell);
  svg += cellRect("oclusal", cell, cell);
  svg += cellRect(rightFace, cell*2, cell);
  svg += cellRect(bottomFace, cell, cell*2);
  if(denteStatus && DENTE_BADGE[denteStatus]){
    const b = DENTE_BADGE[denteStatus];
    if(denteStatus==="ausente"){
      svg += `<line x1="1" y1="1" x2="${T-1}" y2="${T-1}" stroke="#64748b" stroke-width="2.4"/><line x1="${T-1}" y1="1" x2="1" y2="${T-1}" stroke="#64748b" stroke-width="2.4"/>`;
    }
    svg += `<circle cx="${T/2}" cy="${T+7}" r="7" fill="${b.cor}"/><text x="${T/2}" y="${T+9.5}" font-size="7" fill="#fff" text-anchor="middle" font-family="sans-serif">${b.label}</text>`;
  }
  const numClick = interactive ? `onclick="onOdontoDenteClick('${numero}')" style="cursor:pointer"` : "";
  svg += `<text x="${T/2}" y="-4" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" font-family="sans-serif" ${numClick}>${numero}</text>`;
  svg += `</svg>`;
  return svg;
}
function renderOdontograma(estado, interactive){
  const linha = (blocos) => `<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">` +
    blocos.map(bl => `<div style="display:flex;gap:2px">` + bl.dentes.map(n => _odontoToothSVG(String(n), estado[String(n)], bl, interactive)).join("") + `</div>`).join(`<div style="width:14px"></div>`) + `</div>`;
  const permanentes = `${linha([ODONTO_BLOCOS[0],ODONTO_BLOCOS[1]])}${linha([ODONTO_BLOCOS[2],ODONTO_BLOCOS[3]])}`;
  const decid = `${linha([ODONTO_BLOCOS_DECID[0],ODONTO_BLOCOS_DECID[1]])}${linha([ODONTO_BLOCOS_DECID[2],ODONTO_BLOCOS_DECID[3]])}`;
  return { permanentes, decid };
}
function odontoLegenda(){
  const itens = [...Object.entries(FACE_COR).map(([k,c])=>({cor:c,nome:STATUS_FACE_LABEL[k]})), ...Object.values(DENTE_BADGE).map(b=>({cor:b.cor,nome:b.nome}))];
  return `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">` +
    itens.map(i=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b"><span style="width:11px;height:11px;border-radius:3px;background:${i.cor};display:inline-block"></span>${i.nome}</span>`).join("") + `</div>`;
}

let ODONTO_DECID_VISIVEL = false;

    <div style="overflow-x:auto;padding:6px 0">${svgs.permanentes}</div>
    ${ODONTO_DECID_VISIVEL?`<div style="overflow-x:auto;padding:6px 0;margin-top:6px;border-top:1px dashed var(--line)"><p class="meta" style="margin:8px 0 4px">Dentição decídua</p>${svgs.decid}</div>`:""}
    ${odontoLegenda()}
    ${FICHA_ODONTO.historico && FICHA_ODONTO.historico.length ? `

      <div style="margin-top:8px;max-height:220px;overflow-y:auto">
        ${FICHA_ODONTO.historico.map(h=>`<div class="row" style="padding:7px 0">
          <div style="min-width:44px;text-align:center"><b style="font-size:12px">${esc(h.dente)}</b></div>
          <div class="grow"><div style="font-size:12.5px">${h.face==="dente"?(STATUS_DENTE_LABEL[h.status]||h.status):(FACE_LABEL[h.face]+" — "+(STATUS_FACE_LABEL[h.status]||h.status))}${h.observacao?" · "+esc(h.observacao):""}</div>
          <div class="meta">${esc(h.profissionalNome)} · ${fmtDateTime(h.created_at)}</div></div>
        </div>`).join("")}
      </div>
    </details>`:""}
  </div>`;
}

async function openFicha(pid){

  FICHA_ANEXOS = [];
  FICHA_ODONTO = { estado:{}, historico:[] };

  render(); // mostra a ficha imediatamente
  const [ev, ax, ret] = await Promise.all([
    api("GET", `/evolucoes?patient_id=${encodeURIComponent(pid)}`),
    api("GET", `/anexos?patient_id=${encodeURIComponent(pid)}`),
    api("GET", `/retorno/${encodeURIComponent(pid)}`),
  ]);
  FICHA_EVOLUCOES = ev; FICHA_ANEXOS = ax; FICHA_RETORNO = ret.meses;
  if(TAB==="ficha" && FICHA_ID===pid) render(); // atualiza com os dados carregados
  carregarFotoFicha(pid);

async function carregarFotoFicha(pid){
  const el = document.getElementById("ficha-avatar");
  if(!el) return;
  try{
    const r = await api("GET", `/patients/${pid}/foto/url`);
    if(TAB==="ficha" && FICHA_ID===pid){
      const el2 = document.getElementById("ficha-avatar");
      if(el2) el2.innerHTML = `<img src="${r.url}" style="width:100%;height:100%;object-fit:cover" alt="Foto">`;
    }
  }catch(e){ /* sem foto ainda — mantém iniciais */ }
}
async function uploadFotoPaciente(input, pid){
  const f = input.files[0]; if(!f) return;
  input.value = "";
  if(f.size > 15*1024*1024){ toast("Imagem maior que 15 MB."); return; }
  toast("Enviando foto…");
  const fd = new FormData();
  fd.append("file", f);
  await apiUpload(`/patients/${pid}/foto`, fd);
  toast("Foto atualizada. 📷");

/* ════════════════════════════════════════════
   ANAMNESE — geração de ficha para impressão
════════════════════════════════════════════ */
async function gerarAnamnese(pid){
  const p = pById(pid); if(!p) return;
  toast("Gerando ficha…");
  let odontoHTML = `<div class="odonto-box">(sem marcações registradas ainda)</div>`;
  try{
    const od = await api("GET", `/odontograma?patient_id=${encodeURIComponent(pid)}`);
    if(od && od.estado && Object.keys(od.estado).length){
      const svgs = renderOdontograma(od.estado, false);
      const temDecid = Object.keys(od.estado).some(d => parseInt(d) >= 51 && parseInt(d) <= 85);
      odontoHTML = `<div style="margin-bottom:10px">${svgs.permanentes}${temDecid?svgs.decid:""}</div>${odontoLegenda()}`;
    }
  }catch(e){ /* segue sem odontograma se a chamada falhar */ }
  const idade = p.birth ? Math.floor((new Date() - new Date(p.birth+"T00:00:00")) / 31557600000) : "";
  const menor = idade !== "" && idade < 18;

async function saveEvolucao(){
  const g=i=>document.getElementById(i)?.value;
  if(!g("e-cont")?.trim()){ toast("Descreva a evolução."); return; }
  if(!g("e-prof")){ toast("Selecione o dentista responsável."); return; }
  if(!confirm("Registrar esta evolução? Após salvar, ela não poderá ser editada nem excluída.")) return;
  await api("POST","/evolucoes",{
    patientId: FICHA_ID,
    profissionalId: parseInt(g("e-prof")),
    denteRegiao: g("e-dente")||"",
    procedimento: g("e-proc")||"",
    conteudo: g("e-cont").trim(),
  });
  FICHA_EVOLUCOES = await api("GET", `/evolucoes?patient_id=${encodeURIComponent(FICHA_ID)}`);
  render(); toast("Evolução registrada. 📋");
}
async function uploadAnexo(input){
  const f = input.files[0]; if(!f) return;
  input.value = "";
  if(f.size > 15*1024*1024){ toast("Arquivo maior que 15 MB."); return; }
  const cat = document.getElementById("anexo-cat")?.value || "documento";
  toast("Enviando arquivo…");
  const fd = new FormData();
  fd.append("patientId", FICHA_ID);
  fd.append("categoria", cat);
  fd.append("file", f);
  const novo = await apiUpload("/anexos", fd);
  FICHA_ANEXOS = [novo, ...FICHA_ANEXOS];
  render();
  toast("Arquivo anexado. 📎");
}
async function verAnexo(id){
  const r = await api("GET", `/anexos/${id}/url`);
  window.open(r.url, "_blank");
}
async function delAnexo(id){
  const a = FICHA_ANEXOS.find(x=>x.id===id);
  const aviso = a && a.categoria==="consentimento"
    ? "ATENÇÃO: este é um TERMO DE CONSENTIMENTO — documento legal. Excluir mesmo assim?"
    : "Excluir este anexo permanentemente?";
  if(!confirm(aviso)) return;
  await api("DELETE", `/anexos/${id}`);
  FICHA_ANEXOS = FICHA_ANEXOS.filter(x=>x.id!==id);
  render(); toast("Anexo excluído.");
}
async function migrarNotas(pid){
  const p = pById(pid); if(!p || !p.notes?.trim()) return;
  const profSel = document.getElementById("e-prof");
  const profId = profSel ? parseInt(profSel.value) : null;
  if(!profId){ toast("Selecione o dentista no formulário acima antes de migrar."); return; }
  if(!confirm("Copiar as observações antigas para uma evolução? O campo de observações será limpo após a migração.")) return;
  await api("POST","/evolucoes",{
    patientId: pid, profissionalId: profId,
    denteRegiao: "", procedimento: "Migração de histórico",
    conteudo: "[Migrado das observações do cadastro]\n\n" + p.notes.trim(),
  });
  await api("PUT",`/patients/${pid}`,{...p, notes:""});
  await reloadAll();
  FICHA_EVOLUCOES = await api("GET", `/evolucoes?patient_id=${encodeURIComponent(pid)}`);
  TAB="ficha"; FICHA_ID=pid; render();
  toast("Histórico migrado para o prontuário.");
}

/* ════════════════════════════════════════════
   RELATÓRIOS (produção por dentista)
════════════════════════════════════════════ */
function _relShiftMes(delta){
  let [y,m] = REL_MES.split("-").map(Number);
  m += delta;
  if(m===0){ m=12; y--; } else if(m===13){ m=1; y++; }
  REL_MES = `${y}-${String(m).padStart(2,"0")}`;
  render();
}
function vRelatorios(){
  const mesLabel = (()=>{ const [y,m]=REL_MES.split("-").map(Number);
    return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m-1]+" "+y; })();
  const linha = (nome, cor, profId)=>{
    const match = x => (profId===null ? !x.profissionalId : x.profissionalId===profId);
    const concluidas = DB.appointments.filter(a=>match(a) && a.status==="concluido" && a.date.slice(0,7)===REL_MES).length;
    const agendadas = DB.appointments.filter(a=>match(a) && a.date.slice(0,7)===REL_MES && a.status!=="cancelado").length;
    const recebido = (DB.lancamentos||[]).filter(l=>match(l) && l.pagoEm && l.pagoEm.slice(0,7)===REL_MES).reduce((s,l)=>s+l.valor,0);
    const emAberto = (DB.lancamentos||[]).filter(l=>match(l) && !l.pagoEm).reduce((s,l)=>s+l.valor,0);
    const orcAprov = (DB.orcamentos||[]).filter(o=>match(o) && o.status==="aprovado" && o.data.slice(0,7)===REL_MES);
    const orcAprovTotal = orcAprov.reduce((s,o)=>s+o.total,0);
    if(!agendadas && !recebido && !emAberto && !orcAprov.length) return "";
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span class="prof-dot" style="background:${cor};width:12px;height:12px"></span>
        <b style="font-size:14px">${esc(nome)}</b>
      </div>
      <div class="grid g4">
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px">${concluidas}<span style="font-size:12px;color:var(--mut)">/${agendadas}</span></b><span>Concluídas / agendadas</span></div>
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px;color:var(--green)">${fmtMoney(recebido)}</b><span>Recebido no mês</span></div>
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px">${fmtMoney(emAberto)}</b><span>Em aberto (total)</span></div>
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px">${orcAprov.length}<span style="font-size:12px;color:var(--mut)"> · ${fmtMoney(orcAprovTotal)}</span></b><span>Orçamentos aprovados</span></div>
      </div>
    </div>`;
  };
  const profs = DB.profissionais.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const corpo = profs.map(p=>linha(p.nome, p.cor, p.id)).join("") + linha("Sem dentista atribuído", "#94a3b8", null);
  return `${header("Relatórios","Produção e faturamento por dentista.")}
  <div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_relShiftMes(-1)">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${mesLabel}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_relShiftMes(1)">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="REL_MES=todayISO().slice(0,7);render()">Mês atual</button>
  </div>
  ${corpo || empty("Nenhum movimento neste mês.")}`;
}

/* ════════════════════════════════════════════
   SATISFAÇÃO
════════════════════════════════════════════ */
function vSurvey(C){
  const surveyed=new Map(DB.surveys.map(s=>[s.appointmentId,s]));
  const done=DB.appointments.filter(a=>a.status==="concluido").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const scores=DB.surveys.filter(s=>s.score!==null&&s.score!==undefined).map(s=>s.score);
  const prom=scores.filter(s=>s>=9).length, det=scores.filter(s=>s<=6).length;
  return header("Pesquisa de satisfação","Envie o NPS após consultas concluídas e registre as notas.")+`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="stat ${C.nps!==null&&C.nps>=50?"good":""}"><b>${C.nps===null?"—":C.nps}</b><span>NPS</span></div>
    <div class="stat"><b>${prom}</b><span>Promotores (9–10)</span></div>
    <div class="stat"><b>${det}</b><span>Detratores (0–6)</span></div>
  </div>`+
  (done.length===0?empty("Nenhuma consulta concluída ainda."):
  done.map(a=>{const p=pById(a.patientId), s=surveyed.get(a.id);
    let actions;
    if(!s) actions=p?`<button class="btn whats sm" onclick="sendSurvey('${a.id}')">${IC.send} Enviar pesquisa</button>`:"";
    else if(s.score===null||s.score===undefined)
      actions=`<div class="score-grid"><span class="meta" style="margin-right:4px">Nota:</span>`+
        Array.from({length:11},(_,i)=>`<button onclick="setScore('${s.id}',${i})">${i}</button>`).join("")+`</div>`;
    else { const cls=s.score>=9?"hi":s.score>=7?"mid":"lo"; actions=`<span class="note ${cls}">Nota ${s.score}</span>`; }
    return queueCard(p?p.name:"Paciente removido",a.procedure+" em "+fmtDate(a.date),
      s&&(s.score===null||s.score===undefined)?"Enviada em "+fmtDate(s.sentAt)+" — aguardando nota":null,actions);
  }).join(""));
}
async function sendSurvey(apptId){
  const a=DB.appointments.find(x=>x.id===apptId), p=pById(a.patientId); if(!p)return;
  const msg=fill(DB.settings.msgSurvey||"",{nome:p.name.split(" ")[0]});

function renderChatMsgsHTML(){

async function sendChat(){

    </div>
    <label class="f"><span>Avisar com quanto tempo de antecedência</span>
      <select id="s-notif-min" style="max-width:200px">
        <option value="15" ${s.notifLembreteMinutos==="15"?"selected":""}>15 minutos antes</option>
        <option value="30" ${s.notifLembreteMinutos==="30"?"selected":""}>30 minutos antes</option>
        <option value="60" ${(!s.notifLembreteMinutos||s.notifLembreteMinutos==="60")?"selected":""}>1 hora antes</option>
        <option value="120" ${s.notifLembreteMinutos==="120"?"selected":""}>2 horas antes</option>
        <option value="1440" ${s.notifLembreteMinutos==="1440"?"selected":""}>1 dia antes</option>

      <button class="btn sm" onclick="backupAgora()">🛡️ Fazer backup agora</button>

      <button class="btn ghost sm" onclick="document.getElementById('importFile').click()">${IC.upload} Importar backup (.json)</button>

async function saveSettings(){
  const g=i=>document.getElementById(i).value;
  await api("PUT","/settings",{
    googleReviewLink:g("s-link").trim(), inactivityMonths:g("s-months"),
    retornoMesesPadrao:g("s-retorno"),
    msgConfirm:g("s-confirm"), msgReactivate:g("s-react"), msgSurvey:g("s-survey"),
    msgReview:g("s-review"), msgAniversario:g("s-bday"), msgRetorno:g("s-retorno-msg"),
    notifLembreteMinutos:g("s-notif-min"), notifAtivas: document.getElementById("s-notif-ativas").checked?"true":"false"
  });
  await reloadAll(); toast("Ajustes salvos.");
}
async function backupAgora(){
  toast("Gerando backup…");
  const r = await api("POST","/backup/agora");
  toast(`Backup salvo no Supabase: ${r.arquivo} 🛡️`);
}
async function exportBackup(){
  const data = await api("GET","/dump");
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = todayISO();
  a.href = url; a.download = `backup-crm-moura-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Backup exportado!");
}
async function importBackup(input){
  const f=input.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const d=JSON.parse(reader.result);
      if(!d.patients||!d.appointments) throw 0;
      await api("POST","/import",d);
      await reloadAll(); toast("Backup importado com sucesso!");
    }catch(e){ toast("Arquivo inválido."); }
  };
  reader.readAsText(f); input.value="";
}

/* ════════════════════════════════════════════
   PUSH NOTIFICATIONS (cliente)
════════════════════════════════════════════ */
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function checkPushStatus(){
  if(!PUSH_SUPPORTED) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    PUSH_SUBSCRIBED = !!sub;
  }catch(e){ PUSH_SUBSCRIBED = false; }
  const statusEl = document.getElementById("push-status");
  const btnEl = document.getElementById("push-toggle-btn");
  if(statusEl) statusEl.textContent = PUSH_SUBSCRIBED ? "Ativadas neste dispositivo ✓" : "Desativadas neste dispositivo";
  if(btnEl){ btnEl.textContent = PUSH_SUBSCRIBED?"Desativar":"Ativar"; btnEl.classList.toggle("ghost",PUSH_SUBSCRIBED); }
  const testBtn = document.querySelector("button[onclick='testPush()']");
  if(testBtn) testBtn.disabled = !PUSH_SUBSCRIBED;
}
async function togglePush(){
  if(!PUSH_SUPPORTED){ toast("Seu navegador não suporta notificações push."); return; }
  const reg = await navigator.serviceWorker.ready;
  if(PUSH_SUBSCRIBED){
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await api("POST","/push/unsubscribe",{endpoint:sub.endpoint});
      await sub.unsubscribe();
    }
    PUSH_SUBSCRIBED=false; toast("Notificações desativadas.");
  } else {
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ toast("Permissão de notificação negada."); return; }
    const {publicKey} = await api("GET","/push/vapid-public-key");
    if(!publicKey){ toast("Notificações indisponíveis: chaves VAPID não configuradas no servidor."); return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await api("POST","/push/subscribe",{
      endpoint:sub.endpoint,
      keys:{ p256dh: arrayBufferToBase64(sub.getKey("p256dh")), auth: arrayBufferToBase64(sub.getKey("auth")) },
      profissionalId: CHAT_PROF_ID, label: navigator.userAgent.slice(0,60)
    });
    PUSH_SUBSCRIBED=true; toast("Notificações ativadas!");
  }
  render();
}
function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  let str="";
  for(const b of bytes) str+=String.fromCharCode(b);
  return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function testPush(){
  const r = await api("POST","/push/test",{profissionalId: CHAT_PROF_ID});
  toast(r.sent>0 ? `Notificação enviada (${r.sent}).` : "Nenhuma inscrição ativa encontrada.");
}

/* ════════════════════════════════════════════
   LOGIN / SETUP / EQUIPE
════════════════════════════════════════════ */
async function showLogin(){
  document.getElementById("login-screen")?.remove();
  let setup = false;
  try { const s = await fetch(API + "/auth/status").then(r=>r.json()); setup = !!s.setup; } catch(e){}
  const div = document.createElement("div");
  div.id = "login-screen";
  div.style.cssText = "position:fixed;inset:0;z-index:100;background:var(--teal-900);display:flex;align-items:center;justify-content:center;padding:18px";
  div.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:28px;width:100%;max-width:380px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <svg width="34" height="34" viewBox="0 0 32 32"><path d="M16 4c-4 0-9 1.5-9 7 0 4 1.5 6 2.4 9.5.9 3.6 1.3 7.5 3.4 7.5 2 0 1.4-5 3.2-5s1.2 5 3.2 5c2.1 0 2.5-3.9 3.4-7.5C23.5 17 25 15 25 11c0-5.5-5-7-9-7z" fill="#0f766e"/></svg>
        <div><b style="font-size:17px">CRM Moura</b><div class="meta">Odontologia e Associados</div></div>
      </div>
      ${setup ? `
        <h2 style="font-size:15px;margin-bottom:4px">Primeiro acesso</h2>
        <p class="meta" style="margin-bottom:14px">Crie o usuário administrador do sistema.</p>
        <label class="f"><span>Seu nome</span><input id="lg-nome" autocomplete="name"></label>` : `
        <h2 style="font-size:15px;margin-bottom:14px">Entrar</h2>`}
      <label class="f"><span>E-mail</span><input id="lg-email" type="email" autocomplete="username"></label>
      <label class="f"><span>Senha ${setup?"(mínimo 8 caracteres)":""}</span><input id="lg-senha" type="password" autocomplete="${setup?"new-password":"current-password"}" onkeydown="if(event.key==='Enter')authSubmit(${setup})"></label>
      <button class="btn" style="width:100%;justify-content:center;margin-top:6px" onclick="authSubmit(${setup})">${setup?"Criar e entrar":"Entrar"}</button>
    </div>`;
  document.body.appendChild(div);
  setTimeout(()=>document.getElementById(setup?"lg-nome":"lg-email")?.focus(), 50);
}
async function authSubmit(setup){
  const g=i=>document.getElementById(i)?.value;
  const email=(g("lg-email")||"").trim(), senha=g("lg-senha")||"";
  if(!email || !senha){ toast("Preencha e-mail e senha."); return; }
  try{
    const r = setup
      ? await api("POST","/auth/setup",{nome:(g("lg-nome")||"").trim()||email.split("@")[0], email, senha})
      : await api("POST","/auth/login",{email, senha});
    AUTH_TOKEN = r.token; AUTH_NOME = r.nome;
    localStorage.setItem("crm_token", AUTH_TOKEN);
    localStorage.setItem("crm_nome", AUTH_NOME);
    document.getElementById("login-screen")?.remove();
    await reloadAll();
    toast(`Bem-vindo, ${AUTH_NOME.split(" ")[0]}! 👋`);
  }catch(e){ /* toast já exibido pelo api() */ }
}
async function logout(){
  try{ await api("POST","/auth/logout"); }catch(e){}
  AUTH_TOKEN=""; AUTH_NOME="";
  localStorage.removeItem("crm_token"); localStorage.removeItem("crm_nome");
  showLogin();
}
async function openUsuariosModal(){
  const usuarios = await api("GET","/usuarios");
  modal("Equipe e acesso",`
    ${usuarios.map(u=>`
      <div class="row">
        <div class="avatar">${initials(u.nome)}</div>
        <div class="grow">
          <div style="font-weight:500;font-size:14px">${esc(u.nome)} ${!u.ativo?'<span class="pill p-cancelado">Inativo</span>':""}</div>
          <div class="meta">${esc(u.email)}</div>
        </div>
        <button class="btn ghost sm" onclick="openUsuarioForm(${u.id},'${esc(u.nome)}','${esc(u.email)}',${u.ativo})">Editar</button>
      </div>`).join("")}
    <div class="acts" style="justify-content:space-between;margin-top:12px">
      <button class="btn ghost" onclick="closeModal()">Fechar</button>
      <button class="btn" onclick="openUsuarioForm()">${IC.plus} Novo usuário</button>
    </div>`);
}
function openUsuarioForm(id, nome, email, ativo){
  modal(id?"Editar usuário":"Novo usuário",`
    <label class="f"><span>Nome *</span><input id="u-nome" value="${nome||""}"></label>
    <label class="f"><span>E-mail *</span><input id="u-email" type="email" value="${email||""}"></label>
    <label class="f"><span>${id?"Nova senha (deixe vazio para manter)":"Senha * (mínimo 8 caracteres)"}</span><input id="u-senha" type="password" autocomplete="new-password"></label>
    ${id?`<label class="f"><span>Status</span><select id="u-ativo"><option value="true" ${ativo?"selected":""}>Ativo</option><option value="false" ${!ativo?"selected":""}>Inativo</option></select></label>`:""}
    <div class="acts"><button class="btn ghost" onclick="openUsuariosModal()">Voltar</button>
    <button class="btn" onclick="saveUsuario(${id||0})">Salvar</button></div>`);
}
async function saveUsuario(id){
  const g=i=>document.getElementById(i)?.value;
  const payload = {
    nome:(g("u-nome")||"").trim(), email:(g("u-email")||"").trim(),
    senha:g("u-senha")||null,
    ativo: id ? g("u-ativo")==="true" : true,
  };
  if(!payload.nome || !payload.email){ toast("Preencha nome e e-mail."); return; }
  if(id){ await api("PUT",`/usuarios/${id}`,payload); }
  else {
    if(!payload.senha){ toast("Defina uma senha para o novo usuário."); return; }
    await api("POST","/usuarios",payload);
  }
  toast("Usuário salvo.");
  openUsuariosModal();
}

/* ════════════════════════════════════════════
   COMPONENTES COMPARTILHADOS
════════════════════════════════════════════ */
function header(title,sub,action){ return `<div class="hd"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${action||""}</div>`; }
function empty(t){ return `<div class="empty">${t}</div>`; }
function pill(s){ return `<span class="pill p-${s}">${STATUS[s]||s}</span>`; }
function queueCard(name,meta,flag,actions){
  return `<div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="grow"><div style="font-weight:500;font-size:14px">${esc(name)}</div><div class="meta">${esc(meta)}</div>
    ${flag?`<div class="flag">${esc(flag)}</div>`:""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${actions}</div></div>`;
}
function modal(title,body){
  closeModal();
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="modalBg";
  bg.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hd"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${IC.x}</button></div>${body}</div>`;
  bg.onclick=closeModal; document.body.appendChild(bg);
}
function closeModal(){ document.getElementById("modalBg")?.remove(); }

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(()=>{
      checkPushStatus().then(()=>{ if(TAB==="settings") render(); });
    }).catch(()=>{});
  });
}

/* ── inicialização ── */
(async function boot(){
  if(!AUTH_TOKEN){ showLogin(); return; }
  try { await reloadAll(); }
  catch(e){ /* 401 já redireciona para o login dentro do api() */ }
})();
</script>
