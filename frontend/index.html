<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM</title>
<meta name="theme-color" content="#134e4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --teal-950:#042f2e;--teal-900:#134e4a;--teal-800:#115e59;--teal-700:#0f766e;--teal-300:#5eead4;--teal-100:#ccfbf1;
  --ink:#0f172a;--mut:#64748b;--soft:#94a3b8;--bg:#f1f5f4;--card:#fff;--line:#e2e8f0;
  --amber:#d97706;--amber-bg:#fffbeb;--green:#059669;--green-bg:#ecfdf5;--rose:#e11d48;--rose-bg:#fff1f2;
  --purple:#7c3aed;--purple-bg:#f5f3ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-700);outline-offset:-1px}
.app{display:flex;flex-direction:column;min-height:100dvh}
@media(min-width:768px){.app{flex-direction:row}}
.side{background:var(--teal-900);color:var(--teal-100);display:flex;flex-direction:row;position:fixed;bottom:0;left:0;right:0;z-index:30;overflow-x:auto;padding:6px;gap:2px;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
@media(min-width:768px){.side{position:static;flex-direction:column;width:230px;min-height:100dvh;padding:0;box-shadow:none;overflow:visible}}
.brand{display:none;align-items:center;gap:10px;padding:22px 18px;border-bottom:1px solid var(--teal-800)}
@media(min-width:768px){.brand{display:flex}}
.brand b{display:block;line-height:1.1}
.brand small{color:var(--teal-300);font-size:11px}
nav.menu{display:flex;flex-direction:row;flex:1;gap:2px}
@media(min-width:768px){nav.menu{flex-direction:column;padding:10px;gap:3px}}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 10px;border-radius:10px;color:var(--teal-300);font-size:10px;flex:1;position:relative;white-space:nowrap}
@media(min-width:768px){.nav-btn{flex-direction:row;gap:11px;font-size:14px;padding:10px 12px;flex:none}}
.nav-btn.on{background:var(--teal-700);color:#fff}
.nav-btn svg{width:19px;height:19px;flex-shrink:0}
.badge{position:absolute;top:2px;right:6px;background:#fbbf24;color:var(--teal-950);font-size:10px;font-weight:700;border-radius:99px;padding:0 5px;min-width:17px;text-align:center}
@media(min-width:768px){.badge{position:static;margin-left:auto}}
main{flex:1;padding:18px 16px 90px;max-width:920px;margin:0 auto;width:100%}
@media(min-width:768px){main{padding:32px 32px 40px}}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.hd h1{font-size:21px;letter-spacing:-.3px}
.hd p{color:var(--mut);font-size:13px;margin-top:3px;max-width:520px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12px;color:var(--mut);margin-top:3px}
.stat.warn b{color:var(--amber)}.stat.good b{color:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:14px;color:#334155;margin-bottom:11px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:34px 18px;text-align:center;color:var(--soft);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--teal-700);color:#fff;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:#334155;border:1px solid var(--line)}
.btn.whats{background:var(--green)}
.btn.danger{background:var(--rose)}
.btn.danger-link{background:none;color:var(--rose);padding:6px}
.btn.sm{padding:7px 12px;font-size:13px}
.icon-btn{padding:7px;color:var(--soft);border-radius:8px}
.icon-btn:hover{color:var(--teal-700);background:#f8fafc}
.icon-btn.del:hover{color:var(--rose)}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid}
.p-agendado{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.p-confirmado{background:var(--teal-100);color:var(--teal-800);border-color:#99f6e4}
.p-concluido{background:var(--green-bg);color:var(--green);border-color:#a7f3d0}
.p-faltou{background:var(--rose-bg);color:var(--rose);border-color:#fecdd3}
.p-cancelado{background:#f1f5f9;color:var(--soft);border-color:var(--line)}
.p-pendente{background:var(--amber-bg);color:var(--amber);border-color:#fde68a}
.p-em_andamento{background:var(--purple-bg);color:var(--purple);border-color:#ddd6fe}
.p-concluida{background:var(--green-bg);color:var(--green);border-color:#a7f3d0}
.avatar{width:38px;height:38px;border-radius:99px;background:var(--teal-100);color:var(--teal-800);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.meta{font-size:12px;color:var(--mut)}
.flag{font-size:12px;color:var(--teal-700);margin-top:2px}
.grow{flex:1;min-width:150px}
.searchbar{position:relative;margin-bottom:14px}
.searchbar svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--soft)}
.searchbar input{padding-left:36px}
label.f{display:block;margin-bottom:11px}
label.f span{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:5px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center;padding:18px}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px;max-height:88dvh;overflow-y:auto}
@media(min-width:640px){.modal{border-radius:18px}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-hd h2{font-size:16px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.daynav input{max-width:170px}
.score-grid{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.score-grid button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.score-grid button:hover{background:var(--teal-100);border-color:var(--teal-300)}
.note{font-weight:700;font-size:13px;padding:4px 12px;border-radius:99px}
.note.hi{background:var(--green-bg);color:var(--green)}.note.mid{background:var(--amber-bg);color:var(--amber)}.note.lo{background:var(--rose-bg);color:var(--rose)}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
@media(min-width:768px){.toast{bottom:24px}}
.toast.show{opacity:1}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
a.link{color:var(--teal-700)}
.actions-list li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;list-style:none}
.actions-list b{width:24px;text-align:right;font-variant-numeric:tabular-nums;color:var(--amber)}
.actions-list b.zero{color:#cbd5e1}
.actions-list .go{margin-left:auto;color:var(--teal-700);font-size:12px;font-weight:600}
/* agenda em grade (timeline semanal estilo referência) */
.tg-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tg-scroll{overflow:auto;max-height:calc(100dvh - 310px);min-height:380px}
.tg-head{display:grid;position:sticky;top:0;z-index:35;border-bottom:1px solid var(--line)}
.tg-hcell{background:#fff;padding:7px 4px;text-align:center;border-left:1px solid #f1f5f9;cursor:pointer}
.tg-hcell .dow{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.tg-hcell .dnum{font-size:14px;font-weight:700;color:var(--ink)}
.tg-hcell.today .dnum{color:var(--teal-700)}
.tg-hcell.today{box-shadow:inset 0 -2px 0 var(--teal-700)}
.tg-corner{background:#fff;position:sticky;left:0;z-index:36}
.tg-body{display:grid}
.tg-times{position:sticky;left:0;z-index:25;background:#fff;border-right:1px solid var(--line)}
.tg-time-label{position:absolute;right:5px;transform:translateY(-50%);font-size:10px;color:var(--soft);font-variant-numeric:tabular-nums}
.tg-col{position:relative;border-left:1px solid #f1f5f9}
.tg-col.dom{background:#f8fafc}
.tg-hora-linha{position:absolute;left:0;right:0;height:1px;background:#eef2f6;pointer-events:none}
.tg-shade{position:absolute;left:0;right:0;background:rgba(148,163,184,.12);pointer-events:none}
.tg-ev{position:absolute;border-radius:6px;padding:2px 5px;font-size:10.5px;line-height:1.25;overflow:hidden;cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(15,23,42,.10);border-left:3px solid #64748b;background:#f1f5f9}
.tg-ev b{font-size:10px;font-variant-numeric:tabular-nums;display:block}
.tg-ev.dragging{opacity:.8;cursor:grabbing;z-index:30;box-shadow:0 8px 20px rgba(15,23,42,.3)}
.tg-ev.faltou-ev,.tg-ev.concluido-ev{opacity:.6}
.tg-now{position:absolute;left:0;right:0;height:2px;background:#f97316;z-index:20;pointer-events:none}
.tg-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:#f97316}
.tg-drag-hint{position:fixed;z-index:60;background:var(--ink);color:#fff;font-size:12px;padding:4px 10px;border-radius:8px;pointer-events:none;font-variant-numeric:tabular-nums;white-space:nowrap}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:640px){.kanban{grid-template-columns:1fr}}
.kanban-col{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}
.kanban-col h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:10px}
.kanban-col.col-em_andamento h3{color:var(--purple)}
.kanban-col.col-concluida h3{color:var(--green)}
.task-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:default}
.task-card:last-child{margin-bottom:0}
.task-title{font-size:13px;font-weight:600;margin-bottom:4px}
.task-meta{font-size:11px;color:var(--mut)}
.prio-alta{border-left:3px solid var(--rose)}
.prio-normal{border-left:3px solid var(--amber)}
.prio-baixa{border-left:3px solid var(--soft)}
/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 200px);max-height:600px}
@media(min-width:768px){.chat-wrap{height:calc(100dvh - 180px)}}
.chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f8fafc;border:1px solid var(--line);border-radius:14px 14px 0 0}
.chat-msg{max-width:78%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.45}
.chat-msg.mine{align-self:flex-end;background:var(--teal-700);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.chat-msg .who{font-size:11px;font-weight:700;margin-bottom:3px}
.chat-msg.mine .who{color:#99f6e4}
.chat-msg.other .who{color:var(--teal-700)}
.chat-msg .ts{font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.chat-input{display:flex;gap:8px;padding:10px;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px}
.chat-input input{border-radius:8px}
.chat-input button{flex-shrink:0;background:var(--teal-700);color:#fff;padding:9px 14px;border-radius:8px;display:flex;align-items:center}
/* cor dot profissional */
.prof-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block;margin-right:4px}
/* aniversário banner */
.bday-banner{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.bday-banner .emoji{font-size:28px}
</style>
</head>

/* ── API helpers ── */
/* Evita cliques duplos criando registros repetidos: chamadas de escrita
   (POST/PUT/DELETE) idênticas e simultâneas são ignoradas — a segunda
   tentativa não chega a sair pela rede. */
const _WRITE_METHODS = new Set(["POST","PUT","DELETE"]);
const _inFlight = new Set();
function _modalBusy(busy){
  const modalEl = document.querySelector("#modalBg .modal");
  if(!modalEl) return;
  let overlay = modalEl.querySelector(".busy-overlay");
  if(busy){
    modalEl.style.position = "relative";
    if(!overlay){
      overlay = document.createElement("div");
      overlay.className = "busy-overlay";
      overlay.style.cssText = "position:absolute;inset:0;background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;border-radius:18px;z-index:5";
      overlay.innerHTML = `<span class="spinner" style="border-color:var(--teal-700);border-top-color:transparent;width:22px;height:22px"></span>`;
      modalEl.appendChild(overlay);
    }
  } else if(overlay) overlay.remove();
}

async function api(method, path, body) {
  const key = method + ":" + path + ":" + (body ? JSON.stringify(body) : "");
  const isWrite = _WRITE_METHODS.has(method);
  if (isWrite && _inFlight.has(key)) {
    // Clique duplicado: ignora silenciosamente, sem segunda requisição nem toast de erro.
    return new Promise(()=>{}); // nunca resolve/rejeita — a chamada original é a que vale
  }
  if (isWrite) { _inFlight.add(key); _modalBusy(true); }
  const opts = { method, headers:{"Content-Type":"application/json"} };
  if (AUTH_TOKEN) opts.headers["Authorization"] = "Bearer " + AUTH_TOKEN;
  if (body) opts.body = JSON.stringify(body);
  let r;
  try {
    r = await fetch(API + path, opts);
  } catch(e) {
    if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
    toast("Erro de conexão com o servidor.");
    throw e;
  }
  if (r.status === 401 && !path.startsWith("/auth/")) {
    if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
    AUTH_TOKEN = ""; AUTH_NOME = "";
    localStorage.removeItem("crm_token"); localStorage.removeItem("crm_nome");
    showLogin();
    throw new Error("401");
  }
  if (!r.ok) {
    if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
    let msg = "Erro no servidor (" + r.status + ").";
    try {
      const j = await r.json();
      if (j && j.detail) msg = typeof j.detail === "string" ? j.detail : msg;
    } catch(_) {}
    toast(msg);
    throw new Error(msg);
  }
  if (isWrite) { _inFlight.delete(key); _modalBusy(false); }
  if (r.status === 204) return null;
  return r.json();
}

function calc(){
  const t = todayISO();
  const pendingConfirm = DB.appointments.filter(a=>a.status==="agendado" && a.date>=t && a.date<=addDays(t,2));
  const futureByPatient = new Set(DB.appointments.filter(a=>a.date>=t && (a.status==="agendado"||a.status==="confirmado")).map(a=>a.patientId));
  const cutoff = monthsAgo(parseInt(DB.settings.inactivityMonths)||6);
  const cooldown = addDays(t,-30); // convite enviado nos últimos 30 dias sai da fila
  const inactive = DB.patients.filter(p=>(!p.lastVisit || p.lastVisit<cutoff) && !futureByPatient.has(p.id) && (!p.reactivateSentAt || p.reactivateSentAt <= cooldown));
  const surveyedIds = new Set(DB.surveys.map(s=>s.appointmentId));
  const pendingSurvey = DB.appointments.filter(a=>a.status==="concluido" && !surveyedIds.has(a.id));
  const pendingReview = DB.surveys.filter(s=>s.score>=9 && !s.reviewSent);
  const scores = DB.surveys.filter(s=>s.score!==null && s.score!==undefined).map(s=>s.score);
  const nps = scores.length ? Math.round((scores.filter(s=>s>=9).length - scores.filter(s=>s<=6).length)/scores.length*100) : null;
  const tarefasPendentes = DB.tarefas.filter(t=>t.status!=="concluida").length;
  const aniversarios = DB.aniversariantes.length;
  const finVencidos = (DB.lancamentos||[]).filter(l=>!l.pagoEm && l.vencimento < t).length;
  const orcApresentados = (DB.orcamentos||[]).filter(o=>o.status==="apresentado").length;
  const retornosDue = (DB.retornos||[]).length;
  const anamnesePendentes = (DB.anamneseRemota||[]).length;
  return { t, pendingConfirm, inactive, pendingSurvey, pendingReview, nps,
    badges:{ confirm:pendingConfirm.length, reactivate:inactive.length, survey:pendingSurvey.length, review:pendingReview.length, tarefas:tarefasPendentes, aniversarios, financeiro:finVencidos, orcamentos:orcApresentados, retornos:retornosDue, anamnese:anamnesePendentes } };
}

function go(tab){
  TAB=tab;
  if(CHAT_POLL){ clearInterval(CHAT_POLL); CHAT_POLL=null; }
  if(tab==="chat"){
    reloadChat();
    CHAT_POLL = setInterval(reloadChat, 5000);
  }
  if(tab==="clinicas") carregarClinicasAdmin();
  if(tab==="settings") carregarMeuFeedback();
  if(tab==="feedback") carregarFeedbackAdmin();
  render();
  window.scrollTo(0,0);
}

/* ── render principal ── */
function render(){
  const C = calc();
  document.getElementById("nav").innerHTML = NAV.filter(n=>!n.superadmin || AUTH_IS_SUPERADMIN).map(n=>{
    const b = n.badge && C.badges[n.badge]>0 ? `<span class="badge">${C.badges[n.badge]}</span>` : "";
    return `<button class="nav-btn ${TAB===n.id?"on":""}" onclick="go('${n.id}')">${n.ic}<span>${n.label}</span>${b}</button>`;
  }).join("");
  const views = { dash:vDash, patients:vPatients, agenda:vAgenda, financeiro:vFinanceiro, orcamentos:vOrcamentos, gastos:vGastos, ficha:vFicha, confirm:vConfirm, reactivate:vReactivate,
    retornos:vRetornos, relatorios:vRelatorios, anamnese:vAnamneseRemota, clinicas:vClinicas, feedback:vFeedbackAdmin,
    survey:vSurvey, review:vReview, tarefas:vTarefas, chat:vChat, profissionais:vProfissionais, settings:vSettings };
  document.getElementById("main").innerHTML = views[TAB](C);
  if(TAB==="chat") setupChatUI();
  if(TAB==="agenda" && AGENDA_VIEW==="semana" && AGENDA_SEARCH.trim().length<2) tgAposRender();
  if(TAB==="profissionais") DB.profissionais.forEach(p=>{ if(!ASSINATURA_PROF_CACHE[p.id]) carregarAssinaturaProfissional(p.id); });
}

  const act=(n,txt,tab)=>`<li><b class="${n?"":"zero"}">${n}</b><span style="${n?"":"color:#94a3b8"}">${txt}</span>${n?`<button class="go" onclick="go('${tab}')">Resolver →</button>`:""}</li>`;
  const bdayBanner = DB.aniversariantes.length ? `
    <div class="bday-banner">
      <div class="emoji">🎂</div>
      <div class="grow">

      <div class="emoji">⚠️</div>
      <div class="grow">
        <div style="font-weight:700;font-size:14px;color:#7f1d1d">${MINHA_ASSINATURA.status==="cancelada"?"Assinatura cancelada":"Assinatura em atraso"}</div>
        <div style="font-size:13px;color:#7f1d1d">Regularize o pagamento da plataforma pra continuar usando sem interrupções.${MINHA_ASSINATURA.planoNome?" Plano: "+esc(MINHA_ASSINATURA.planoNome)+".":""}</div>
      </div>
    </div>` : "";
  return `${header("Painel","Hoje, "+fmtDate(C.t))}
  ${assinBanner}

  <div class="grid g4" style="margin-bottom:16px">
    <button class="stat" onclick="go('patients')"><b>${DB.patients.length}</b><span>Pacientes</span></button>
    <button class="stat" onclick="go('agenda')"><b>${todayAppts.length}</b><span>Consultas hoje</span></button>
    <button class="stat ${C.badges.confirm?"warn":""}" onclick="go('confirm')"><b>${C.badges.confirm}</b><span>A confirmar (48h)</span></button>
    <button class="stat ${C.nps!==null&&C.nps>=50?"good":""}" onclick="go('survey')"><b>${C.nps===null?"—":C.nps}</b><span>NPS</span></button>
  </div>
  <div class="grid" style="grid-template-columns:1fr;gap:12px">
    <div class="card"><h2>Agenda de hoje</h2>
      ${todayAppts.length===0?`<div style="color:#94a3b8;font-size:14px;padding:8px 0">Nenhuma consulta hoje.</div>`:
        todayAppts.map(a=>{
          const prof = a.profissionalId ? profById(a.profissionalId) : null;
          return `<div class="row">
            <b style="color:var(--teal-800);font-variant-numeric:tabular-nums">${a.time}</b>
            <div class="grow">
              <div style="font-weight:500;font-size:14px">${esc(pName(a.patientId))}</div>
              <div class="meta">${esc(a.procedure)}${prof?` · <span style="color:${prof.cor}">${esc(prof.nome)}</span>`:""}${a.duracaoMinutos?` · ${a.duracaoMinutos}min`:""}</div>
            </div>
            ${pill(a.status)}
          </div>`;
        }).join("")}
    </div>
    <div class="card"><h2>Próximas ações</h2>
      <ul class="actions-list">
        ${act(C.badges.confirm,"consultas aguardando confirmação","confirm")}
        ${act(C.badges.reactivate,"pacientes inativos para reativar","reactivate")}
        ${act(C.badges.survey,"pesquisas de satisfação a enviar","survey")}
        ${act(C.badges.review,"pedidos de avaliação Google pendentes","review")}

}

    !q || p.name.toLowerCase().includes(q) ||

async function savePatient(id){
  const g=i=>document.getElementById(i).value.trim();
  const f={
    name:g("f-name"),phone:g("f-phone"),email:g("f-email"),birth:g("f-birth")||null,lastVisit:g("f-last")||null,notes:g("f-notes"),numProntuario:g("f-pron"),
    rg:g("f-rg"),orgaoExpedidor:g("f-orgao"),cpf:g("f-cpf"),naturalidade:g("f-natur"),nacionalidade:g("f-nac"),estadoCivil:g("f-civil"),
    profissao:g("f-prof"),localTrabalho:g("f-trab"),enderecoResidencial:g("f-end"),indicadoPor:g("f-indic"),
    respNome:g("f-r-nome"),respRg:g("f-r-rg"),respCpf:g("f-r-cpf"),respTelefone:g("f-r-tel"),respEmail:g("f-r-email"),
    alergias:g("f-alerg"),medicacoes:g("f-medic"),condicoesSistemicas:g("f-cond"),
  };
  if(!f.name || digits(f.phone).length<10){ toast("Preencha nome e telefone válido."); return; }
  if(id){
    await api("PUT",`/patients/${id}`,{...f,id});
    closeModal(); await reloadAll(); toast("Paciente salvo.");
  } else {
    const novo = await api("POST","/patients",f);
    closeModal(); await reloadAll(); toast("Paciente cadastrado!");
    abrirCompartilharAnamnese(novo.id, novo.name, novo.phone);
  }
}

function vAgenda(){
  const viewBtns = ["dia","semana","mes","ano"].map(v=>
    `<button class="btn ${AGENDA_VIEW===v?"":"ghost"} sm" onclick="AGENDA_VIEW='${v}';render()" style="text-transform:capitalize">${v}</button>`
  ).join("");
  const buscando = AGENDA_SEARCH.trim().length >= 2;
  const body = buscando ? vAgendaBusca() :
               AGENDA_VIEW==="dia" ? vAgendaDia() :
               AGENDA_VIEW==="semana" ? vAgendaSemana() :
               AGENDA_VIEW==="mes" ? vAgendaMes() : vAgendaAno();
  return `${header("Agenda","",`<button class="btn" onclick="openApptForm()" ${DB.patients.length===0?"disabled":""}>${IC.plus} Nova consulta</button>`)}
  <div class="searchbar">${IC.search}<input id="agenda-search" value="${esc(AGENDA_SEARCH)}" oninput="AGENDA_SEARCH=this.value;renderKeepFocusAgenda(this)" placeholder="Buscar paciente na agenda…"></div>
  ${buscando?"":`<div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">${viewBtns}</div>`}
  ${body}`;
}
function renderKeepFocusAgenda(el){ const pos=el.selectionStart; render(); const n=document.getElementById("agenda-search"); if(n){n.focus();n.setSelectionRange(pos,pos);} }

function vAgendaBusca(){
  const q = AGENDA_SEARCH.trim().toLowerCase();
  const t = todayISO();
  const matches = DB.appointments
    .filter(a=>pName(a.patientId).toLowerCase().includes(q))
    .sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const futuras = matches.filter(a=>a.date>=t);
  const passadas = matches.filter(a=>a.date<t);
  if(matches.length===0) return empty(`Nenhum agendamento encontrado para "${esc(AGENDA_SEARCH.trim())}".`);
  const rowHTML = a=>{
    const prof = a.profissionalId ? profById(a.profissionalId) : null;
    return `<div class="row">
      <div style="text-align:center;min-width:74px">
        <b style="color:var(--teal-800);display:block;font-size:13px">${fmtDate(a.date)}</b>
        <span class="meta" style="font-variant-numeric:tabular-nums">${a.time}${a.duracaoMinutos?` · ${a.duracaoMinutos}min`:""}</span>
      </div>
      <div class="grow">
        <div style="font-weight:500;font-size:14px">${esc(pName(a.patientId))}</div>
        <div class="meta">${esc(a.procedure)}${prof?` · <span style="color:${prof.cor}">● ${esc(prof.nome)}</span>`:""}</div>
      </div>
      ${pill(a.status)}
      <button class="btn ghost sm" onclick="AGENDA_SEARCH='';AGENDA_DAY='${a.date}';AGENDA_VIEW='dia';render()">Ver dia</button>
      <button class="icon-btn" onclick="openApptForm('${a.id}')" aria-label="Editar">${IC.pencil}</button>
      <button class="icon-btn del" onclick="delAppt('${a.id}')" aria-label="Excluir">${IC.trash}</button>
    </div>`;
  };
  return `
  ${futuras.length?`<div class="card" style="padding:4px 16px;margin-bottom:12px"><h2 style="padding-top:12px">Próximas (${futuras.length})</h2>${futuras.slice().reverse().map(rowHTML).join("")}</div>`:""}
  ${passadas.length?`<div class="card" style="padding:4px 16px"><h2 style="padding-top:12px">Anteriores (${passadas.length})</h2>${passadas.map(rowHTML).join("")}</div>`:""}`;
}

        ${prof?`<br><span style="color:${prof.cor}">● ${esc(prof.nome)}</span>`:""}

      ${pill(a.status)}
      <select style="width:auto;font-size:12px;padding:6px 8px" onchange="setApptStatus('${a.id}',this.value)">
        ${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?"selected":""}>${v}</option>`).join("")}
      </select>
      <button class="icon-btn" onclick="openApptForm('${a.id}')" aria-label="Editar">${IC.pencil}</button>
      <button class="icon-btn del" onclick="delAppt('${a.id}')">${IC.trash}</button>
    </div>`;
  }).join("")+`</div>`}`;
}

function startOfWeek(iso){
  const d = new Date(iso+"T00:00:00");
  const dow = d.getDay(); // 0=domingo
  d.setDate(d.getDate()-dow);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ── AGENDA SEMANAL EM GRADE (timeline com arrastar-e-soltar) ──
   Grade de horários estilo agenda profissional: eixo de horas na vertical,
   7 colunas de dias, cada consulta é um bloco posicionado e dimensionado
   pela duração. Arrastar um bloco muda dia/horário (PUT na API — a
   validação de conflito do backend continua valendo e desfaz o arrasto
   com aviso). Clicar num espaço vago abre "Nova consulta" já com data e
   hora preenchidas. Toque no celular: segurar ~¼s inicia o arrasto;
   toque rápido abre a consulta; deslizar normal rola a grade. */
const TG_HORA_INI = 7;   // grade começa às 07:00
const TG_HORA_FIM = 20;  // ...e termina às 20:00
const TG_PX_MIN = 0.9;   // altura de cada minuto em px (54px por hora)
const TG_SNAP = 15;      // arrasto e clique em slot arredondam pra 15 min
let TG_DRAG = null;         // estado do arrasto em andamento (null = nenhum)
let TG_SCROLL_TOP = null;   // preserva a rolagem da grade entre re-renders
let TG_NOW_TIMER = null;    // timer que move a linha do "agora" a cada minuto
let TG_SUPPRESS_CLICK = false; // suprime o click sintético que o navegador dispara após um arrasto

function tgMin(hhmm){ const p=(hhmm||"0:0").split(":"); return (parseInt(p[0])||0)*60+(parseInt(p[1])||0); }
function tgHHMM(min){ return String(Math.floor(min/60)).padStart(2,"0")+":"+String(min%60).padStart(2,"0"); }

function tgLayoutDia(appts){
  // Distribui consultas sobrepostas em colunas lado a lado dentro do dia.
  // Cada "cluster" de eventos que se tocam no tempo divide a largura por
  // igual; eventos sem sobreposição ocupam a largura toda.
  const evs = appts.map(a=>{
    const ini = tgMin(a.time);
    return { a, ini, fim: ini + (a.duracaoMinutos||60) };
  }).sort((x,y)=> x.ini-y.ini || y.fim-x.fim);
  const out = [];
  let cluster = [], colEnds = [];
  const flush = ()=>{
    const n = Math.max(1, colEnds.length);
    cluster.forEach(e=>{ e.ncols = n; });
    out.push(...cluster);
    cluster = []; colEnds = [];
  };
  for(const e of evs){
    if(cluster.length && colEnds.every(f=>f<=e.ini)) flush();
    let col = colEnds.findIndex(f=>f<=e.ini);
    if(col===-1){ col = colEnds.length; colEnds.push(e.fim); }
    else colEnds[col] = e.fim;
    e.col = col;
    cluster.push(e);
  }
  if(cluster.length) flush();
  return out;
}

function vAgendaSemana(){
  const start = startOfWeek(AGENDA_DAY);
  const days = Array.from({length:7},(_,i)=>addDays(start,i));
  const dowNames = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const t = todayISO();
  const iniMin = TG_HORA_INI*60, fimMin = TG_HORA_FIM*60;
  const colH = (fimMin-iniMin)*TG_PX_MIN;
  const cols = "44px repeat(7,minmax(96px,1fr))";
  const horas = [];
  for(let h=TG_HORA_INI; h<=TG_HORA_FIM; h++){
    horas.push(`<span class="tg-time-label" style="top:${(h*60-iniMin)*TG_PX_MIN}px">${String(h).padStart(2,"0")}h</span>`);
  }
  const linhas = [];
  for(let h=TG_HORA_INI+1; h<TG_HORA_FIM; h++){
    linhas.push(`<div class="tg-hora-linha" style="top:${(h*60-iniMin)*TG_PX_MIN}px"></div>`);
  }
  const linhasHTML = linhas.join("");
  const agora = new Date();
  const nowMin = agora.getHours()*60 + agora.getMinutes();
  const colsHTML = days.map((d,i)=>{
    const evs = tgLayoutDia(DB.appointments.filter(a=>a.date===d && a.status!=="cancelado"));
    const blocos = evs.map(e=>{
      const a = e.a;
      const prof = a.profissionalId ? profById(a.profissionalId) : null;
      const cor = prof ? prof.cor : "#64748b";
      const top = Math.max(0, (e.ini-iniMin)*TG_PX_MIN);
      const alt = Math.max(18, (Math.min(e.fim,fimMin)-iniMin)*TG_PX_MIN - top);
      const wPct = 100/e.ncols, lPct = e.col*wPct;
      const pac = pName(a.patientId);
      const extraCls = (a.status==="faltou"||a.status==="concluido") ? a.status+"-ev" : "";
      return `<div class="tg-ev ${extraCls}" data-id="${a.id}"
        style="top:${top}px;height:${alt}px;left:calc(${lPct}% + 2px);width:calc(${wPct}% - 4px);border-left-color:${cor};background:${prof?cor+"22":"#f1f5f9"}"
        onmousedown="tgDragStart(event,'${a.id}')" ontouchstart="tgDragStart(event,'${a.id}')"
        title="${esc(pac)} · ${a.time} (${a.duracaoMinutos||60}min) · ${esc(a.procedure||"")}${prof?" · "+esc(prof.nome):""} — ${STATUS[a.status]||a.status}">
        <b>${a.time}–${tgHHMM(tgMin(a.time)+(a.duracaoMinutos||60))}</b>${esc(pac.split(" ")[0])}${prof?`<span style="display:block;font-size:9.5px;color:${cor}">${esc(prof.nome.split(" ")[0])}</span>`:""}
      </div>`;
    }).join("");
    const shade = `<div class="tg-shade" style="top:${(12*60-iniMin)*TG_PX_MIN}px;height:${60*TG_PX_MIN}px"></div>`;
    const nowLine = (d===t && nowMin>=iniMin && nowMin<=fimMin)
      ? `<div class="tg-now" id="tg-now-line" style="top:${(nowMin-iniMin)*TG_PX_MIN}px"></div>` : "";
    return `<div class="tg-col ${i===0?"dom":""}" data-date="${d}" style="height:${colH}px" onclick="tgSlotClick(event,'${d}')">${linhasHTML}${shade}${blocos}${nowLine}</div>`;
  }).join("");
  const headHTML = days.map((d,i)=>{
    return `<div class="tg-hcell ${d===t?"today":""}" onclick="AGENDA_DAY='${d}';AGENDA_VIEW='dia';render()" title="Abrir o dia ${fmtDate(d)}">
      <div class="dow">${dowNames[i]}</div><div class="dnum">${d.slice(8)}</div>
    </div>`;
  }).join("");
  return `<div class="daynav" style="flex-wrap:wrap">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="TG_SCROLL_TOP=null;AGENDA_DAY=addDays(AGENDA_DAY,-7);render()">${IC.left}</button>
    <span style="font-size:13px;font-weight:600;color:#334155">${fmtDate(days[0])} – ${fmtDate(days[6])}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="TG_SCROLL_TOP=null;AGENDA_DAY=addDays(AGENDA_DAY,7);render()">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="TG_SCROLL_TOP=null;AGENDA_DAY=todayISO();render()">Hoje</button>
    <span class="meta" style="margin-left:auto">Arraste uma consulta pra mudar dia/horário · clique num espaço vago pra agendar</span>
  </div>
  <div class="tg-wrap"><div class="tg-scroll" id="tg-scroll" onscroll="TG_SCROLL_TOP=this.scrollTop">
    <div class="tg-head" style="grid-template-columns:${cols}"><div class="tg-corner"></div>${headHTML}</div>
    <div class="tg-body" style="grid-template-columns:${cols}">
      <div class="tg-times" style="position:sticky;height:${colH}px">${horas.join("")}</div>
      ${colsHTML}
    </div>
  </div></div>`;
}

function tgAposRender(){
  const sc = document.getElementById("tg-scroll");
  if(sc){
    if(TG_SCROLL_TOP !== null){
      sc.scrollTop = TG_SCROLL_TOP;
    } else {
      const d = new Date();
      const alvo = (d.getHours()*60 + d.getMinutes() - TG_HORA_INI*60 - 60)*TG_PX_MIN;
      sc.scrollTop = Math.max(0, alvo);
      TG_SCROLL_TOP = sc.scrollTop;
    }
  }
  if(!TG_NOW_TIMER){
    TG_NOW_TIMER = setInterval(()=>{
      const line = document.getElementById("tg-now-line");
      if(!line) return;
      const d = new Date();
      line.style.top = ((d.getHours()*60 + d.getMinutes() - TG_HORA_INI*60)*TG_PX_MIN)+"px";
    }, 60000);
  }
}

function tgSlotClick(ev, dateISO){
  if(TG_SUPPRESS_CLICK) return;
  if(ev.target.closest(".tg-ev")) return;
  if(DB.patients.length===0){ toast("Cadastre um paciente antes de criar consultas."); return; }
  const r = ev.currentTarget.getBoundingClientRect();
  const y = ev.clientY - r.top;
  let min = TG_HORA_INI*60 + Math.round((y/TG_PX_MIN)/TG_SNAP)*TG_SNAP;
  min = Math.max(TG_HORA_INI*60, Math.min(TG_HORA_FIM*60 - TG_SNAP, min));
  openApptForm(null, null, dateISO, tgHHMM(min));
}

function tgPoint(e){
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  return { x: t.clientX, y: t.clientY };
}
function tgDragStart(ev, id){
  if(ev.type==="mousedown" && ev.button!==0) return;
  if(TG_DRAG) return;
  const a = DB.appointments.find(x=>x.id===id); if(!a) return;
  const el = ev.currentTarget;
  const p = tgPoint(ev);
  TG_DRAG = {
    id, a, el,
    startX: p.x, startY: p.y,
    grabOff: p.y - el.getBoundingClientRect().top,
    moved: false,
    ativo: ev.type==="mousedown", // no toque, só ativa depois do "segurar"
    holdTimer: null,
    colsEls: Array.from(document.querySelectorAll(".tg-col")),
    dur: a.duracaoMinutos||60,
    novoDate: a.date, novoIni: tgMin(a.time),
    hint: null,
  };
  if(ev.type==="touchstart"){
    TG_DRAG.holdTimer = setTimeout(()=>{ if(TG_DRAG){ TG_DRAG.ativo = true; TG_DRAG.el.classList.add("dragging"); } }, 260);
  } else {
    ev.preventDefault(); // evita seleção de texto ao arrastar com o mouse
  }
  document.addEventListener("mousemove", tgDragMove);
  document.addEventListener("mouseup", tgDragEnd);
  document.addEventListener("touchmove", tgDragMove, {passive:false});
  document.addEventListener("touchend", tgDragEnd);
  document.addEventListener("touchcancel", tgDragEnd);
}
function _tgLimparListeners(){
  document.removeEventListener("mousemove", tgDragMove);
  document.removeEventListener("mouseup", tgDragEnd);
  document.removeEventListener("touchmove", tgDragMove);
  document.removeEventListener("touchend", tgDragEnd);
  document.removeEventListener("touchcancel", tgDragEnd);
}
function tgDragMove(ev){
  const d = TG_DRAG; if(!d) return;
  const p = tgPoint(ev);
  const dx = p.x - d.startX, dy = p.y - d.startY;
  if(!d.ativo){
    // toque ainda no período de "segurar": se o dedo andou, é rolagem — cancela o arrasto
    if(Math.abs(dx) > 8 || Math.abs(dy) > 8){
      clearTimeout(d.holdTimer);
      _tgLimparListeners();
      TG_DRAG = null;
    }
    return;
  }
  ev.preventDefault();
  if(!d.moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)){
    d.moved = true;
    d.el.classList.add("dragging");
    d.el.style.left = "2px";
    d.el.style.width = "calc(100% - 4px)";
    if(!d.hint){
      d.hint = document.createElement("div");
      d.hint.className = "tg-drag-hint";
      document.body.appendChild(d.hint);
    }
  }
  if(!d.moved) return;
  // coluna (dia) sob o ponteiro; fora da grade, mantém a coluna atual
  let alvo = null;
  for(const c of d.colsEls){
    const r = c.getBoundingClientRect();
    if(p.x >= r.left && p.x <= r.right){ alvo = {c, r}; break; }
  }
  if(!alvo){
    const c = d.el.parentElement;
    alvo = {c, r: c.getBoundingClientRect()};
  }
  const iniMin = TG_HORA_INI*60;
  let novo = iniMin + Math.round(((p.y - alvo.r.top - d.grabOff)/TG_PX_MIN)/TG_SNAP)*TG_SNAP;
  novo = Math.max(iniMin, Math.min(TG_HORA_FIM*60 - d.dur, novo));
  d.novoIni = novo;
  d.novoDate = alvo.c.dataset.date || d.novoDate;
  if(d.el.parentElement !== alvo.c) alvo.c.appendChild(d.el);
  d.el.style.top = ((novo-iniMin)*TG_PX_MIN)+"px";
  if(d.hint){
    d.hint.style.left = (p.x + 14)+"px";
    d.hint.style.top = (p.y - 32)+"px";
    d.hint.textContent = `${fmtDate(d.novoDate)} · ${tgHHMM(novo)}–${tgHHMM(novo + d.dur)}`;
  }
}
async function tgDragEnd(){
  const d = TG_DRAG;
  TG_DRAG = null;
  if(!d) return;
  clearTimeout(d.holdTimer);
  _tgLimparListeners();
  if(d.hint) d.hint.remove();
  d.el.classList.remove("dragging");
  TG_SUPPRESS_CLICK = true;
  setTimeout(()=>{ TG_SUPPRESS_CLICK = false; }, 80);
  if(!d.moved){
    // clique/toque simples (sem arrastar): abre a consulta pra edição
    openApptForm(d.id);
    return;
  }
  const novoTime = tgHHMM(d.novoIni);
  if(d.novoDate === d.a.date && novoTime === d.a.time){ render(); return; }
  try{
    await api("PUT", `/appointments/${d.id}`, {...d.a, date: d.novoDate, time: novoTime});
    toast(`Consulta de ${pName(d.a.patientId).split(" ")[0]} movida pra ${fmtDate(d.novoDate)} às ${novoTime}. 📅`);
  }catch(e){ /* toast do api() já avisou (ex: conflito de horário do backend) — o reload abaixo desfaz o arrasto */ }
  await reloadAll();
}

function vAgendaMes(){
  const [y,m] = AGENDA_DAY.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m, 0).getDate();

  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null);
  for(let day=1;day<=daysInMonth;day++) cells.push(day);
  function shiftMonth(delta){
    const d = new Date(y, m-1+delta, 1);
    AGENDA_DAY = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
    render();

    <span style="font-size:14px;font-weight:700;color:#334155">${monthNames[m-1]} ${y}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_shiftMonth(1)">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="AGENDA_DAY=todayISO();render()">Hoje</button>
  </div>
  <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px">

  <div class="grid" style="grid-template-columns:repeat(7,1fr);gap:4px">

      if(!day) return `<div></div>`;

      const count = DB.appointments.filter(a=>a.date===iso && a.status!=="cancelado").length;
      const isToday = iso===t;
      return `<button onclick="AGENDA_DAY='${iso}';AGENDA_VIEW='dia';render()" class="card" style="padding:8px 4px;min-height:54px;text-align:center;cursor:pointer;${isToday?"border-color:var(--teal-700);border-width:2px":""}">
        <div style="font-size:12px;font-weight:${isToday?"700":"500"};color:${isToday?"var(--teal-700)":"var(--ink)"}">${day}</div>
        ${count>0?`<div style="margin-top:3px;font-size:10px;background:var(--teal-100);color:var(--teal-800);border-radius:99px;padding:1px 6px;display:inline-block">${count}</div>`:""}
      </button>`;
    }).join("")}
  </div>`;
}

function vAgendaAno(){
  const y = parseInt(AGENDA_DAY.split("-")[0]);
  const monthNames = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const counts = Array.from({length:12},()=>0);
  DB.appointments.forEach(a=>{
    if(a.status==="cancelado") return;
    const [ay,am] = a.date.split("-").map(Number);
    if(ay===y) counts[am-1]++;
  });
  const max = Math.max(1,...counts);
  function heat(n){
    if(n===0) return "#f1f5f9";
    const pct = n/max;
    if(pct>.75) return "var(--teal-700)";
    if(pct>.5) return "#2dd4bf";
    if(pct>.25) return "#99f6e4";
    return "var(--teal-100)";
  }
  return `<div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="AGENDA_DAY='${y-1}-01-01';render()">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${y}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="AGENDA_DAY='${y+1}-01-01';render()">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="AGENDA_DAY=todayISO();render()">Hoje</button>
  </div>
  <div class="grid g3" style="gap:10px">
    ${monthNames.map((mn,i)=>{
      const c = counts[i];
      return `<button class="card" onclick="AGENDA_DAY='${y}-${String(i+1).padStart(2,"0")}-01';AGENDA_VIEW='mes';render()" style="text-align:left;background:${heat(c)};${c>max*0.5?"color:#fff":""}">
        <div style="font-weight:700;font-size:14px">${mn}</div>
        <div style="font-size:12px;opacity:.85">${c} consulta${c===1?"":"s"}</div>
      </button>`;
    }).join("")}
  </div>`;
}

async function setApptStatus(id,status){
  const a = DB.appointments.find(x=>x.id===id);
  await api("PUT",`/appointments/${id}`,{...a,status});
  if(status==="concluido"){
    const pac = pById(a.patientId);
    if(pac && (!pac.lastVisit || a.date>pac.lastVisit))
      await api("PUT",`/patients/${pac.id}`,{...pac,lastVisit:a.date});
  }
  await reloadAll();
}
async function delAppt(id){
  if(!confirm("Excluir esta consulta?")) return;
  await api("DELETE",`/appointments/${id}`);
  await reloadAll(); toast("Consulta excluída.");
}
function agendarPaciente(pid){
  const hoje = todayISO();
  const futuras = DB.appointments.filter(a=>a.patientId===pid && a.date>=hoje && (a.status==="agendado"||a.status==="confirmado"))
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if(futuras.length===0){ openApptForm(null, pid); return; }
  const p = pById(pid);
  modal("Já existe consulta marcada", `
    <p style="font-size:13.5px;margin-bottom:12px">${esc(p?.name||"Este paciente")} já tem ${futuras.length>1?`${futuras.length} consultas marcadas`:"consulta marcada"}:</p>
    <div style="margin-bottom:6px">
      ${futuras.map(a=>`<div class="row" style="padding:8px 0">
        <div class="grow"><b style="font-size:13.5px">${fmtDate(a.date)} às ${a.time}</b><div class="meta">${esc(a.procedure||"")}${a.profissionalNome?" · "+esc(a.profissionalNome):""}</div></div>
        <button class="btn ghost sm" onclick="closeModal();openApptForm('${a.id}')">Ver/editar</button>
      </div>`).join("")}
    </div>
    <div class="acts">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="closeModal();openApptForm(null,'${pid}')">Agendar mesmo assim</button>
    </div>`);
}
function openApptForm(id, patientId, presetDate, presetTime){
  const a = id ? DB.appointments.find(x=>x.id===id) : null;
  const preSelPid = a ? a.patientId : (patientId || null);
  const preSelPac = preSelPid ? pById(preSelPid) : null;
  const ps = DB.patients.slice().sort((x,y)=>x.name.localeCompare(y.name));
  const profs = DB.profissionais.filter(p=>p.ativo || (a && p.id===a.profissionalId));
  modal(a?"Editar consulta":"Nova consulta",`
    <label class="f"><span>Paciente</span><select id="a-pat" onchange="_apptFormPreencherProntuario()">${ps.map(p=>`<option value="${p.id}" ${preSelPid===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>
    <label class="f"><span>Dentista responsável</span><select id="a-prof"><option value="">— Sem preferência —</option>${profs.map(p=>`<option value="${p.id}" ${a&&a.profissionalId===p.id?"selected":""}>${esc(p.nome)}</option>`).join("")}</select></label>
    <div class="grid g2">
      <label class="f"><span>Data</span><input type="date" id="a-date" value="${a?a.date:(presetDate||AGENDA_DAY)}"></label>
      <label class="f"><span>Horário</span><input type="time" id="a-time" value="${a?a.time:(presetTime||"09:00")}"></label>
    </div>
    <div class="grid g2">

      <label class="f"><span>Procedimento</span><select id="a-proc">${PROCEDURES.map(p=>`<option ${a&&a.procedure===p?"selected":""}>${p}</option>`).join("")}</select></label>
    </div>
    <div class="grid g2">
      <label class="f"><span>N° Prontuário</span><input id="a-pron" value="${a?esc(a.numProntuario||""):esc((preSelPac&&preSelPac.numProntuario)||"")}" placeholder="Opcional"></label>
      <label class="f"><span>N° Orçamento</span><input id="a-orc" value="${a?esc(a.numOrcamento||""):""}" placeholder="Opcional"></label>
    </div>
    ${a?`<label class="f"><span>Status</span><select id="a-status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${a.status===k?"selected":""}>${v}</option>`).join("")}</select></label>`:""}
    <div class="acts" style="justify-content:space-between">
    ${a?`<button class="btn ghost" onclick="closeModal();openLancForm(null,'${a.id}')" style="color:var(--green);border-color:#a7f3d0">💰 Gerar cobrança</button>`:"<span></span>"}
    <div style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="saveAppt('${id||""}')">${a?"Salvar alterações":"Agendar"}</button></div></div>`);
}
function _apptFormPreencherProntuario(){
  // Ao trocar o paciente no formulário, atualiza o N° Prontuário sugerido —
  // só se o campo ainda não tiver sido preenchido manualmente diferente,
  // pra não sobrescrever algo que a pessoa já digitou.
  const sel = document.getElementById("a-pat");
  const campo = document.getElementById("a-pron");
  if(!sel || !campo) return;
  const pac = pById(sel.value);
  if(pac && pac.numProntuario) campo.value = pac.numProntuario;
}
async function saveAppt(id){
  const g=i=>document.getElementById(i).value;
  if(!g("a-date")||!g("a-time")){ toast("Informe data e horário."); return; }
  const payload = {
    patientId:g("a-pat"), profissionalId:g("a-prof")?parseInt(g("a-prof")):null,
    date:g("a-date"), time:g("a-time"), duracaoMinutos:parseInt(g("a-dur"))||60,
    procedure:g("a-proc"), numProntuario:g("a-pron"), numOrcamento:g("a-orc")
  };
  if(id){
    const a = DB.appointments.find(x=>x.id===id);
    const status = document.getElementById("a-status")?.value || a.status;
    await api("PUT",`/appointments/${id}`,{...payload, status, confirmSent:a.confirmSent});
    closeModal(); await reloadAll(); toast("Consulta atualizada.");
  } else {
    await api("POST","/appointments",{...payload, status:"agendado", confirmSent:false});
    AGENDA_DAY=g("a-date"); closeModal(); await reloadAll(); toast("Consulta agendada.");
  }
}

function _finShiftMes(delta){
  let [y,m] = FIN_MES.split("-").map(Number);
  m += delta;
  if(m===0){ m=12; y--; } else if(m===13){ m=1; y++; }
  FIN_MES = `${y}-${String(m).padStart(2,"0")}`;
  render();
}
function vFinanceiro(C){
  const t = C.t;
  const L = DB.lancamentos || [];
  const mesLabel = (()=>{ const [y,m]=FIN_MES.split("-").map(Number);
    return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m-1]+" "+y; })();
  // Resumo do mês selecionado
  const recebidoMes = L.filter(l=>l.pagoEm && l.pagoEm.slice(0,7)===FIN_MES).reduce((s,l)=>s+l.valor,0);
  const aReceberMes = L.filter(l=>!l.pagoEm && l.vencimento.slice(0,7)===FIN_MES).reduce((s,l)=>s+l.valor,0);
  const vencidos = L.filter(l=>!l.pagoEm && l.vencimento < t);
  const vencidoTotal = vencidos.reduce((s,l)=>s+l.valor,0);
  // Lista filtrada
  const q = FIN_SEARCH.trim().toLowerCase();
  let list = L.filter(l=>!q || (l.patientName||"").toLowerCase().includes(q) || (l.descricao||"").toLowerCase().includes(q));
  if(FIN_FILTRO==="abertos") list = list.filter(l=>!l.pagoEm);
  else if(FIN_FILTRO==="vencidos") list = list.filter(l=>!l.pagoEm && l.vencimento < t);
  else if(FIN_FILTRO==="pagos") list = list.filter(l=>l.pagoEm);
  list = list.slice().sort((a,b)=>{
    if(!a.pagoEm && !b.pagoEm) return a.vencimento.localeCompare(b.vencimento); // abertos: vence antes primeiro
    return (b.pagoEm||b.vencimento).localeCompare(a.pagoEm||a.vencimento);
  });
  const filtros = [["abertos","Em aberto"],["vencidos","Vencidos"],["pagos","Pagos"],["todos","Todos"]].map(([k,lab])=>
    `<button class="btn ${FIN_FILTRO===k?"":"ghost"} sm" onclick="FIN_FILTRO='${k}';render()">${lab}</button>`).join("");
  const rowHTML = l=>{
    const vencido = !l.pagoEm && l.vencimento < t;
    return `<div class="row">
      <div style="text-align:center;min-width:78px">
        <b style="display:block;font-size:13px;color:${l.pagoEm?"var(--green)":vencido?"var(--rose)":"var(--teal-800)"}">${fmtMoney(l.valor)}</b>
        <span class="meta">${l.pagoEm?"pago "+fmtDate(l.pagoEm):"vence "+fmtDate(l.vencimento)}</span>
      </div>
      <div class="grow">
        <div style="font-weight:500;font-size:14px">${esc(l.patientName)}</div>
        <div class="meta">${esc(l.descricao)||"Sem descrição"}${l.profissionalNome?` · ${esc(l.profissionalNome)}`:""}${l.numOrcamento?` · Orç: ${esc(l.numOrcamento)}`:""}${l.pagoEm&&l.formaPagamento?` · ${FORMAS_PGTO[l.formaPagamento]||esc(l.formaPagamento)}`:""}</div>
      </div>
      ${l.pagoEm?`<span class="pill p-concluido">Pago</span>`:vencido?`<span class="pill p-faltou">Vencido</span>`:`<span class="pill p-agendado">Em aberto</span>`}
      ${l.pagoEm
        ? `<button class="btn ghost sm" onclick="estornarLanc('${l.id}')">Estornar</button><button class="icon-btn" onclick="abrirReciboForm('${l.patientId}','${l.id}')" title="Emitir recibo">🧾</button>`
        : `<button class="btn sm" style="background:var(--green)" onclick="openReceberForm('${l.id}')">Receber</button>`}
      <button class="icon-btn" onclick="openLancForm('${l.id}')" aria-label="Editar">${IC.pencil}</button>
      <button class="icon-btn del" onclick="delLanc('${l.id}')" aria-label="Excluir">${IC.trash}</button>
    </div>`;
  };
  return `${header("Financeiro","Cobranças, parcelas e recebimentos.",`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" onclick="exportCsvFin()">${IC.upload} CSV</button><button class="btn" onclick="openLancForm()" ${DB.patients.length===0?"disabled":""}>${IC.plus} Novo lançamento</button></div>`)}
  <div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_finShiftMes(-1)">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${mesLabel}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_finShiftMes(1)">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="FIN_MES=todayISO().slice(0,7);render()">Mês atual</button>
  </div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="stat good"><b>${fmtMoney(recebidoMes)}</b><span>Recebido no mês</span></div>
    <div class="stat"><b>${fmtMoney(aReceberMes)}</b><span>A receber no mês</span></div>
    <button class="stat ${vencidos.length?"warn":""}" onclick="FIN_FILTRO='vencidos';render()" style="cursor:pointer"><b style="${vencidos.length?"color:var(--rose)":""}">${fmtMoney(vencidoTotal)}</b><span>Vencido (${vencidos.length})</span></button>
  </div>
  <div class="searchbar">${IC.search}<input id="fin-search" value="${esc(FIN_SEARCH)}" oninput="FIN_SEARCH=this.value;renderKeepFocusFin(this)" placeholder="Buscar por paciente ou descrição…"></div>
  <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">${filtros}</div>
  ${list.length===0?empty(L.length===0?"Nenhum lançamento ainda. Crie o primeiro!":"Nenhum lançamento neste filtro."):
  `<div class="card" style="padding:4px 16px">`+list.map(rowHTML).join("")+`</div>`}`;
}
function renderKeepFocusFin(el){ const pos=el.selectionStart; render(); const n=document.getElementById("fin-search"); if(n){n.focus();n.setSelectionRange(pos,pos);} }

function exportCsvFin(){
  const t = todayISO();
  const q = FIN_SEARCH.trim().toLowerCase();
  let list = (DB.lancamentos||[]).filter(l=>!q || (l.patientName||"").toLowerCase().includes(q) || (l.descricao||"").toLowerCase().includes(q));
  if(FIN_FILTRO==="abertos") list = list.filter(l=>!l.pagoEm);
  else if(FIN_FILTRO==="vencidos") list = list.filter(l=>!l.pagoEm && l.vencimento < t);
  else if(FIN_FILTRO==="pagos") list = list.filter(l=>l.pagoEm);
  if(list.length===0){ toast("Nada para exportar neste filtro."); return; }
  const cel = v => `"${String(v??"").replace(/"/g,'""')}"`;
  const linhas = [
    ["Vencimento","Pago em","Paciente","Descrição","Dentista","Valor (R$)","Forma de pagamento","Status","Nº Orçamento","Observações"].join(";"),
    ...list.map(l=>[
      cel(fmtDate(l.vencimento)), cel(l.pagoEm?fmtDate(l.pagoEm):""),
      cel(l.patientName), cel(l.descricao), cel(l.profissionalNome||""),
      cel((l.valor/100).toFixed(2).replace(".",",")),
      cel(l.pagoEm?(FORMAS_PGTO[l.formaPagamento]||l.formaPagamento):""),
      cel(l.pagoEm?"Pago":(l.vencimento<t?"Vencido":"Em aberto")),
      cel(l.numOrcamento||""), cel(l.observacoes||""),
    ].join(";"))
  ];
  const blob = new Blob(["\ufeff"+linhas.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `financeiro-${FIN_FILTRO}-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`${list.length} lançamentos exportados.`);
}

async function saveLanc(id, apptId){
  const g=i=>document.getElementById(i)?.value;
  const valor = parseMoney(g("l-valor"));
  if(!g("l-desc").trim()){ toast("Informe a descrição."); return; }
  if(valor<=0){ toast("Informe um valor válido."); return; }
  if(!g("l-venc")){ toast("Informe o vencimento."); return; }
  const payload = {
    patientId:g("l-pat"), profissionalId:g("l-prof")?parseInt(g("l-prof")):null,
    appointmentId: apptId||null,
    descricao:g("l-desc").trim(), valor, vencimento:g("l-venc"),
    numOrcamento:g("l-orc")||"", observacoes:g("l-obs")||"",
  };
  if(id){
    const l = DB.lancamentos.find(x=>x.id===id);
    await api("PUT",`/financeiro/${id}`,{...payload, appointmentId:l.appointmentId, pagoEm:l.pagoEm, formaPagamento:l.formaPagamento});
    closeModal(); await reloadAll(); toast("Lançamento atualizado.");
  } else {
    const parcelas = parseInt(g("l-parc"))||1;
    await api("POST","/financeiro",{...payload, pagoEm:null, formaPagamento:"", parcelas});
    closeModal(); if(TAB!=="financeiro") go("financeiro"); else await reloadAll();
    toast(parcelas>1?`${parcelas} parcelas criadas.`:"Lançamento criado.");
  }
}
function openReceberForm(id){
  const l = DB.lancamentos.find(x=>x.id===id); if(!l) return;
  modal("Receber pagamento",`
    <p style="font-size:14px;margin-bottom:14px"><b>${esc(l.patientName)}</b> · ${esc(l.descricao)} · <b style="color:var(--teal-800)">${fmtMoney(l.valor)}</b></p>
    <div class="grid g2">
      <label class="f"><span>Forma de pagamento</span><select id="r-forma">${Object.entries(FORMAS_PGTO).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
      <label class="f"><span>Data do recebimento</span><input type="date" id="r-data" value="${todayISO()}"></label>
    </div>
    <label class="f" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="r-parcial" style="width:auto" onchange="document.getElementById('r-parcial-box').style.display=this.checked?'block':'none'">
      <span style="margin:0">Recebimento parcial</span>
    </label>
    <div id="r-parcial-box" style="display:none">
      <div class="grid g2">
        <label class="f"><span>Valor recebido agora (R$)</span><input id="r-valor" inputmode="decimal" placeholder="${(l.valor/100).toFixed(2).replace(".",",")}"></label>
        <label class="f"><span>Novo vencimento do restante</span><input type="date" id="r-restante-venc" value="${todayISO()}"></label>
      </div>
      <p class="meta" id="r-restante-preview">O valor restante vira um novo lançamento em aberto.</p>
    </div>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" style="background:var(--green)" onclick="receberLanc('${id}')">Confirmar recebimento</button></div>`);
  document.getElementById("r-valor")?.addEventListener("input", ()=>{
    const rec = parseMoney(document.getElementById("r-valor").value);
    const rest = l.valor - rec;
    document.getElementById("r-restante-preview").textContent =
      rest>0 ? `Restam ${fmtMoney(rest)} como novo lançamento em aberto.` : "Informe um valor menor que o total da parcela.";
  });
}
async function receberLanc(id){
  const l = DB.lancamentos.find(x=>x.id===id);
  const g=i=>document.getElementById(i).value;
  const payload = { formaPagamento:g("r-forma"), pagoEm:g("r-data")||null };
  const parcial = document.getElementById("r-parcial").checked;
  if(parcial){
    const valorRecebido = parseMoney(g("r-valor"));
    if(valorRecebido<=0 || valorRecebido>=l.valor){ toast("Informe um valor parcial menor que o total da parcela."); return; }
    if(!g("r-restante-venc")){ toast("Informe o vencimento do valor restante."); return; }
    payload.valorRecebido = valorRecebido;
    payload.restanteVencimento = g("r-restante-venc");
  }
  await api("PUT",`/financeiro/${id}/receber`,payload);
  closeModal(); await reloadAll();
  toast(parcial ? "Pagamento parcial registrado — restante em aberto. 💰" : "Recebimento registrado. 💰");
}
async function estornarLanc(id){
  if(!confirm("Estornar este recebimento? O lançamento voltará para 'em aberto'.")) return;
  await api("PUT",`/financeiro/${id}/estornar`);
  await reloadAll(); toast("Recebimento estornado.");
}
async function delLanc(id){
  if(!confirm("Excluir este lançamento?")) return;
  await api("DELETE",`/financeiro/${id}`);
  await reloadAll(); toast("Lançamento excluído.");
}

function vOrcamentos(){
  const O = DB.orcamentos || [];
  const aprovados = O.filter(o=>o.status==="aprovado").length;
  const recusados = O.filter(o=>o.status==="recusado").length;
  const apresentados = O.filter(o=>o.status==="apresentado").length;
  const decididos = aprovados + recusados;
  const taxa = decididos ? Math.round(aprovados/decididos*100) : null;
  const filtros = [["todos","Todos"],["rascunho","Rascunhos"],["apresentado","Apresentados"],["aprovado","Aprovados"],["recusado","Recusados"]].map(([k,lab])=>
    `<button class="btn ${ORC_FILTRO===k?"":"ghost"} sm" onclick="ORC_FILTRO='${k}';render()">${lab}</button>`).join("");
  let list = ORC_FILTRO==="todos" ? O : O.filter(o=>o.status===ORC_FILTRO);
  list = list.slice().sort((a,b)=>b.data.localeCompare(a.data));
  const rowHTML = o=>{
    let acoes = "";
    if(o.status==="rascunho") acoes = `<button class="btn ghost sm" onclick="setOrcStatus('${o.id}','apresentado')">Apresentar →</button>`;
    else if(o.status==="apresentado") acoes = `<button class="btn sm" style="background:var(--green)" onclick="abrirAprovacaoOrcamento('${o.id}')">Aprovar ✓</button>
      <button class="btn ghost sm" style="color:var(--rose)" onclick="setOrcStatus('${o.id}','recusado')">Recusar</button>`;
    else if(o.status==="aprovado") acoes = (o.cobrancasGeradas
      ? `<button class="btn ghost sm" onclick="go('financeiro')">💰 No financeiro ✓</button>`
      : `<button class="btn sm" style="background:var(--green)" onclick="openGerarCobrancas('${o.id}')">💰 Gerar cobranças</button>`)
      + ` <button class="btn ghost sm" onclick="verConsentimentoOrcamento('${o.id}')">✍️ Consentimento</button>`;
    else if(o.status==="recusado") acoes = `<button class="btn ghost sm" onclick="setOrcStatus('${o.id}','apresentado')">Reapresentar</button>`;
    return `<div class="row">
      <div style="text-align:center;min-width:78px">
        <b style="display:block;font-size:13px;color:var(--teal-800)">${fmtMoney(o.total)}</b>
        <span class="meta">${fmtDate(o.data)}</span>

        <div style="font-weight:500;font-size:14px">${esc(o.patientName)}</div>

      </div>
      ${pillOrc(o.status)}
      ${acoes}
      <button class="icon-btn" onclick="imprimirOrcamento('${o.id}')" aria-label="Imprimir" title="Imprimir">${IC.print}</button>
      <button class="icon-btn" onclick="openOrcForm('${o.id}')" aria-label="Editar">${IC.pencil}</button>
      <button class="icon-btn del" onclick="delOrc('${o.id}')" aria-label="Excluir">${IC.trash}</button>
    </div>`;
  };
  return `${header("Orçamentos","Planos de tratamento: rascunho → apresentado → aprovado.",`<button class="btn" onclick="openOrcForm()" ${DB.patients.length===0?"disabled":""}>${IC.plus} Novo orçamento</button>`)}
  <div class="grid g3" style="margin-bottom:16px">
    <div class="stat ${apresentados?"warn":""}"><b>${apresentados}</b><span>Aguardando decisão</span></div>
    <div class="stat good"><b>${aprovados}</b><span>Aprovados</span></div>

  </div>

  ${list.length===0?empty(O.length===0?"Nenhum orçamento ainda. Crie o primeiro!":"Nenhum orçamento neste filtro."):
  `<div class="card" style="padding:4px 16px">`+list.map(rowHTML).join("")+`</div>`}`;
}

function _aprovInitCanvas(quem){
  // Cada canvas guarda seu próprio contexto/estado em propriedades ad-hoc no
  // próprio elemento — evita colidir com o SIGPAD_* global usado pela
  // assinatura avulsa, já que aqui precisamos de DOIS quadros ao mesmo tempo.
  const canvas = document.getElementById(`aprov-sig-${quem}`);
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*2; canvas.height = rect.height*2;
  const ctx = canvas.getContext("2d");
  ctx.scale(2,2);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1e293b";
  canvas._ctx = ctx; canvas._hasData = false;
  let drawing = false, last = null;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX)-r.left;
    const cy = (e.touches?e.touches[0].clientY:e.clientY)-r.top;
    return {x:cx,y:cy};
  };
  const start = (e) => { drawing=true; canvas._hasData=true; last=pos(e); e.preventDefault(); };
  const move = (e) => {
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  };
  const end = () => { drawing = false; };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
}
function _aprovLimpar(quem){
  const canvas = document.getElementById(`aprov-sig-${quem}`);
  if(!canvas || !canvas._ctx) return;
  canvas._ctx.clearRect(0,0,canvas.width,canvas.height);
  canvas._hasData = false;
}

function _categoriaDente(numero){
  // Último dígito = posição no quadrante (1..8 permanente, 1..5 decíduo).
  // Isso já diz o tipo de dente independente de qual quadrante é.
  const n = parseInt(numero, 10);
  const decidua = Math.floor(n/10) >= 5;
  const pos = n % 10;
  if(pos <= 2) return "incisivo";
  if(pos === 3) return "canino";
  if(decidua) return "molar"; // decíduo só tem incisivo/canino/molar (sem pré-molar)
  if(pos === 4 || pos === 5) return "premolar";
  return "molar";
}
function _contornoDenteSVG(categoria, arch, T, crownY0, crownH, raizY0, raizH){
  // Contorno único (coroa arredondada + raiz simples ou dupla), com curvas
  // suaves em vez de formas geométricas. crownY0/raizY0 já chegam
  // pré-posicionados pelo chamador conforme o arco (raiz antes da coroa no
  // superior, depois no inferior) — aqui só decidimos, sem espelhar de novo,
  // de que lado fica o "bojo" externo da coroa (lado oposto à raiz) e de
  // que lado fica a ponta da raiz, direto a partir do arco.
  const nRaizes = categoria === "molar" ? 2 : 1;
  const upper = arch === "upper";
  const shoulderY = upper ? crownY0 + crownH*0.85 : crownY0 + crownH*0.15;   // ombro do lado do bojo
  const waistY     = upper ? crownY0 + crownH*0.15 : crownY0 + crownH*0.85;  // ombro do lado da raiz
  const domeTop    = upper ? crownY0 + crownH + crownH*0.10 : crownY0 - crownH*0.10; // bojo externo
  const rootAttachY = upper ? raizY0 + raizH : raizY0;   // onde a raiz encosta na coroa
  const rootTipY     = upper ? raizY0 : raizY0 + raizH;   // ponta da raiz
  const notchY = rootAttachY + (rootTipY - rootAttachY)*0.65; // reentrância entre as raízes do molar
  const midR = (a,b) => a*0.65 + b*0.35; // ponto intermediário mais perto da ponta da raiz
  let d;
  if(nRaizes === 1){
    d = `M ${T*0.12},${shoulderY}
         Q ${T*0.5},${domeTop} ${T*0.88},${shoulderY}
         Q ${T*0.94},${waistY} ${T*0.64},${rootAttachY}
         Q ${T*0.60},${midR(rootTipY,rootAttachY)} ${T*0.5},${rootTipY}
         Q ${T*0.40},${midR(rootTipY,rootAttachY)} ${T*0.36},${rootAttachY}
         Q ${T*0.06},${waistY} ${T*0.12},${shoulderY} Z`;
  } else {
    d = `M ${T*0.10},${shoulderY}
         Q ${T*0.5},${domeTop} ${T*0.90},${shoulderY}
         Q ${T*0.96},${waistY} ${T*0.78},${rootAttachY}
         Q ${T*0.76},${midR(rootTipY,rootAttachY)} ${T*0.65},${rootTipY}
         Q ${T*0.60},${midR(rootTipY,rootAttachY)} ${T*0.58},${notchY}
         Q ${T*0.5},${rootAttachY+(notchY-rootAttachY)*0.6} ${T*0.42},${notchY}
         Q ${T*0.40},${midR(rootTipY,rootAttachY)} ${T*0.35},${rootTipY}
         Q ${T*0.24},${midR(rootTipY,rootAttachY)} ${T*0.22},${rootAttachY}
         Q ${T*0.04},${waistY} ${T*0.10},${shoulderY} Z`;
  }
  return `<path d="${d.replace(/\s+/g,' ')}" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>`;
}
function _implanteSVG(T, y0, h){
  // Parafuso sobre a área da raiz — rosca representada por linhas horizontais
  const x1 = T*0.4, x2 = T*0.6;
  let roscas = "";
  for(let i=1;i<4;i++){ const y = y0 + h*(i/4); roscas += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#0f766e" stroke-width="0.8"/>`; }
  return `<rect x="${x1}" y="${y0}" width="${x2-x1}" height="${h}" fill="#d1fae5" stroke="#0f766e" stroke-width="1"/>${roscas}`;
}
function _odontoToothSVG(numero, estadoDente, bloco, interactive){
  const T = 40, cell = T/3, LABEL_H = 12, ROOT_H = 15;
  const faces = (estadoDente && estadoDente.faces) || {};
  const denteStatus = estadoDente && estadoDente.dente;
  const topFace = bloco.arch === "upper" ? "vestibular" : "lingual";
  const bottomFace = bloco.arch === "upper" ? "lingual" : "vestibular";
  const leftFace = bloco.mesial === "right" ? "distal" : "mesial";
  const rightFace = bloco.mesial === "right" ? "mesial" : "distal";
  const categoria = _categoriaDente(numero);
  const upper = bloco.arch === "upper";
  // Raiz fica entre o número e a coroa no arco superior (rumo à gengiva, no
  // topo), e entre a coroa e o rodapé no arco inferior — mesma lógica
  // anatômica de sempre: a raiz aponta pra "fora" do arco.
  const crownY0 = upper ? LABEL_H+ROOT_H : LABEL_H;
  const raizY0 = upper ? LABEL_H : LABEL_H+T;
  const cellRect = (face, x, y) => {
    const st = faces[face];
    const cor = st ? FACE_COR[st] : "#fff";
    const click = interactive ? `onclick="onOdontoFaceClick('${numero}','${face}')" style="cursor:pointer"` : "";
    const sigla = st ? `<text x="${x+cell/2}" y="${y+cell/2+2.6}" font-size="7.5" font-weight="700" fill="#fff" text-anchor="middle" font-family="sans-serif" pointer-events="none">${FACE_STATUS_SIGLA[st]||""}</text>` : "";
    return `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="${cor}" stroke="#94a3b8" stroke-width="0.7" ${click}><title>${numero} - ${FACE_LABEL[face]}${st?" - "+STATUS_FACE_LABEL[st]:""}</title></rect>${sigla}`;
  };
  const totalH = LABEL_H + ROOT_H + T + 14;
  let svg = `<svg width="${T}" height="${totalH}" viewBox="0 0 ${T} ${totalH}">`;

  const ausente = denteStatus === "ausente";
  const implante = denteStatus === "implante";

  svg += `<g ${ausente?'opacity="0.32"':""}>`;
  svg += _contornoDenteSVG(categoria, bloco.arch, T, crownY0, T, raizY0, ROOT_H);
  if(implante) svg += _implanteSVG(T, raizY0, ROOT_H);
  svg += cellRect(topFace, cell, crownY0);
  svg += cellRect(leftFace, 0, cell+crownY0);
  svg += cellRect("oclusal", cell, cell+crownY0);
  svg += cellRect(rightFace, cell*2, cell+crownY0);
  svg += cellRect(bottomFace, cell, cell*2+crownY0);
  svg += `</g>`;
  if(ausente){
    // "Apagado" (opacidade reduzida acima) + X sobre o dente inteiro — raiz e coroa
    const topo = Math.min(raizY0, crownY0) + 2, base = Math.max(raizY0+ROOT_H, crownY0+T) - 2;
    svg += `<line x1="2" y1="${topo}" x2="${T-2}" y2="${base}" stroke="#64748b" stroke-width="2.2"/><line x1="${T-2}" y1="${topo}" x2="2" y2="${base}" stroke="#64748b" stroke-width="2.2"/>`;
  }
  if(denteStatus && DENTE_BADGE[denteStatus]){
    const b = DENTE_BADGE[denteStatus];
    const badgeY = LABEL_H + ROOT_H + T;
    svg += `<circle cx="${T/2}" cy="${badgeY+7}" r="7" fill="${b.cor}"/><text x="${T/2}" y="${badgeY+9.5}" font-size="7" fill="#fff" text-anchor="middle" font-family="sans-serif">${b.label}</text>`;
  }
  const numClick = interactive ? `onclick="onOdontoDenteClick('${numero}')" style="cursor:pointer"` : "";
  svg += `<text x="${T/2}" y="${LABEL_H-2}" font-size="10" font-weight="700" fill="#334155" text-anchor="middle" font-family="sans-serif" ${numClick}>${numero}</text>`;
  svg += `</svg>`;
  return svg;
}
function renderOdontograma(estado, interactive){
  const linha = (blocos) => `<div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:6px">` +
    blocos.map(bl => `<div style="display:flex;gap:2px">` + bl.dentes.map(n => _odontoToothSVG(String(n), estado[String(n)], bl, interactive)).join("") + `</div>`).join(`<div style="width:14px"></div>`) + `</div>`;
  const permanentes = `${linha([ODONTO_BLOCOS[0],ODONTO_BLOCOS[1]])}${linha([ODONTO_BLOCOS[2],ODONTO_BLOCOS[3]])}`;
  const decid = `${linha([ODONTO_BLOCOS_DECID[0],ODONTO_BLOCOS_DECID[1]])}${linha([ODONTO_BLOCOS_DECID[2],ODONTO_BLOCOS_DECID[3]])}`;
  return { permanentes, decid };
}
function odontoLegenda(){
  const itens = [...Object.entries(FACE_COR).map(([k,c])=>({cor:c,nome:`${STATUS_FACE_LABEL[k]} (${FACE_STATUS_SIGLA[k]})`})), ...Object.values(DENTE_BADGE).map(b=>({cor:b.cor,nome:`${b.nome} (${b.label})`}))];
  return `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">` +
    itens.map(i=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b"><span style="width:11px;height:11px;border-radius:3px;background:${i.cor};display:inline-block"></span>${i.nome}</span>`).join("") + `</div>`;
}

/* ════════════════════════════════════════════
   LEVANTAMENTOS FOTOGRÁFICOS — grades de posição fixa (periapical/facial)
   e fotos avulsas por elemento dentário. Tudo é Anexo por baixo dos panos
   (categoria "periapical" | "facial" | "elemento"); a grade só mostra o
   slot quando existe imagem enviada pra aquela posição — se reenviar pra
   uma posição já preenchida, o registro antigo não é apagado (mesmo
   princípio do odontograma: histórico preservado, só o mais recente é
   exibido).
════════════════════════════════════════════ */
function _latestPorChave(lista, categoria, chaveFn){
  const mapa = {};
  for(const a of lista){
    if(a.categoria !== categoria) continue;
    const k = chaveFn(a);
    if(!mapa[k] || a.created_at > mapa[k].created_at) mapa[k] = a;
  }
  return mapa;
}
function _renderGradeSlots(pid, posicoes, mapa, categoria){
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px">
    ${posicoes.map(p=>{
      const a = mapa[p.k];
      const thumb = a ? (ANEXO_THUMB_CACHE[a.id] ? `<img src="${ANEXO_THUMB_CACHE[a.id]}" style="width:100%;height:100%;object-fit:cover">` : `<span style="font-size:20px">${ICONE_ANEXO[categoria]}</span>`) : `<span style="font-size:24px;color:#cbd5e1">+</span>`;
      return `<div style="text-align:center">
        <div onclick="${a?`verAnexo('${a.id}')`:`clickSlotAnexo('${pid}','${categoria}','${p.k}')`}" style="aspect-ratio:1;border:1.5px dashed ${a?"var(--line)":"#94a3b8"};border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f8fafc">${thumb}</div>
        <div class="meta" style="font-size:10.5px;margin-top:3px;line-height:1.25">${p.label}</div>
        ${a?`<button class="icon-btn" style="transform:scale(.75)" onclick="clickSlotAnexo('${pid}','${categoria}','${p.k}')" aria-label="Substituir">${IC.pencil}</button>`:""}
      </div>`;
    }).join("")}
  </div>`;
}
function vPeriapicalSection(pid){
  const mapa = _latestPorChave(FICHA_ANEXOS, "periapical", a=>a.posicao);
  const preenchidas = Object.keys(mapa).length;

    <h2>🦷 Levantamento Radiográfico Periapical ${preenchidas?`(${preenchidas}/14)`:""}</h2>
    <p class="meta" style="margin-bottom:10px">Clique num quadro pra anexar a radiografia daquela posição.</p>

}
function vFacialSection(pid){

function clickSlotAnexo(pid, categoria, posicao){
  const input = document.createElement("input");

function abrirUploadElemento(pid){

  modal("Foto por elemento", `

function confirmarUploadElemento(pid){
  const dente = document.getElementById("el-dente").value;
  const face = document.getElementById("el-face").value || "dente";
  closeModal();
  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*";

async function uploadAnexoComMetadados(pid, input, categoria, extra){
  const file = input.files && input.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append("patientId", pid);
  fd.append("categoria", categoria);
  if(extra.posicao) fd.append("posicao", extra.posicao);
  if(extra.dente) fd.append("dente", extra.dente);
  if(extra.face) fd.append("face", extra.face);
  fd.append("file", file);
  try{
    const novo = await apiUpload("/anexos", fd);
    FICHA_ANEXOS = [novo, ...FICHA_ANEXOS];
    render();
    carregarThumbsAnexos();
    toast("Imagem salva.");
  }catch(e){ /* toast já exibido pelo api() */ }
}

        ${Object.entries(STATUS_FACE_LABEL).map(([k,v])=>`<option value="${k}" data-tipo="face">${v}</option>`).join("")}
      </optgroup>
      <optgroup label="Dente inteiro">

async function saveMarcaOdonto(dente, faceClicada){
  const g=i=>document.getElementById(i)?.value;
  const profissionalId = parseInt(g("of-prof"));
  const sel = document.getElementById("of-status");
  const status = sel.value;
  const tipo = sel.selectedOptions[0]?.dataset.tipo; // 'face' ou 'dente'
  // Status "de dente inteiro" sempre grava em face='dente', não importa onde clicou;
  // status "de face" grava na face clicada (ou 'oclusal' se a entrada foi pelo número).
  const face = tipo === "dente" ? "dente" : (faceClicada === "dente" ? "oclusal" : faceClicada);
  await api("POST","/odontograma",{patientId:FICHA_ID, profissionalId, dente, face, status, observacao:g("of-obs")||""});
  closeModal();
  await carregarOdontograma(FICHA_ID);
  toast("Odontograma atualizado. 🦷");
}

    api("GET", `/patients/${encodeURIComponent(pid)}/documentos`),
  ]);
  FICHA_EVOLUCOES = ev; FICHA_ANEXOS = ax; FICHA_RETORNO = ret.meses; FICHA_ANAMNESES = anam; FICHA_DOCUMENTOS = docs;
  if(TAB==="ficha" && FICHA_ID===pid) render(); // atualiza com os dados carregados
  carregarFotoFicha(pid);
  carregarOdontograma(pid);
  carregarThumbsAnexos();
  carregarAssinaturaPaciente(pid);
  carregarConsentimentos(pid);
  window.scrollTo(0,0);
}
async function carregarFotoFicha(pid){
  const el = document.getElementById("ficha-avatar");
  if(!el) return;
  try{
    const r = await api("GET", `/patients/${pid}/foto/url`);
    if(TAB==="ficha" && FICHA_ID===pid){
      const el2 = document.getElementById("ficha-avatar");
      if(el2) el2.innerHTML = `<img src="${r.url}" style="width:100%;height:100%;object-fit:cover" alt="Foto">`;
    }
  }catch(e){ /* sem foto ainda — mantém iniciais */ }
}
async function uploadFotoPaciente(input, pid){
  const f = input.files[0]; if(!f) return;
  input.value = "";
  if(f.size > 15*1024*1024){ toast("Imagem maior que 15 MB."); return; }
  toast("Enviando foto…");
  const fd = new FormData();
  fd.append("file", f);
  await apiUpload(`/patients/${pid}/foto`, fd);
  toast("Foto atualizada. 📷");
  carregarFotoFicha(pid);
}

async function gerarCarteirinhasLote(dataISO){

  const win = window.open("", "_blank");

    let fotoUrl = null;
    try{ const r = await api("GET", `/patients/${p.id}/foto/url`); fotoUrl = r.url; }catch(e){}
    const qrSvg = await _qrSvgDoPaciente(p.id);
    return _carteirinhaCardHTML(p, fotoUrl, qrSvg);

  if(!win){ toast("Permita pop-ups para gerar as carteirinhas."); return; }

async function imprimirOrcamento(oid){
  // A janela precisa abrir JÁ, no mesmo instante do clique — se esperar
  // qualquer await antes disso, o navegador não reconhece mais como "gesto
  // do usuário" e bloqueia o pop-up silenciosamente, sem erro nenhum. Esse
  // era o bug: 4 chamadas de rede em sequência empurravam o window.open
  // pra muito depois do clique.
  const win = window.open("", "_blank");
  if(win) win.document.write("<p style='font-family:sans-serif;padding:40px;color:#666'>Gerando orçamento…</p>");
  let o;
  try{ o = await api("GET", `/orcamentos/${oid}`); }catch(e){ if(win) win.close(); return; }
  let consent = null;
  if(o.status === "aprovado"){
    try{ consent = await api("GET", `/orcamentos/${oid}/consentimento`); }catch(e){}
  }
  let sigPacUrl = null, sigProfUrl = null;
  if(consent && consent.existe){
    try{ sigPacUrl = (await api("GET", `/consentimentos-orcamento/${consent.id}/assinatura-paciente/url`)).url; }catch(e){}
    try{ sigProfUrl = (await api("GET", `/consentimentos-orcamento/${consent.id}/assinatura-profissional/url`)).url; }catch(e){}
  }
  const corpo = `
