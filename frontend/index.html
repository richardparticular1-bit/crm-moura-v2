async function imprimirConsentimentoMidia(pid){
  const p = pById(pid); if(!p) return;
  const win = window.open("", "_blank");
  if(win) win.document.write("<p style='font-family:sans-serif;padding:40px;color:#666'>Gerando documento…</p>");
  let d;
  try{ d = await api("GET", `/consentimentos?patient_id=${encodeURIComponent(pid)}`); }catch(e){ if(win) win.close(); return; }
  const tipos = d.tipos || {};
  const est = d.estado || {};
  const hist = d.historico || [];
  let sigUrl = null;
  if(hist.length){
    try{ sigUrl = (await api("GET", `/consentimentos/${hist[0].id}/assinatura/url`)).url; }catch(e){}
  }
  const corpo = `
    <h1>Consentimento de Mídia e Divulgação</h1>
    <p style="font-size:13px;margin-bottom:14px"><b>Paciente:</b> ${esc(p.name)}</p>
    <table>
      <thead><tr><th>Autorização</th><th>Situação</th></tr></thead>
      <tbody>${Object.entries(tipos).map(([k,label])=>`<tr><td>${esc(label)}</td><td style="color:${est[k]==="autorizado"?"#166534":est[k]==="revogado"?"#b91c1c":"#666"}">${est[k]==="autorizado"?"Autorizado":est[k]==="revogado"?"Revogado":"Nunca definido"}</td></tr>`).join("")}</tbody>
    </table>
    ${sigUrl ? `<div class="doc-sig" style="margin-top:26px"><img src="${sigUrl}" style="max-height:70px;display:block;margin:0 auto 4px"><div class="line"></div>Assinatura/rubrica do paciente${hist[0]?" — "+fmtDateTime(hist[0].created_at):""}</div>` : ""}
    ${hist.length ? `<h2 style="margin-top:24px">Histórico completo</h2>
    <table><thead><tr><th>Autorização</th><th>Situação</th><th>Data</th><th>Colhido por</th></tr></thead>
    <tbody>${hist.map(h=>`<tr><td>${esc(tipos[h.tipo]||h.tipo)}</td><td>${h.status==="autorizado"?"Autorizado":"Revogado"}</td><td>${fmtDateTime(h.created_at)}</td><td>${esc(h.profissionalNome)}</td></tr>`).join("")}</tbody></table>` : ""}
  `;
  _abrirDocImpressao(win, `Consentimento - ${p.name}`, corpo);
}

async function imprimirProntuario(pid){
  const p = pById(pid); if(!p) return;
  const win = window.open("", "_blank");
  if(win) win.document.write("<p style='font-family:sans-serif;padding:40px;color:#666'>Gerando prontuário…</p>");
  let evolucoes;
  try{ evolucoes = await api("GET", `/evolucoes?patient_id=${encodeURIComponent(pid)}`); }catch(e){ if(win) win.close(); return; }
  const idade = p.birth ? Math.floor((new Date() - new Date(p.birth+"T00:00:00")) / 31557600000) : null;
  const corpo = `
    <h1>Prontuário Odontológico</h1>

    <p style="font-size:12px;color:#444;margin-bottom:14px">${p.birth?`Nascimento: ${fmtDate(p.birth)}${idade!==null?` (${idade} anos)`:""}`:""}${p.birth&&p.phone?" · ":""}${p.phone?`Telefone: ${esc(p.phone)}`:""}</p>
    ${evolucoes.length===0 ? `<p style="color:#888">Nenhuma evolução registrada.</p>` :

      <div style="margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #ddd">

}

async function saveEvolucao(){
  const g=i=>document.getElementById(i)?.value;
  if(!g("e-cont")?.trim()){ toast("Descreva a evolução."); return; }
  if(!g("e-prof")){ toast("Selecione o dentista responsável."); return; }
  if(!confirm("Registrar esta evolução? Após salvar, ela não poderá ser editada nem excluída.")) return;
  await api("POST","/evolucoes",{
    patientId: FICHA_ID,
    profissionalId: parseInt(g("e-prof")),
    denteRegiao: g("e-dente")||"",
    procedimento: g("e-proc")||"",
    conteudo: g("e-cont").trim(),
  });
  FICHA_EVOLUCOES = await api("GET", `/evolucoes?patient_id=${encodeURIComponent(FICHA_ID)}`);
  render(); toast("Evolução registrada. 📋");
}
async function uploadAnexo(input){
  const f = input.files[0]; if(!f) return;
  input.value = "";
  if(f.size > 15*1024*1024){ toast("Arquivo maior que 15 MB."); return; }
  const cat = document.getElementById("anexo-cat")?.value || "documento";
  toast("Enviando arquivo…");
  const fd = new FormData();
  fd.append("patientId", FICHA_ID);
  fd.append("categoria", cat);
  fd.append("file", f);
  const novo = await apiUpload("/anexos", fd);
  FICHA_ANEXOS = [novo, ...FICHA_ANEXOS];
  render();
  carregarThumbsAnexos();
  toast("Arquivo anexado. 📎");
}
async function verAnexo(id){
  const r = await api("GET", `/anexos/${id}/url`);
  window.open(r.url, "_blank");
}
async function carregarThumbsAnexos(){
  // Carrega a miniatura só das imagens (PDF e outros mantêm o ícone da categoria)
  // e só das que ainda não estão no cache — evita repetir a assinatura da URL
  // toda vez que a tela é re-renderizada.
  let carregouAlguma = false;
  for(const a of FICHA_ANEXOS){
    if(!a.mimeType || !a.mimeType.startsWith("image/")) continue;
    if(ANEXO_THUMB_CACHE[a.id]) continue;
    try{
      const r = await api("GET", `/anexos/${a.id}/url`);
      ANEXO_THUMB_CACHE[a.id] = r.url;
      carregouAlguma = true;
      const el = document.getElementById(`thumb-${a.id}`);
      if(el) el.innerHTML = `<img src="${r.url}" style="width:100%;height:100%;object-fit:cover">`;
    }catch(e){ /* sem preview — mantém o ícone da categoria */ }
  }
  // As grades de periapical/facial/elemento não têm um elemento próprio pra
  // atualizar em tempo real (ao contrário da lista simples de Anexos acima) —
  // um novo render() depois do cache preenchido é o jeito delas pegarem a
  // miniatura, já que _renderGradeSlots só lê do ANEXO_THUMB_CACHE na hora.
  if(carregouAlguma && TAB==="ficha") render();
}
function renomearAnexo(id){
  const a = FICHA_ANEXOS.find(x=>x.id===id);
  if(!a) return;
  modal("Renomear arquivo", `
    <label class="f"><span>Nome do arquivo *</span><input id="anexo-novo-nome" value="${esc(a.nome)}"></label>
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
    <button class="btn" onclick="confirmarRenomeioAnexo('${id}')">Salvar</button></div>`);
}
async function confirmarRenomeioAnexo(id){
  const novoNome = document.getElementById("anexo-novo-nome")?.value.trim();
  if(!novoNome){ toast("Informe um nome para o arquivo."); return; }
  const atualizado = await api("PUT", `/anexos/${id}`, {nome: novoNome});
  FICHA_ANEXOS = FICHA_ANEXOS.map(x=>x.id===id?atualizado:x);
  closeModal(); render();
  toast("Arquivo renomeado.");
}
async function delAnexo(id){
  const a = FICHA_ANEXOS.find(x=>x.id===id);
  const aviso = a && a.categoria==="consentimento"
    ? "ATENÇÃO: este é um TERMO DE CONSENTIMENTO — documento legal. Excluir mesmo assim?"
    : "Excluir este anexo permanentemente?";
  if(!confirm(aviso)) return;
  await api("DELETE", `/anexos/${id}`);
  FICHA_ANEXOS = FICHA_ANEXOS.filter(x=>x.id!==id);
  delete ANEXO_THUMB_CACHE[id];
  render(); toast("Anexo excluído.");
}

/* ════════════════════════════════════════════
   ASSINATURA DIGITAL (canvas — pacientes e profissionais)
════════════════════════════════════════════ */
const ASSINATURA_PACIENTE_CACHE = {};    // patientId -> URL assinada já carregada
const ASSINATURA_PROF_CACHE = {};        // profissionalId -> URL assinada já carregada
let SIGPAD_CTX = null, SIGPAD_HASDATA = false;

function abrirAssinaturaModal(tipo, id, nomeExibicao){
  // tipo: "paciente" | "profissional"
  modal(`Assinatura — ${esc(nomeExibicao)}`, `
    <div style="border:1px solid #cbd5e1;border-radius:8px;background:#fff">
      <canvas id="sig-canvas" width="440" height="180" style="width:100%;height:180px;display:block;cursor:crosshair;touch-action:none"></canvas>
    </div>
    <div class="meta" style="margin:6px 0">Assine com o dedo (touch) ou o mouse, dentro do quadro acima.</div>
    <div class="acts">
      <button class="btn ghost" onclick="limparAssinaturaCanvas()">Limpar</button>
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="salvarAssinaturaCanvas('${tipo}','${id}')">Salvar assinatura</button>
    </div>`);
  initAssinaturaCanvas();
}
function initAssinaturaCanvas(){
  const canvas = document.getElementById("sig-canvas");
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * 2; canvas.height = rect.height * 2; // resolução maior evita traço serrilhado
  const ctx = canvas.getContext("2d");
  ctx.scale(2, 2);
  ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1e293b";
  SIGPAD_CTX = ctx; SIGPAD_HASDATA = false;
  let drawing = false, last = null;
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return {x: cx, y: cy};
  };
  const start = (e) => { drawing = true; SIGPAD_HASDATA = true; last = pos(e); e.preventDefault(); };
  const move = (e) => {
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; e.preventDefault();
  };
  const end = () => { drawing = false; };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive: false});
  canvas.addEventListener("touchmove", move, {passive: false});
  canvas.addEventListener("touchend", end);
}
function limparAssinaturaCanvas(){
  const canvas = document.getElementById("sig-canvas");
  if(!canvas || !SIGPAD_CTX) return;
  SIGPAD_CTX.clearRect(0, 0, canvas.width, canvas.height);
  SIGPAD_HASDATA = false;
}
async function salvarAssinaturaCanvas(tipo, id){
  const canvas = document.getElementById("sig-canvas");
  if(!canvas || !SIGPAD_HASDATA){ toast("Desenhe a assinatura antes de salvar."); return; }
  const dataUrl = canvas.toDataURL("image/png");
  const endpoint = tipo === "paciente" ? `/patients/${id}/assinatura` : `/profissionais/${id}/assinatura`;
  await api("POST", endpoint, {dataUrl});
  closeModal();
  toast("Assinatura salva. ✍️");
  if(tipo === "paciente"){ delete ASSINATURA_PACIENTE_CACHE[id]; carregarAssinaturaPaciente(id); }
  else { delete ASSINATURA_PROF_CACHE[id]; carregarAssinaturaProfissional(id); }
}
async function carregarAssinaturaPaciente(pid){
  const box = document.getElementById("assinatura-paciente-box");
  if(!box) return;
  try{
    const r = await api("GET", `/patients/${pid}/assinatura/url`);
    ASSINATURA_PACIENTE_CACHE[pid] = r.url;
    if(FICHA_ID === pid){
      const box2 = document.getElementById("assinatura-paciente-box");
      if(box2) box2.innerHTML = `<img src="${r.url}" style="max-height:80px;object-fit:contain">`;
    }
  }catch(e){ /* sem assinatura ainda — mantém o placeholder */ }
}
async function carregarAssinaturaProfissional(id){
  try{
    const r = await api("GET", `/profissionais/${id}/assinatura/url`);
    ASSINATURA_PROF_CACHE[id] = r.url;
    const el = document.getElementById(`prof-sig-${id}`);
    if(el) el.innerHTML = `<img src="${r.url}" style="width:100%;height:100%;object-fit:contain;background:#fff">`;
  }catch(e){ /* sem assinatura ainda — mantém o ícone */ }
}

/* ════════════════════════════════════════════
   EDITOR DE IMAGEM DOS ANEXOS
   Sempre gera uma CÓPIA NOVA (origemId aponta pro original) — o arquivo
   original nunca é sobrescrito. Passo 1 (Ajustar: girar/cortar/brilho)
   "assa" essas mudanças num canvas de trabalho (ED.working); passo 2
   (Marcar: seta/círculo/texto) desenha por cima dele. As marcações ficam
   guardadas em coordenadas do PRÓPRIO working canvas — por isso o zoom no
   passo 2 é só uma transformação de visualização (pan/scale no render) e as
   marcações nunca saem do lugar, em qualquer nível de zoom.
════════════════════════════════════════════ */
let ED = null; // estado do editor; null = fechado

async function abrirEditorAnexo(anexoId){
  const original = FICHA_ANEXOS.find(a=>a.id===anexoId);
  if(!original) return;
  if(!original.mimeType || !original.mimeType.startsWith("image/")){ toast("Só é possível editar imagens."); return; }
  let url = ANEXO_THUMB_CACHE[anexoId];
  if(!url){
    try{ const r = await api("GET", `/anexos/${anexoId}/url`); url = r.url; }
    catch(e){ return; }
  }
  const img = new Image();
  img.crossOrigin = "anonymous"; // sem isso, o canvas fica "contaminado" ao desenhar essa imagem
  // (ela vem de outra origem — Supabase Storage) e toDataURL()/toBlob() falham
  // silenciosamente depois, quebrando rotação, recorte e "salvar cópia".
  img.onload = () => {
    ED = {
      origemId: anexoId, categoria: original.categoria,
      img, brilho: 100, crop: null, passo: 1,
      working: null, zoom: 1, panX: 0, panY: 0, tool: null, cor: "#ef4444",
      espessura: Math.max(2, Math.round(img.naturalWidth/250)),
      anot: [], desenhando: false, inicio: null, preview: null,
    };
    renderEditorModal();
  };
  img.onerror = () => toast("Não foi possível carregar a imagem.");
  img.src = url;
}
function fecharEditor(){ ED = null; closeModal(); }

function renderEditorModal(){
  if(!ED) return;
  if(ED.passo === 1){
    modal("Editar imagem — Ajustar", `
      <div style="max-width:520px">
        <div id="editor-crop-wrap" style="position:relative;max-width:100%;background:#111;border-radius:8px;overflow:hidden;touch-action:none;line-height:0">
          <img id="editor-img-preview" src="${ED.img.src}" style="display:block;width:100%;height:auto;filter:brightness(${ED.brilho}%)">
          <div id="editor-crop-rect" style="position:absolute;border:2px dashed #5EEAD4;background:rgba(94,234,212,.15);pointer-events:none;display:${ED.crop?"block":"none"};left:${ED.crop?ED.crop.x*100:0}%;top:${ED.crop?ED.crop.y*100:0}%;width:${ED.crop?ED.crop.w*100:0}%;height:${ED.crop?ED.crop.h*100:0}%"></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0">
          <button class="btn ghost sm" onclick="editorRotacionar()">↻ Girar 90°</button>
          <button class="btn ghost sm" onclick="editorLimparCorte()">Limpar corte</button>
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;flex-grow:1;min-width:140px">
            Brilho
            <input type="range" min="40" max="180" value="${ED.brilho}" oninput="editorBrilho(this.value)" style="flex-grow:1">
          </label>
        </div>
        <p class="meta" style="margin-bottom:10px">Arraste sobre a imagem pra recortar (opcional).</p>
        <div class="acts">
          <button class="btn ghost" onclick="fecharEditor()">Cancelar</button>
          <button class="btn" onclick="editorContinuarParaMarcacoes()">Continuar para marcações →</button>
        </div>
      </div>`);
    editorInitCropDrag();
  } else {
    modal("Editar imagem — Marcações", `
      <div style="max-width:560px">
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
          <button class="btn ${ED.tool===null?"":"ghost"} sm editor-tool-btn" data-tool="mover" onclick="editorSetTool(null)">✋ Mover</button>
          <button class="btn ${ED.tool==="livre"?"":"ghost"} sm editor-tool-btn" data-tool="livre" onclick="editorSetTool('livre')">✏️ Livre</button>
          <button class="btn ${ED.tool==="seta"?"":"ghost"} sm editor-tool-btn" data-tool="seta" onclick="editorSetTool('seta')">↗ Seta</button>
          <button class="btn ${ED.tool==="circulo"?"":"ghost"} sm editor-tool-btn" data-tool="circulo" onclick="editorSetTool('circulo')">◯ Círculo</button>
          <button class="btn ${ED.tool==="texto"?"":"ghost"} sm editor-tool-btn" data-tool="texto" onclick="editorSetTool('texto')">🔤 Texto</button>
          <input type="color" value="${ED.cor}" onchange="ED.cor=this.value" style="width:34px;height:34px;border:none;padding:0;border-radius:6px;cursor:pointer">
          <label style="display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mut)">
            Espessura
            <input type="range" min="1" max="${Math.max(24, Math.round(ED.working ? ED.working.width/40 : 24))}" value="${ED.espessura}" oninput="ED.espessura=+this.value" style="width:70px">
          </label>
          <button class="btn ghost sm" onclick="editorDesfazer()">↩ Desfazer</button>
          <button class="btn ghost sm" onclick="editorZoom(1.25)">🔍+</button>
          <button class="btn ghost sm" onclick="editorZoom(0.8)">🔍−</button>
        </div>
        <div id="editor-canvas-wrap" style="background:#111;border-radius:8px;overflow:hidden;touch-action:none;width:100%;height:360px;display:flex;align-items:center;justify-content:center">
          <canvas id="editor-canvas" style="cursor:crosshair"></canvas>
        </div>
        <p class="meta" style="margin:8px 0">Arraste no quadro pra desenhar. "Mover" navega com zoom (ou use a roda do mouse).</p>
        <div class="acts" style="flex-wrap:wrap">
          <button class="btn ghost" onclick="editorVoltarParaAjustar()">← Voltar</button>
          <label class="f" style="flex-grow:1;margin:0;min-width:160px"><span>Categoria da cópia</span>
            <select id="editor-categoria">${Object.entries(CATEGORIAS_ANEXO).map(([k,v])=>`<option value="${k}" ${k===ED.categoria?"selected":""}>${v}</option>`).join("")}</select>
          </label>
          <button class="btn" onclick="editorSalvarCopia()">Salvar cópia</button>
        </div>
      </div>`);
    editorInitCanvas();
  }
}

/* ── passo 1: ajustar ── */
function editorRotacionar(){
  const img = ED.img;
  const c = document.createElement("canvas");
  c.width = img.naturalHeight; c.height = img.naturalWidth; // gira 90°: largura e altura trocam
  const ctx = c.getContext("2d");
  ctx.translate(c.width/2, c.height/2);
  ctx.rotate(Math.PI/2);
  ctx.drawImage(img, -img.naturalWidth/2, -img.naturalHeight/2);
  const novo = new Image();
  novo.onload = () => { ED.img = novo; ED.crop = null; renderEditorModal(); };
  novo.src = c.toDataURL("image/png");
}
function editorBrilho(v){
  ED.brilho = +v;
  const el = document.getElementById("editor-img-preview");
  if(el) el.style.filter = `brightness(${ED.brilho}%)`;
}
function editorLimparCorte(){ ED.crop = null; renderEditorModal(); }
function editorInitCropDrag(){
  const wrap = document.getElementById("editor-crop-wrap");
  const rectEl = document.getElementById("editor-crop-rect");
  if(!wrap || !rectEl) return;
  let startX, startY, dragging = false;
  const getPct = (e) => {
    const r = wrap.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: Math.min(1, Math.max(0, cx / r.width)), y: Math.min(1, Math.max(0, cy / r.height)) };
  };
  const start = (e) => { const p = getPct(e); startX = p.x; startY = p.y; dragging = true; rectEl.style.display = "block"; e.preventDefault(); };
  const move = (e) => {
    if(!dragging) return;
    const p = getPct(e);
    const x = Math.min(startX, p.x), y = Math.min(startY, p.y);
    const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
    rectEl.style.left = (x*100)+"%"; rectEl.style.top = (y*100)+"%";
    rectEl.style.width = (w*100)+"%"; rectEl.style.height = (h*100)+"%";
    ED.crop = {x,y,w,h};
    e.preventDefault();
  };
  const end = () => { dragging = false; if(ED.crop && (ED.crop.w < 0.02 || ED.crop.h < 0.02)) { ED.crop = null; rectEl.style.display = "none"; } };
  wrap.addEventListener("mousedown", start);
  wrap.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  wrap.addEventListener("touchstart", start, {passive:false});
  wrap.addEventListener("touchmove", move, {passive:false});
  wrap.addEventListener("touchend", end);
}
function editorContinuarParaMarcacoes(){
  const img = ED.img;
  let sx=0, sy=0, sw=img.naturalWidth, sh=img.naturalHeight;
  if(ED.crop){
    sx = ED.crop.x*img.naturalWidth; sy = ED.crop.y*img.naturalHeight;
    sw = ED.crop.w*img.naturalWidth; sh = ED.crop.h*img.naturalHeight;
  }
  const working = document.createElement("canvas");
  working.width = Math.max(1, Math.round(sw)); working.height = Math.max(1, Math.round(sh));
  const ctx = working.getContext("2d");
  ctx.filter = `brightness(${ED.brilho}%)`;
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, working.width, working.height);
  ctx.filter = "none";
  ED.working = working;
  ED.passo = 2; ED.zoom = 1; ED.panX = 0; ED.panY = 0; ED.anot = [];
  renderEditorModal();
}
function editorVoltarParaAjustar(){
  if(ED.anot.length && !confirm("Voltar apaga as marcações feitas. Continuar?")) return;
  ED.anot = []; ED.working = null; ED.passo = 1;
  renderEditorModal();
}

/* ── passo 2: marcar (seta / círculo / texto) ── */
function editorSetTool(t){
  ED.tool = t;
  document.querySelectorAll(".editor-tool-btn").forEach(b=>{
    b.classList.toggle("ghost", b.dataset.tool !== (t===null?"mover":t));
  });
}
function editorDesfazer(){ ED.anot.pop(); editorRedesenhar(); }
function editorZoom(fator, foco){
  const canvas = document.getElementById("editor-canvas");
  if(!canvas) return;
  const cx = foco ? foco.x : canvas.width/2, cy = foco ? foco.y : canvas.height/2;
  const novoZoom = Math.min(8, Math.max(0.2, ED.zoom*fator));
  // mantém o ponto sob o cursor fixo na tela ao dar zoom, em vez de saltar
  ED.panX = cx - (cx-ED.panX)*(novoZoom/ED.zoom);
  ED.panY = cy - (cy-ED.panY)*(novoZoom/ED.zoom);
  ED.zoom = novoZoom;
  editorRedesenhar();
}
function editorInitCanvas(){
  const canvas = document.getElementById("editor-canvas");
  const wrap = document.getElementById("editor-canvas-wrap");
  if(!canvas || !wrap || !ED.working) return;
  const rect = wrap.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  const w = ED.working;
  const fit = Math.min(canvas.width/w.width, canvas.height/w.height, 1);
  ED.zoom = fit;
  ED.panX = (canvas.width - w.width*ED.zoom)/2;
  ED.panY = (canvas.height - w.height*ED.zoom)/2;
  editorRedesenhar();
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: (cx-ED.panX)/ED.zoom, y: (cy-ED.panY)/ED.zoom };
  };
  let lastScreen = null;
  const start = (e) => {
    if(ED.tool === null){
      lastScreen = { x: e.touches?e.touches[0].clientX:e.clientX, y: e.touches?e.touches[0].clientY:e.clientY };
      ED.desenhando = true; e.preventDefault(); return;
    }
    const p = pos(e);
    if(ED.tool === "texto"){
      const texto = prompt("Texto da marcação:");
      if(texto && texto.trim()){ ED.anot.push({tipo:"texto", x:p.x, y:p.y, texto:texto.trim(), cor:ED.cor, espessura:ED.espessura}); editorRedesenhar(); }
      return;
    }
    if(ED.tool === "livre"){
      ED.desenhando = true;
      ED.preview = { tipo:"livre", pontos:[p], cor:ED.cor, espessura:ED.espessura };
      e.preventDefault(); return;
    }
    ED.desenhando = true; ED.inicio = p; ED.preview = null; e.preventDefault();
  };
  const move = (e) => {
    if(!ED.desenhando) return;
    if(ED.tool === null){
      const cx = e.touches?e.touches[0].clientX:e.clientX, cy = e.touches?e.touches[0].clientY:e.clientY;
      ED.panX += cx-lastScreen.x; ED.panY += cy-lastScreen.y; lastScreen = {x:cx,y:cy};
      editorRedesenhar(); e.preventDefault(); return;
    }
    if(ED.tool === "texto") return;
    const p = pos(e);
    if(ED.tool === "livre"){
      ED.preview.pontos.push(p);
      editorRedesenhar(); e.preventDefault(); return;
    }
    ED.preview = { tipo: ED.tool, x: ED.inicio.x, y: ED.inicio.y, x2: p.x, y2: p.y, cor: ED.cor, espessura: ED.espessura };
    editorRedesenhar(); e.preventDefault();
  };
  const end = () => {
    if(ED.tool && ED.tool !== "texto" && ED.preview) ED.anot.push(ED.preview);
    ED.preview = null; ED.desenhando = false;
  };
  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", end);
  canvas.addEventListener("wheel", (e)=>{ e.preventDefault(); editorZoom(e.deltaY<0?1.1:0.9, {x:e.offsetX,y:e.offsetY}); }, {passive:false});
}
function editorRedesenhar(){
  const canvas = document.getElementById("editor-canvas");
  if(!canvas || !ED || !ED.working) return;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(ED.panX, ED.panY);
  ctx.scale(ED.zoom, ED.zoom);
  ctx.drawImage(ED.working, 0, 0);
  for(const a of ED.anot) editorDesenharAnotacao(ctx, a);
  if(ED.preview) editorDesenharAnotacao(ctx, ED.preview);
  ctx.restore();
}
function editorDesenharAnotacao(ctx, a){
  // Coordenadas de a.x/a.y (ou a.pontos) são sempre no espaço nativo do
  // working canvas — por isso essa função serve tanto pro redraw em tela
  // (dentro do translate/scale de zoom) quanto pra exportação final (sem
  // transform nenhum, 1:1), sem precisar de nenhuma conversão.
  const espessura = a.espessura || Math.max(2, ED.working.width/250);
  ctx.strokeStyle = a.cor; ctx.fillStyle = a.cor; ctx.lineWidth = espessura;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if(a.tipo === "livre"){
    if(!a.pontos || a.pontos.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(a.pontos[0].x, a.pontos[0].y);
    for(let i=1;i<a.pontos.length;i++) ctx.lineTo(a.pontos[i].x, a.pontos[i].y);
    ctx.stroke();
  } else if(a.tipo === "circulo"){
    const cx=(a.x+a.x2)/2, cy=(a.y+a.y2)/2, rx=Math.abs(a.x2-a.x)/2, ry=Math.abs(a.y2-a.y)/2;
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.stroke();
  } else if(a.tipo === "seta"){
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x2,a.y2); ctx.stroke();
    const ang = Math.atan2(a.y2-a.y, a.x2-a.x), head = espessura*4;
    ctx.beginPath();
    ctx.moveTo(a.x2,a.y2);
    ctx.lineTo(a.x2-head*Math.cos(ang-Math.PI/7), a.y2-head*Math.sin(ang-Math.PI/7));
    ctx.lineTo(a.x2-head*Math.cos(ang+Math.PI/7), a.y2-head*Math.sin(ang+Math.PI/7));
    ctx.closePath(); ctx.fill();
  } else if(a.tipo === "texto"){
    const tam = Math.max(14, ED.working.width/25);
    ctx.font = `700 ${tam}px sans-serif`;
    ctx.fillText(a.texto, a.x, a.y);
  }
}
async function editorSalvarCopia(){
  const categoria = document.getElementById("editor-categoria")?.value || ED.categoria;
  const canvas = document.createElement("canvas");
  canvas.width = ED.working.width; canvas.height = ED.working.height;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(ED.working, 0, 0);
  for(const a of ED.anot) editorDesenharAnotacao(ctx, a);
  const blob = await new Promise(res => canvas.toBlob(res, "image/png"));
  if(!blob){ toast("Não foi possível gerar a imagem."); return; }
  const fd = new FormData();
  fd.append("patientId", FICHA_ID);
  fd.append("categoria", categoria);
  fd.append("origemId", ED.origemId);
  fd.append("file", blob, "edicao.png");
  const novo = await apiUpload("/anexos", fd);
  FICHA_ANEXOS = [novo, ...FICHA_ANEXOS];
  fecharEditor();
  render();
  carregarThumbsAnexos();
  toast("Cópia editada salva. ✏️");
}

   ANAMNESE REMOTA — link/QR pro paciente preencher sozinho (estilo
   Codental). O que ele envia fica pendente até a equipe revisar; só aí
   os dados entram no cadastro e a queixa principal vira uma evolução.
════════════════════════════════════════════ */
async function abrirCompartilharAnamnese(pid, nome, phone){
  let modelos;
  try{ modelos = await api("GET", "/anamnese-modelos"); }catch(e){ return; }
  if(!modelos || modelos.length===0){ toast("Nenhum modelo de anamnese disponível."); return; }
  modal("Preencher anamnese", `
    <label class="f"><span>Modelo</span>
      <select id="cba-modelo">${modelos.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join("")}</select>
    </label>
    <div id="cba-body">
      <div class="acts"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="_gerarLinkAnamnese('${pid}','${esc(nome)}','${esc(phone)}')">Gerar link para o paciente</button></div>
    </div>`);
}
async function _gerarLinkAnamnese(pid, nome, phone){
  const modeloId = document.getElementById("cba-modelo")?.value;
  if(!modeloId){ toast("Selecione um modelo."); return; }
  let r;
  try{ r = await api("POST", `/patients/${pid}/anamnese-remota`, {modeloId}); }
  catch(e){ return; }
  let qrSvg = "";
  try{
    const resp = await fetch(API + `/anamnese-remota/${r.id}/qrcode.svg`, {headers: AUTH_TOKEN?{Authorization:"Bearer "+AUTH_TOKEN}:{}});
    if(resp.ok) qrSvg = await resp.text();
  }catch(e){ /* sem QR, ainda dá pra copiar/enviar o link */ }
  const primeiroNome = (nome||"").split(" ")[0];
  const msg = `Olá ${primeiroNome}! Pode preencher sua anamnese antes da consulta por este link: ${r.link}`;
  // wa() já devolve a URL com o texto percent-encoded (sem aspas nem espaços),
  // por isso é seguro embutir direto num atributo onclick="..." — diferente de
  // interpolar a mensagem crua, que quebraria o HTML se tivesse aspas dentro.
  const waUrl = phone ? wa(phone, msg) : "";
  const body = document.getElementById("cba-body");
  if(body) body.innerHTML = `
    <label class="f"><span>Link</span><input id="anamnese-link-input" value="${esc(r.link)}" readonly onclick="this.select()"></label>
    <div class="acts" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:4px">
      <button class="btn ghost sm" onclick="navigator.clipboard.writeText('${r.link}').then(()=>toast('Link copiado.'))">${IC.upload} Copiar link</button>
      ${phone?`<button class="btn whats sm" onclick="window.open('${waUrl}','_blank')">${IC.send} Enviar pelo WhatsApp</button>`:""}
    </div>
    ${qrSvg?`<div style="margin-top:12px;text-align:center">
      <div style="width:170px;height:170px;margin:0 auto">${qrSvg}</div>
      <p class="meta" style="margin-top:6px">Ou peça pro paciente escanear o QR</p>
    </div>`:""}
    <div class="acts"><button class="btn ghost" onclick="closeModal()">Fechar</button></div>`;
}

async function salvarPlanoSaas(id){
  const g=i=>document.getElementById(i)?.value||"";
  const nome = g("ps-nome").trim();
  const valor = parseMoney(g("ps-valor"));
  if(!nome){ toast("Informe o nome do plano."); return; }
  if(valor<=0){ toast("Informe um valor válido."); return; }
  const payload = {
    nome, valor,
    limitePacientes: g("ps-lim-pac")?parseInt(g("ps-lim-pac")):null,
    limiteProfissionais: g("ps-lim-prof")?parseInt(g("ps-lim-prof")):null,
    ativo: true,
  };
  if(id){ await api("PUT",`/planos-saas/${id}`,payload); } else { await api("POST","/planos-saas",payload); }
  closeModal(); await carregarClinicasAdmin(); toast("Plano salvo.");
}

  modal("⚠️ Excluir clínica definitivamente", `

async function confirmarExcluirClinica(cid, nome){
  const digitado = document.getElementById("excl-clinica-confirma")?.value||"";
  if(digitado.trim() !== nome){ toast("O nome digitado não confere. Nada foi excluído."); return; }
  let r;
  try{ r = await api("DELETE", `/clinicas/${cid}`); }
  catch(e){ return; }
  closeModal();
  if(r && r.dump){
    const blob = new Blob([JSON.stringify(r.dump,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `backup-antes-exclusao-${nome.replace(/[^a-z0-9]+/gi,"-")}-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }
  await carregarClinicasAdmin();
  toast(`Clínica "${nome}" excluída. Backup baixado.`);
}

  try{ r = await api("POST", `/clinicas/${cid}/confirmar-emails`); }

async function aprovarAnamneseRemota(id){
  const g=i=>document.getElementById(i)?.value||"";
  const profissionalId = parseInt(g("ra-revisor"));
  if(!profissionalId){ toast("Selecione quem está revisando."); return; }
  const respostasClinicas = {};
  (window._raPerguntas||[]).forEach(p=>{
    const sel = document.querySelector(`input[name="rq-${p.id}"]:checked`);
    if(sel) respostasClinicas[p.id] = { resposta: sel.value, info: g(`rqi-${p.id}`) };
  });
  const payload = {
    profissionalId,
    birth: g("ra-birth")||null, email:g("ra-email"), rg:g("ra-rg"), orgaoExpedidor:g("ra-orgao"),
    cpf:g("ra-cpf"), estadoCivil:g("ra-civil"), naturalidade:g("ra-natur"), nacionalidade:g("ra-nac"),
    profissao:g("ra-prof"), localTrabalho:g("ra-trab"), enderecoResidencial:g("ra-end"), indicadoPor:g("ra-indic"),
    respNome:g("ra-r-nome"), respRg:g("ra-r-rg"), respCpf:g("ra-r-cpf"), respTelefone:g("ra-r-tel"), respEmail:g("ra-r-email"),
    queixaPrincipal:g("ra-queixa"),
    respostasClinicas,
  };
  try{
    await api("POST", `/anamnese-remota/${id}/aprovar`, payload);
    closeModal(); await reloadAll(); toast("Anamnese confirmada e aplicada ao cadastro. ✅");
  }catch(e){ /* toast já exibido pelo api() */ }
}

async function salvarAnamnesePresencial(pid){

  (modelo?.perguntas||[]).forEach(q=>{

    modeloId, profissionalId,

    queixaPrincipal:g("pap-queixa"),
    respostasClinicas, assinaturaDataUrl,
  };
  let r;
  try{ r = await api("POST", `/patients/${pid}/anamnese-presencial`, payload); }
  catch(e){ return; }
  closeModal(); await reloadAll();
  if(TAB==="ficha" && FICHA_ID===pid){ FICHA_ANAMNESES = await api("GET", `/patients/${pid}/anamneses`); render(); }
  const p = pById(pid);

async function imprimirDocumentoEmitido(id){
  // window.open precisa ser chamado JÁ, sem nenhum await antes — senão o
  // navegador não reconhece mais como gesto do usuário e bloqueia o pop-up.
  const win = window.open("", "_blank");
  if(win) win.document.write("<p style='font-family:sans-serif;padding:40px;color:#666'>Gerando documento…</p>");
  let d;
  try{ d = await api("GET", `/documentos/${id}`); }catch(e){ if(win) win.close(); return; }
  let sigProfUrl = null;
  if(d.profissionalId){
    try{ sigProfUrl = (await api("GET", `/profissionais/${d.profissionalId}/assinatura/url`)).url; }catch(e){ /* segue sem a imagem */ }
  }
  const c = d.conteudo || {};
  const assinaturaHTML = `<div style="text-align:center;margin-top:60px">
    ${sigProfUrl?`<img src="${sigProfUrl}" style="max-height:60px;display:block;margin:0 auto 4px">`:""}
    <div class="doc-sig" style="display:inline-block"><div class="line"></div>${esc(d.profissionalNome)}${d.profissionalCro?" — CRO "+esc(d.profissionalCro):""}</div>
  </div>`;
  let corpo;
  if(d.tipo === "prescricao"){
    corpo = `
      <h1>Receituário</h1>
      <p style="font-size:13px;margin:0 0 14px"><b>Paciente:</b> ${esc(d.patientName)}</p>
      <table>
        <thead><tr><th>Medicamento</th><th>Posologia</th></tr></thead>
        <tbody>${(c.itens||[]).map(it=>`<tr><td>${esc(it.medicamento)}</td><td>${esc(it.posologia)}</td></tr>`).join("")}</tbody>
      </table>
      ${c.observacoes?`<p style="font-size:12.5px;margin-top:10px"><b>Observações:</b> ${esc(c.observacoes)}</p>`:""}
      ${assinaturaHTML}`;
  } else if(d.tipo === "recibo"){
    corpo = `
      <h1>Recibo</h1>
      <p style="font-size:14px;line-height:1.9;margin-top:20px">
        Recebi de <b>${esc(d.patientName)}</b>${d.patientCpf?`, CPF ${esc(d.patientCpf)},`:""} a quantia de <b>${fmtMoney(c.valor||0)}</b>${c.descricao?`, referente a ${esc(c.descricao)}`:""}${c.formaPagamento?`, pago via ${esc(FORMAS_PGTO[c.formaPagamento]||c.formaPagamento)}`:""}${c.dataPagamento?`, em ${fmtDate(c.dataPagamento)}`:""}.
      </p>
      ${assinaturaHTML}`;
  } else {
    const dataFmt = c.dataAtendimento ? fmtDate(c.dataAtendimento) : fmtDate(todayISO());
    corpo = `
      <h1>Atestado Odontológico</h1>
      <p style="font-size:13.5px;line-height:1.9;margin-top:20px">
        Atesto, para os devidos fins, que o(a) paciente <b>${esc(d.patientName)}</b>${d.patientCpf?`, CPF ${esc(d.patientCpf)},`:""}
        esteve sob meus cuidados odontológicos em <b>${dataFmt}</b>${c.horaAtendimento?` às ${esc(c.horaAtendimento)}`:""}${c.motivo?`, devido a ${esc(c.motivo)}`:""}${c.dias?`, necessitando de <b>${c.dias} dia(s)</b> de afastamento de suas atividades a partir desta data`:""}.
        ${c.cid?`<br><br>CID: ${esc(c.cid)}`:""}
      </p>
      ${assinaturaHTML}`;
  }
  const tituloDoc = d.tipo==="prescricao" ? "Receituário" : d.tipo==="recibo" ? "Recibo" : "Atestado";
  _abrirDocImpressao(win, `${tituloDoc} - ${d.patientName}`, corpo);
}

async function imprimirAnamnesePreenchida(aid){

  let d;

  if(d.temAssinatura){
    try{ sigUrl = (await api("GET", `/anamnese-remota/${aid}/assinatura/url`)).url; }catch(e){ /* segue sem a imagem, mantém a linha em branco */ }
  }
  const r = d.respostas || {};
  const respClin = r.respostasClinicas || {};
  const idade = r.birth ? Math.floor((new Date() - new Date(r.birth+"T00:00:00")) / 31557600000) : null;
  const linhasQA = (d.perguntas||[]).map(q=>{
    const rc = respClin[q.id] || {};
    const marca = v => rc.resposta===v ? "☑" : "☐";
    return `<tr><td>${esc(q.texto)}</td><td style="text-align:center;white-space:nowrap">${marca("sim")} Sim &nbsp; ${marca("nao")} Não &nbsp; ${marca("nao_sei")} Não sei</td><td>${esc(rc.info||"")}</td></tr>`;
  }).join("");
  const corpo = `
    <h1>Anamnese${d.modeloNome?` — ${esc(d.modeloNome)}`:""}</h1>
    <p style="font-size:13px;margin:0 0 12px"><b>Paciente:</b> ${esc(d.patientName)}${idade!==null?` &nbsp;·&nbsp; ${idade} anos`:""}</p>
    <table>
      <tbody>
        <tr><td style="width:33%"><b>Nascimento</b><br>${r.birth?fmtDate(esc(r.birth)):"—"}</td><td style="width:33%"><b>CPF</b><br>${esc(r.cpf)||"—"}</td><td><b>RG</b><br>${esc(r.rg)||"—"} ${esc(r.orgaoExpedidor)||""}</td></tr>
        <tr><td><b>Naturalidade</b><br>${esc(r.naturalidade)||"—"}</td><td><b>Nacionalidade</b><br>${esc(r.nacionalidade)||"—"}</td><td><b>Estado civil</b><br>${esc(r.estadoCivil)||"—"}</td></tr>
        <tr><td><b>Profissão</b><br>${esc(r.profissao)||"—"}</td><td colspan="2"><b>Endereço</b><br>${esc(r.enderecoResidencial)||"—"}</td></tr>
      </tbody>
    </table>
    ${r.respNome?`<p style="font-size:12px"><b>Responsável:</b> ${esc(r.respNome)}${r.respCpf?" · CPF "+esc(r.respCpf):""}${r.respTelefone?" · "+esc(r.respTelefone):""}</p>`:""}
    <h2>Queixa principal</h2>
    <p style="font-size:13px;white-space:pre-wrap">${esc(r.queixaPrincipal)||"—"}</p>
    ${linhasQA?`<h2>Perguntas de saúde</h2><table><thead><tr><th>Pergunta</th><th style="text-align:center">Resposta</th><th>Informações adicionais</th></tr></thead><tbody>${linhasQA}</tbody></table>`:""}
    <div style="display:flex;justify-content:space-around;margin-top:50px;gap:20px">
      <div class="doc-sig">${sigUrl?`<img src="${sigUrl}" style="max-height:60px;display:block;margin:0 auto 4px">`:""}<div class="line"></div>Assinatura do Paciente ou Responsável${!sigUrl?`<div style="font-size:9.5px;color:#b91c1c;margin-top:2px">(pendente)</div>`:""}</div>
      <div class="doc-sig"><div class="line"></div>Assinatura do Profissional</div>

   RELATÓRIOS (produção por dentista)

function _relShiftMes(delta){
  let [y,m] = REL_MES.split("-").map(Number);
  m += delta;
  if(m===0){ m=12; y--; } else if(m===13){ m=1; y++; }
  REL_MES = `${y}-${String(m).padStart(2,"0")}`;
  render();
}
function vRelatorios(){
  const mesLabel = (()=>{ const [y,m]=REL_MES.split("-").map(Number);
    return ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"][m-1]+" "+y; })();
  const linha = (nome, cor, profId)=>{
    const match = x => (profId===null ? !x.profissionalId : x.profissionalId===profId);
    const concluidas = DB.appointments.filter(a=>match(a) && a.status==="concluido" && a.date.slice(0,7)===REL_MES).length;
    const agendadas = DB.appointments.filter(a=>match(a) && a.date.slice(0,7)===REL_MES && a.status!=="cancelado").length;
    const recebido = (DB.lancamentos||[]).filter(l=>match(l) && l.pagoEm && l.pagoEm.slice(0,7)===REL_MES).reduce((s,l)=>s+l.valor,0);
    const emAberto = (DB.lancamentos||[]).filter(l=>match(l) && !l.pagoEm).reduce((s,l)=>s+l.valor,0);
    const orcAprov = (DB.orcamentos||[]).filter(o=>match(o) && o.status==="aprovado" && o.data.slice(0,7)===REL_MES);
    const orcAprovTotal = orcAprov.reduce((s,o)=>s+o.total,0);
    if(!agendadas && !recebido && !emAberto && !orcAprov.length) return "";
    return `<div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span class="prof-dot" style="background:${cor};width:12px;height:12px"></span>
        <b style="font-size:14px">${esc(nome)}</b>
      </div>
      <div class="grid g4">
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px">${concluidas}<span style="font-size:12px;color:var(--mut)">/${agendadas}</span></b><span>Concluídas / agendadas</span></div>
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px;color:var(--green)">${fmtMoney(recebido)}</b><span>Recebido no mês</span></div>
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px">${fmtMoney(emAberto)}</b><span>Em aberto (total)</span></div>
        <div class="stat" style="border:none;padding:8px 4px"><b style="font-size:18px">${orcAprov.length}<span style="font-size:12px;color:var(--mut)"> · ${fmtMoney(orcAprovTotal)}</span></b><span>Orçamentos aprovados</span></div>
      </div>
    </div>`;
  };
  const profs = DB.profissionais.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  const corpo = profs.map(p=>linha(p.nome, p.cor, p.id)).join("") + linha("Sem dentista atribuído", "#94a3b8", null);
  return `${header("Relatórios","Produção e faturamento por dentista.")}
  <div class="daynav">
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_relShiftMes(-1)">${IC.left}</button>
    <span style="font-size:14px;font-weight:700;color:#334155">${mesLabel}</span>
    <button class="icon-btn" style="border:1px solid var(--line);background:#fff" onclick="_relShiftMes(1)">${IC.right}</button>
    <button style="color:var(--teal-700);font-weight:600;font-size:14px" onclick="REL_MES=todayISO().slice(0,7);render()">Mês atual</button>
  </div>
  ${corpo || empty("Nenhum movimento neste mês.")}`;
}

function vSurvey(C){
  const surveyed=new Map(DB.surveys.map(s=>[s.appointmentId,s]));
  const done=DB.appointments.filter(a=>a.status==="concluido").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const scores=DB.surveys.filter(s=>s.score!==null&&s.score!==undefined).map(s=>s.score);
  const prom=scores.filter(s=>s>=9).length, det=scores.filter(s=>s<=6).length;
  return header("Pesquisa de satisfação","Envie o NPS após consultas concluídas e registre as notas.")+`
  <div class="grid g3" style="margin-bottom:16px">
    <div class="stat ${C.nps!==null&&C.nps>=50?"good":""}"><b>${C.nps===null?"—":C.nps}</b><span>NPS</span></div>
    <div class="stat"><b>${prom}</b><span>Promotores (9–10)</span></div>
    <div class="stat"><b>${det}</b><span>Detratores (0–6)</span></div>
  </div>`+
  (done.length===0?empty("Nenhuma consulta concluída ainda."):
  done.map(a=>{const p=pById(a.patientId), s=surveyed.get(a.id);
    let actions;
    if(!s) actions=p?`<button class="btn whats sm" onclick="sendSurvey('${a.id}')">${IC.send} Enviar pesquisa</button>`:"";
    else if(s.score===null||s.score===undefined)
      actions=`<div class="score-grid"><span class="meta" style="margin-right:4px">Nota:</span>`+
        Array.from({length:11},(_,i)=>`<button onclick="setScore('${s.id}',${i})">${i}</button>`).join("")+`</div>`;
    else { const cls=s.score>=9?"hi":s.score>=7?"mid":"lo"; actions=`<span class="note ${cls}">Nota ${s.score}</span>`; }
    return queueCard(p?p.name:"Paciente removido",a.procedure+" em "+fmtDate(a.date),
      s&&(s.score===null||s.score===undefined)?"Enviada em "+fmtDate(s.sentAt)+" — aguardando nota":null,actions);
  }).join(""));
}
async function sendSurvey(apptId){
  const a=DB.appointments.find(x=>x.id===apptId), p=pById(a.patientId); if(!p)return;
  const msg=fill(DB.settings.msgSurvey||"",{nome:p.name.split(" ")[0]});

  await api("POST","/surveys",{appointmentId:apptId,patientId:a.patientId,sentAt:todayISO(),score:null,reviewSent:false});
  await reloadAll();
}
async function setScore(id,score){
  const s=DB.surveys.find(x=>x.id===id);

  await reloadAll(); toast("Nota registrada.");
}

function renderChatMsgsHTML(){

    return `<div class="chat-msg ${mine?"mine":"other"}">

}
function setupChatUI(){

async function sendChat(){
  const inp = document.getElementById("chat-inp");

function handleLogoFileInput(inputEl, tipo){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ toast("Selecione uma imagem."); return; }
  if(file.size > 5*1024*1024){ toast("Imagem maior que 5 MB."); return; }
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = async () => {
    URL.revokeObjectURL(url);
    const MAXD = 400;
    let w = img.width, h = img.height;
    if(w > MAXD || h > MAXD){ const r = Math.min(MAXD/w, MAXD/h); w = Math.round(w*r); h = Math.round(h*r); }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    const dataUrl = canvas.toDataURL("image/png");
    try{
      const endpoint = tipo === "clinica" ? "/clinica/logo" : "/plataforma/logo";
      await api("POST", endpoint, {dataUrl});
      toast("Logo atualizada. 🖼️");
      if(tipo === "clinica"){ await carregarMinhaClinica(); } else { await carregarPlataforma(); }
      render();
    }catch(e){ /* toast já exibido pelo api() */ }
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast("Não foi possível ler essa imagem."); };
  img.src = url;
  inputEl.value = "";
}

async function importBackup(input){

  const reader=new FileReader();
  reader.onload=async()=>{

      await api("POST","/import",d);
      await reloadAll(); toast("Backup importado com sucesso!");
    }catch(e){ toast("Arquivo inválido."); }

}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
async function checkPushStatus(){
  if(!PUSH_SUPPORTED) return;
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    PUSH_SUBSCRIBED = !!sub;
  }catch(e){ PUSH_SUBSCRIBED = false; }
  const statusEl = document.getElementById("push-status");
  const btnEl = document.getElementById("push-toggle-btn");
  if(statusEl) statusEl.textContent = PUSH_SUBSCRIBED ? "Ativadas neste dispositivo ✓" : "Desativadas neste dispositivo";
  if(btnEl){ btnEl.textContent = PUSH_SUBSCRIBED?"Desativar":"Ativar"; btnEl.classList.toggle("ghost",PUSH_SUBSCRIBED); }
  const testBtn = document.querySelector("button[onclick='testPush()']");
  if(testBtn) testBtn.disabled = !PUSH_SUBSCRIBED;
}
async function togglePush(){
  if(!PUSH_SUPPORTED){ toast("Seu navegador não suporta notificações push."); return; }
  const reg = await navigator.serviceWorker.ready;
  if(PUSH_SUBSCRIBED){
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      await api("POST","/push/unsubscribe",{endpoint:sub.endpoint});
      await sub.unsubscribe();
    }
    PUSH_SUBSCRIBED=false; toast("Notificações desativadas.");
  } else {
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ toast("Permissão de notificação negada."); return; }
    const {publicKey} = await api("GET","/push/vapid-public-key");
    if(!publicKey){ toast("Notificações indisponíveis: chaves VAPID não configuradas no servidor."); return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey: urlBase64ToUint8Array(publicKey)
    });
    await api("POST","/push/subscribe",{
      endpoint:sub.endpoint,
      keys:{ p256dh: arrayBufferToBase64(sub.getKey("p256dh")), auth: arrayBufferToBase64(sub.getKey("auth")) },
      profissionalId: CHAT_PROF_ID, label: navigator.userAgent.slice(0,60)
    });
    PUSH_SUBSCRIBED=true; toast("Notificações ativadas!");
  }
  render();
}
function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  let str="";
  for(const b of bytes) str+=String.fromCharCode(b);
  return btoa(str).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function testPush(){
  const r = await api("POST","/push/test",{profissionalId: CHAT_PROF_ID});
  toast(r.sent>0 ? `Notificação enviada (${r.sent}).` : "Nenhuma inscrição ativa encontrada.");
}

async function authSubmit(setup){
  const g=i=>document.getElementById(i)?.value;
  const login=(g("lg-email")||"").trim(), senha=g("lg-senha")||"";
  if(!login || !senha){ toast(setup?"Preencha e-mail e senha.":"Preencha login e senha."); return; }
  try{
    const r = setup
      ? await api("POST","/auth/setup",{nome:(g("lg-nome")||"").trim()||login.split("@")[0], email:login, senha})
      : await api("POST","/auth/login",{login, senha});
    AUTH_TOKEN = r.token; AUTH_NOME = r.nome;
    localStorage.setItem("crm_token", AUTH_TOKEN);
    localStorage.setItem("crm_nome", AUTH_NOME);
    document.getElementById("login-screen")?.remove();
    await carregarMinhaClinica();
    await reloadAll();
    if(QR_PACIENTE_ALVO){ const alvo = QR_PACIENTE_ALVO; QR_PACIENTE_ALVO = null; openFicha(alvo); }
    else toast(`Bem-vindo, ${AUTH_NOME.split(" ")[0]}! 👋`);
  }catch(e){
    if(e.message && e.message.includes("Confirme seu e-mail")){
      const card = document.getElementById("login-card");
      if(card && !document.getElementById("lg-resend-link")){
        card.insertAdjacentHTML("beforeend", `<p id="lg-resend-link" style="text-align:center;margin-top:10px;font-size:13px"><a href="#" onclick="resendVerification('${login.replace(/'/g,"")}');return false" style="color:var(--teal-700);font-weight:600">Reenviar e-mail de confirmação</a></p>`);
      }
    }
  }
}
async function signupSubmit(){
  const g=i=>document.getElementById(i)?.value;
  const clinicaNome=(g("lg-clinica")||"").trim(), nome=(g("lg-nome")||"").trim();
  const email=(g("lg-email")||"").trim(), senha=g("lg-senha")||"";
  const whatsapp=(g("lg-whatsapp")||"").trim();
  if(!clinicaNome || !nome || !email || !senha || !whatsapp){ toast("Preencha todos os campos, incluindo o WhatsApp."); return; }
  if(digits(whatsapp).length<10){ toast("Informe um WhatsApp válido."); return; }
  if(senha.length<8){ toast("A senha precisa de pelo menos 8 caracteres."); return; }
  try{
    await api("POST","/signup",{
      clinicaNome, nome, email, senha,
      responsavelTecnico: (g("lg-resp-tecnico")||"").trim(),
      croResponsavel: (g("lg-cro")||"").trim(),
      cnpj: (g("lg-cnpj")||"").trim(),
      enderecoCompleto: (g("lg-endereco")||"").trim(),
      telefoneWhatsapp: whatsapp,
      emailClinica: (g("lg-email-clinica")||"").trim(),
    });
    const card = document.getElementById("login-card");
    if(card){
      card.innerHTML = `<div style="text-align:center;padding:12px 0">
        <div style="font-size:40px;margin-bottom:10px">📧</div>
        <h2 style="font-size:16px;margin-bottom:8px">Confirme seu e-mail</h2>
        <p class="meta" style="margin-bottom:16px">Enviamos um link de confirmação para <b>${esc(email)}</b>. Clique nele para ativar sua clínica.</p>
        <a href="#" onclick="LOGIN_MODE='login';showLogin();return false" style="color:var(--teal-700);font-weight:600;font-size:13px">Voltar para o login</a>
      </div>`;
    }
  }catch(e){ /* toast já exibido pelo api() */ }
}
async function resendVerification(email){
  try{
    await api("POST","/resend-verification",{email});
    toast("Se o e-mail existir, reenviamos a confirmação. Confira sua caixa de entrada.");
  }catch(e){ /* toast já exibido pelo api() */ }
}
async function logout(){
  try{ await api("POST","/auth/logout"); }catch(e){}
  AUTH_TOKEN=""; AUTH_NOME=""; AUTH_IS_SUPERADMIN=false;
  MINHA_CLINICA = { nome:"", responsavelTecnico:"", croResponsavel:"", cnpj:"", enderecoCompleto:"", telefoneWhatsapp:"", email:"", logoUrl:null };
  localStorage.removeItem("crm_token"); localStorage.removeItem("crm_nome");
  showLogin();
}
async function openUsuariosModal(){
  const usuarios = await api("GET","/usuarios");
  modal("Equipe e acesso",`
    ${usuarios.map(u=>`
      <div class="row">
        <div class="avatar">${initials(u.nome)}</div>
        <div class="grow">
          <div style="font-weight:500;font-size:14px">${esc(u.nome)} ${!u.ativo?'<span class="pill p-cancelado">Inativo</span>':""}</div>
          <div class="meta">${esc(u.login)}</div>
        </div>
        <button class="btn ghost sm" onclick="openUsuarioForm(${u.id},'${esc(u.nome)}','${esc(u.login)}',${u.ativo})">Editar</button>
      </div>`).join("")}

function openUsuarioForm(id, nome, login, ativo){
  modal(id?"Editar usuário":"Novo usuário",`
    <label class="f"><span>Nome *</span><input id="u-nome" value="${nome||""}"></label>
    <label class="f"><span>Login *</span><input id="u-login" value="${login||""}" placeholder="E-mail, ou só um nome de usuário (ex: maria)"></label>
    <p class="meta" style="margin:-6px 0 11px">Pode ser o e-mail da pessoa, ou só um nome simples pra quem não usa e-mail no dia a dia — tipo "recepcao" ou o primeiro nome dela.</p>
    <label class="f"><span>${id?"Nova senha (deixe vazio para manter)":"Senha * (mínimo 8 caracteres)"}</span>
      <div style="position:relative">
        <input id="u-senha" type="password" autocomplete="new-password" style="padding-right:38px">
        <button type="button" onclick="toggleSenhaVisibility('u-senha',this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px;color:var(--soft)" aria-label="Mostrar senha" title="Mostrar senha">${IC.eye}</button>
      </div>
    </label>
    ${id?`<label class="f"><span>Status</span><select id="u-ativo"><option value="true" ${ativo?"selected":""}>Ativo</option><option value="false" ${!ativo?"selected":""}>Inativo</option></select></label>`:""}
    <div class="acts"><button class="btn ghost" onclick="openUsuariosModal()">Voltar</button>
    <button class="btn" onclick="saveUsuario(${id||0})">Salvar</button></div>`);
}
async function saveUsuario(id){
  const g=i=>document.getElementById(i)?.value;
  const payload = {
    nome:(g("u-nome")||"").trim(), login:(g("u-login")||"").trim(),
    senha:g("u-senha")||null,
    ativo: id ? g("u-ativo")==="true" : true,
  };
  if(!payload.nome || !payload.login){ toast("Preencha nome e login."); return; }
  if(id){ await api("PUT",`/usuarios/${id}`,payload); }
  else {
    if(!payload.senha){ toast("Defina uma senha para o novo usuário."); return; }
    await api("POST","/usuarios",payload);
  }
  toast("Usuário salvo.");
  openUsuariosModal();
}

function header(title,sub,action){ return `<div class="hd"><div><h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${action||""}</div>`; }
function empty(t){ return `<div class="empty">${t}</div>`; }
function pill(s){ return `<span class="pill p-${s}">${STATUS[s]||s}</span>`; }
function queueCard(name,meta,flag,actions){
  return `<div class="card" style="margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div class="grow"><div style="font-weight:500;font-size:14px">${esc(name)}</div><div class="meta">${esc(meta)}</div>
    ${flag?`<div class="flag">${esc(flag)}</div>`:""}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${actions}</div></div>`;
}
function modal(title,body){
  closeModal();
  const bg=document.createElement("div"); bg.className="modal-bg"; bg.id="modalBg";
  bg.innerHTML=`<div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hd"><h2>${title}</h2><button class="icon-btn" onclick="closeModal()">${IC.x}</button></div>${body}</div>`;
  // Antes fechava ao tocar fora do modal — perigoso em formulário com dados
  // digitados (um toque sem querer na borda apagava tudo). Agora só fecha
  // pelo X ou por um botão explícito (Cancelar/Fechar) dentro do modal.
  document.body.appendChild(bg);
}
function closeModal(){ document.getElementById("modalBg")?.remove(); }
function toggleSenhaVisibility(id, btn){
  const inp = document.getElementById(id);
  if(!inp) return;
  inp.type = inp.type === "password" ? "text" : "password";
  btn.style.color = inp.type === "text" ? "var(--teal-700)" : "var(--soft)";
}

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(()=>{
      checkPushStatus().then(()=>{ if(TAB==="settings") render(); });
    }).catch(()=>{});
  });
}

      <div class="grid g2">
        <label class="f"><span>RG</span><input id="ap-rg"></label>
        <label class="f"><span>Órgão expedidor</span><input id="ap-orgao"></label>
      </div>
      <div class="grid g2">
        <label class="f"><span>CPF</span><input id="ap-cpf" placeholder="000.000.000-00"></label>
        <label class="f"><span>Estado civil</span><input id="ap-civil"></label>
      </div>
      <div class="grid g2">
        <label class="f"><span>Naturalidade</span><input id="ap-natur"></label>
        <label class="f"><span>Nacionalidade</span><input id="ap-nac" value="Brasileira"></label>
      </div>
      <div class="grid g2">
        <label class="f"><span>Profissão</span><input id="ap-prof"></label>
        <label class="f"><span>Local de trabalho</span><input id="ap-trab"></label>
      </div>
      <label class="f"><span>Endereço residencial</span><input id="ap-end"></label>
      <label class="f"><span>Indicado por</span><input id="ap-indic" placeholder="Opcional"></label>
    </div>
    <details style="margin-bottom:16px">
      <summary style="cursor:pointer;font-size:13.5px;font-weight:600;color:#0f766e;padding:6px 0">👨‍👩‍👧 Sou responsável por um paciente menor de idade</summary>
      <div class="card" style="margin-top:8px">
        <label class="f"><span>Seu nome</span><input id="ap-r-nome"></label>
        <div class="grid g2">
          <label class="f"><span>RG</span><input id="ap-r-rg"></label>
          <label class="f"><span>CPF</span><input id="ap-r-cpf"></label>
        </div>
        <div class="grid g2">
          <label class="f"><span>Telefone</span><input id="ap-r-tel"></label>
          <label class="f"><span>E-mail</span><input id="ap-r-email"></label>
        </div>
      </div>
    </details>
    <div class="card" style="margin-bottom:16px">
      <h2>Assinatura</h2>
      <p class="meta" style="margin-bottom:8px">Assine abaixo confirmando as respostas — com o dedo (touch) ou o mouse. Se não conseguir agora, pode deixar em branco e assinar depois na clínica.</p>
      <div style="border:1px solid #cbd5e1;border-radius:8px;background:#fff">
        <canvas id="sig-canvas" width="440" height="150" style="width:100%;height:150px;display:block;cursor:crosshair;touch-action:none"></canvas>
      </div>
      <button type="button" class="btn ghost sm" style="margin-top:6px" onclick="limparAssinaturaCanvas()">Limpar</button>
    </div>
    <button id="ap-enviar-btn" style="width:100%;padding:13px;background:#0f766e;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">Enviar anamnese</button>
    <p style="text-align:center;font-size:11.5px;color:#94a3b8;margin-top:10px">Seus dados vão direto para a clínica e não são compartilhados com terceiros.</p>
  `;
  // Alguns navegadores restauram seleções antigas de rádio ao recarregar a
  // mesma página (mesmo sem <form>, mesmo com autocomplete="off" no input) —
  // por segurança, força tudo desmarcado logo após montar o HTML.
  root.querySelectorAll('input[type="radio"]').forEach(r => { r.checked = false; });
  initAssinaturaCanvas();
  document.getElementById("ap-enviar-btn").addEventListener("click", async () => {
    const g = i => document.getElementById(i)?.value || "";
    const btn = document.getElementById("ap-enviar-btn");
    btn.disabled = true; btn.textContent = "Enviando…";
    const respostasClinicas = {};
    (d.perguntas||[]).forEach(p=>{
      const sel = document.querySelector(`input[name="apq-${p.id}"]:checked`);
      if(sel) respostasClinicas[p.id] = { resposta: sel.value, info: g(`apqi-${p.id}`) };
    });
    const assinaturaDataUrl = SIGPAD_HASDATA ? document.getElementById("sig-canvas").toDataURL("image/png") : "";
    try{
      const r = await fetch(API + "/anamnese-publica/" + encodeURIComponent(token), {
        method: "POST", headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          birth: g("ap-birth")||null, email:g("ap-email"), rg:g("ap-rg"), orgaoExpedidor:g("ap-orgao"),
          cpf:g("ap-cpf"), estadoCivil:g("ap-civil"), naturalidade:g("ap-natur"), nacionalidade:g("ap-nac"),
          profissao:g("ap-prof"), localTrabalho:g("ap-trab"), enderecoResidencial:g("ap-end"), indicadoPor:g("ap-indic"),
          respNome:g("ap-r-nome"), respRg:g("ap-r-rg"), respCpf:g("ap-r-cpf"), respTelefone:g("ap-r-tel"), respEmail:g("ap-r-email"),
          queixaPrincipal:g("ap-queixa"),
          respostasClinicas, assinaturaDataUrl,
        }),
      });
      if(!r.ok) throw new Error("falhou");
      root.innerHTML = `<div style="text-align:center;padding:60px 20px">
        <div style="font-size:40px;margin-bottom:10px">✅</div>
        <h2 style="font-size:17px;margin-bottom:8px">Enviado!</h2>
        <p style="color:#64748b;font-size:14px">A clínica vai revisar antes da sua consulta. Obrigado!</p>
      </div>`;
    }catch(e){
      btn.disabled = false; btn.textContent = "Enviar anamnese";
      alert("Não foi possível enviar. Verifique sua conexão e tente de novo.");
    }
  });
}

(async function boot(){
  if(PORTAL_TOKEN){ await renderPortalPaciente(PORTAL_TOKEN); return; }
  if(ANAMNESE_TOKEN){ await renderAnamnesePublica(ANAMNESE_TOKEN); return; }
  const params = new URLSearchParams(window.location.search);
  const verifyToken = params.get("verify");
  if(verifyToken){
    history.replaceState(null, "", window.location.pathname); // limpa o token da URL
    try{
      const r = await fetch(API + "/verify-email?token=" + encodeURIComponent(verifyToken)).then(async res=>{
        if(!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.detail || "Link inválido."); }
        return res.json();
      });
      AUTH_TOKEN = r.token; AUTH_NOME = r.nome;
      localStorage.setItem("crm_token", AUTH_TOKEN);
      localStorage.setItem("crm_nome", AUTH_NOME);
      await carregarMinhaClinica();
      await reloadAll();
      toast(`E-mail confirmado — bem-vindo(a), ${AUTH_NOME.split(" ")[0]}! 🎉`);
      return;
    }catch(e){
      toast(e.message || "Não foi possível confirmar o e-mail.");
      // segue para o fluxo normal de login abaixo
    }
  }
  if(!AUTH_TOKEN){ showLogin(); return; }
  try {
    await carregarMinhaClinica(); await reloadAll();
    if(QR_PACIENTE_ALVO){ const alvo = QR_PACIENTE_ALVO; QR_PACIENTE_ALVO = null; openFicha(alvo); }
  }
  catch(e){ /* 401 já redireciona para o login dentro do api() */ }
})();
</script>
</body>
</html>
