services:
  - type: web
    name: crm-moura-v2
    runtime: python
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/auth/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: crm_v2
      - key: SUPABASE_URL
        value: https://ahunkumobdexrcrrppvs.supabase.co
      - key: SUPABASE_BUCKET
        value: prontuarios-v2
      - key: SUPABASE_SERVICE_KEY
        sync: false
